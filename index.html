CONTENT.ord.explain = "<p>Когда в примере несколько действий, важно знать, в каком порядке их выполнять — иначе один и тот же пример у разных людей даст разные ответы. Математики договорились о строгих правилах, и их нужно соблюдать всегда.</p><h3>Правило трёх шагов</h3><ul><li><b>Шаг 1.</b> Сначала выполняются действия <b>в скобках</b> — какие бы они ни были, сложение или умножение.</li><li><b>Шаг 2.</b> Затем — <b>умножение и деление</b>, по порядку слева направо, как они встречаются в примере.</li><li><b>Шаг 3.</b> И только потом — <b>сложение и вычитание</b>, тоже слева направо.</li></ul><p>Например: 12 + 8 · 3. Умножение выполняется первым, хотя стоит правее: 8 · 3 = 24. Потом сложение: 12 + 24 = 36. А вот в примере (12 + 8) · 3 скобки заставляют сначала сложить: 12 + 8 = 20, и только потом умножить: 20 · 3 = 60. Один и тот же набор чисел — разный порядок — разный ответ!</p><div class=\"figure\">__SVG_ORD_LADDER__</div><p>Удобно представлять правила как <b>лесенку приоритета</b>: скобки — верхняя ступень, их делают первыми; ниже идут умножение и деление, и лишь на самой нижней ступени — сложение и вычитание. Внутри каждой ступени (стрелка «слева направо») действия идут по порядку. На схеме: (2 + 3) · 4 = 20 — сначала скобки; 24 : 6 · 2 = 8 — деление и умножение по очереди слева направо (24 : 6 = 4, потом 4 · 2 = 8); 10 − 3 + 4 = 11 — вычитание, затем сложение.</p><h3>Как решать длинный пример без ошибок</h3><p>Секрет — не считать всё «в уме за один раз», а расписывать <b>по действиям</b>, нумеруя их: ①, ②, ③… Так легко проверить себя и найти, где закралась ошибка.</p><p>Пример: (36 + 14) · 2 − 100 : 5.</p><ul><li>① Скобки: 36 + 14 = 50.</li><li>② Умножение: 50 · 2 = 100.</li><li>③ Деление: 100 : 5 = 20.</li><li>④ Вычитание: 100 − 20 = 80.</li></ul><div class=\"figure\">__SVG_ORD_TREE__</div><p>Тот же пример можно нарисовать <b>деревом</b>. Внизу стоят числа, а «узлы» — это действия. Считаем снизу вверх: сначала узел ① (36 + 14 = 50), потом ② (50 · 2 = 100). Отдельная «ветка» с делением ③ (100 : 5 = 20) считается независимо. В самом верху узел ④ соединяет обе ветки: 100 − 20 = 80. Чем ниже узел на дереве, тем раньше он считается.</p><p>Если в примере есть <b>вложенные скобки</b> — скобки внутри скобок, например (45 − (7 + 8)) · 2 — начинают с самых внутренних: 7 + 8 = 15, потом 45 − 15 = 30, и уже потом 30 · 2 = 60.</p><div class=\"note\"><span class=\"hand\">Запомни</span>Внутри одного «уровня» (только сложение-вычитание или только умножение-деление) действия выполняются строго слева направо, а не «сначала всё умножение, потом всё деление».</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>В примере 100 − 20 + 5 многие сначала складывают 20 + 5 = 25, а потом вычитают: 100 − 25 = 75. Это неверно! Сложение и вычитание равноправны и идут по порядку слева направо: 100 − 20 = 80, затем 80 + 5 = 85.</div>";
CONTENT.frac.explain = "<p>Дробь {a|b} показывает: целое разделили на <b>b</b> равных частей и взяли <b>a</b> из них. Число под чертой — <b>знаменатель</b>, над чертой — <b>числитель</b>.</p><div class=\"figure\">__SVG_PIE__</div><h3>Основное свойство дроби</h3><p>Если числитель и знаменатель умножить (или разделить) на одно и то же число, не равное нулю, дробь не изменится: {1|2} = {2|4} = {5|10}. Деление на общий делитель — это <b>сокращение</b>: {18|24} = {3|4} (разделили на 6).</p><div class=\"figure\">__SVG_FRAC_STRIPS__</div><p>Смотри на «стену дробей»: все полосы одинаковой длины. Пунктир посередине показывает, что {1|2}, {2|4}, {3|6} и {6|12} закрывают одну и ту же часть полосы, то есть {1|2} = {2|4} = {3|6} = {6|12}. Значит, дробь можно записать по-разному, а её величина не меняется.</p><h3>Четыре действия</h3><ul><li><b>Сложение и вычитание.</b> Сначала общий знаменатель, потом действие с числителями: {1|2} + {1|3} = {3|6} + {2|6} = {5|6}.</li><li><b>Умножение.</b> Числитель на числитель, знаменатель на знаменатель: {2|3} · {3|4} = {6|12} = {1|2}.</li><li><b>Деление.</b> Умножаем на «перевёрнутую» дробь: {2|3} : {4|5} = {2|3} · {5|4} = {10|12} = {5|6}.</li></ul><p>Вот как это выглядит на картинке. Половину и треть нельзя сложить напрямую: части разного размера. Поэтому обе полоски делим на 6 равных частей: {1|2} — это 3 части из 6 (умножили на 3), {1|3} — 2 части из 6 (умножили на 2). Теперь части одинаковые, закрашенные складываем: 3 + 2 = 5 частей из 6.</p><div class=\"figure\">__SVG_FRAC_ADD__</div><h3>Смешанные числа</h3><p>1{3|4} — это 1 + {3|4}. Чтобы перейти к неправильной дроби: (1 · 4 + 3) / 4 = {7|4}. Перед умножением и делением смешанные числа всегда переводим в неправильные дроби.</p><div class=\"figure\">__SVG_FRAC_NUMLINE__</div><p>На числовой прямой дроби тоже занимают своё место: {1|2} лежит ровно посередине между 0 и 1, а 1{3|4} — между 1 и 2, ближе к 2. На схеме у 1{3|4} видно две части: целая часть — 1, дробная часть — {3|4}, то есть 1{3|4} = 1 + {3|4} = {7|4}. Точка 1{1|4} стоит на одно деление правее единицы.</p><div class=\"note\"><span class=\"hand\">Запомни</span>Складывать и вычитать можно только дроби с одинаковыми знаменателями.</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>{1|2} + {1|3} = {2|5} — так делать нельзя. Проверка здравым смыслом: {2|5} меньше, чем {1|2}, а сумма не может быть меньше слагаемого.</div>";
CONTENT.dec.explain = "<p>Десятичная дробь — это обыкновенная дробь со знаменателем 10, 100, 1000 и так далее, записанная через запятую. Например, {7|10} = 0,7; {35|100} = 0,35; {125|1000} = 0,125. Цифры после запятой — это разряды: первая цифра — десятые, вторая — сотые, третья — тысячные.</p><div class=\"figure\">__SVG_DEC_PLACE__</div><p>Разберём число 3,405 по таблице разрядов: 3 — единицы, 4 — десятые, 0 — сотые, 5 — тысячные. Значит, 3,405 = 3 + {4|10} + {0|100} + {5|1000}. Обрати внимание: ноль в разряде сотых тоже занимает своё место — без него получилось бы совсем другое число (3,45).</p><p>Ещё наглядней: возьмём квадрат из 100 клеток.</p><div class=\"figure\">__SVG_DEC_GRID__</div><p>Закрашены 3 полных столбца (это 30 клеток) и ещё 5 клеток — всего 35 из 100. Это {35|100} = 0,35 (и 35%: об этом — в теме про проценты).</p><h3>Сложение и вычитание</h3><p>Десятичные дроби складывают и вычитают <b>столбиком</b>, обязательно подписывая запятую под запятой — тогда одинаковые разряды окажутся друг под другом. Если не хватает цифр после запятой, дописывают нули: 3,4 = 3,40.</p><p>3,40 + 2,15 = 5,55; 7,80 − 4,35 = 3,45.</p><h3>Умножение</h3><p>Десятичные дроби умножают как обычные числа, не обращая внимания на запятую, а потом в ответе отделяют запятой справа столько цифр, сколько их было после запятой в обоих множителях вместе. 2,4 · 3 = 24 · 3 = 72, после запятой была одна цифра — значит в ответе 7,2.</p><h3>Деление</h3><p>Чтобы разделить на десятичную дробь, в делимом и делителе переносят запятую на одинаковое число знаков вправо, чтобы делитель стал целым числом. 4,8 : 1,2 — переносим запятую на 1 знак в обоих числах: 48 : 12 = 4.</p><div class=\"figure\">__SVG_NUMLINE__</div><p>На числовой прямой десятичные дроби располагаются между целыми числами: 0,7 лежит между 0 и 1, ближе к 1, а 2,25 — между 2 и 3, ближе к 2.</p><h3>Перевод в обыкновенную дробь и обратно</h3><p>Чтобы записать десятичную дробь обыкновенной, читают её вслух: «ноль целых тридцать пять сотых» = {35|100} = {7|20} (сократили на 5). Чтобы обыкновенную дробь превратить в десятичную, числитель делят на знаменатель столбиком: {3|4} = 3 : 4 = 0,75.</p><h3>Округление</h3><p>Чтобы округлить число до нужного разряда, смотрят на следующую за ним цифру: если она 5 или больше — цифру разряда увеличивают на 1, если меньше 5 — оставляют без изменений, а все цифры после отбрасывают. Округлим 4,673 до десятых: следующая цифра — 7, значит увеличиваем 6 до 7: получаем 4,7.</p><div class=\"figure\">__SVG_DEC_ROUND__</div><p>На схеме показан увеличенный кусочек числовой прямой между 4,6 и 4,8. Число 4,673 стоит правее границы 4,65 (середина между 4,6 и 4,7), поэтому оно ближе к 4,7. Правило «5 и больше» как раз и есть эта граница: левее 4,65 округляем вниз до 4,6, правее — вверх до 4,7.</p><div class=\"note\"><span class=\"hand\">Запомни</span>Нули в конце десятичной дроби после запятой можно дописывать и убирать — от этого значение числа не меняется: 3,4 = 3,40 = 3,400.</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>При сложении столбиком 3,4 + 2,15 некоторые складывают «в столбик как целые», не выравнивая запятую, и получают неверный результат вроде 3,55. Всегда дописывай нули, чтобы после запятой было одинаковое количество цифр: 3,40 + 2,15 = 5,55.</div>";
CONTENT.perc.explain = "<p>Процент — это одна сотая часть: 1% = {1|100} = 0,01. Поэтому 50% = 0,5 = {1|2}; 25% = {1|4}; 10% = 0,1.</p><div class=\"figure\">__SVG_PERC_GRID__</div><p>Квадрат разбит на 100 клеток — каждая клетка это 1%. Закрашены 2 столбца (20 клеток) и ещё 5 клеток: всего 25 клеток, то есть 25% = {25|100} = {1|4} = 0,25.</p><h3>Три основные задачи</h3><ul><li><b>Найти p% от числа.</b> Число · p : 100. Например, 15% от 240: 240 · 0,15 = 36.</li><li><b>Сколько процентов одно число составляет от другого.</b> (часть : целое) · 100%. Например, 18 от 72: 18 : 72 = 0,25, то есть 25%.</li><li><b>Найти число по его части.</b> Часть : p · 100. Если 20% числа равны 14, то 1% равен 0,7, а всё число — 70.</li></ul><div class=\"figure\">__SVG_PERC_BARS__</div><p>Двойная шкала помогает увидеть, как связаны проценты и величина: 100% — это всё число (на схеме 240), а 15% соответствует отрезку длиной 36. Проверка: 240 · 0,15 = 36.</p><h3>Скидки и наценки</h3><p>Цена выросла на 15% — новая цена равна старой, умноженной на 1,15. Цена снизилась на 30% — новая цена равна старой, умноженной на 0,7.</p><h3>Проценты друг за другом (две операции подряд)</h3><p>Если сначала цену подняли на 10%, а потом снизили на 20%, нельзя просто вычесть 20% − 10% = 10%. Каждый следующий процент считается от <b>уже изменённой</b> цены: 100 → 100 · 1,1 = 110 → 110 · 0,8 = 88. Итоговое изменение — не 10%, а 12% (со знаком минус).</p><div class=\"figure\">__SVG_PERC_STEPS__</div><p>На схеме видно: цена 100 ₽ после +10% стала 110 ₽, а после −20% от <b>110 ₽</b> стала 88 ₽. Это на 12 ₽ ниже исходной, то есть −12%, а не −10%.</p><div class=\"note\"><span class=\"hand\">Быстрый приём</span>10% от числа — сдвинуть запятую на один знак влево. 5% — половина от 10%. 1% — сдвинуть запятую на два знака. 12,5% — это {1|8}, то есть раздели число на 8.</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>Скидка 20%, а потом наценка 20% — цена не возвращается к прежней: 100 → 80 → 96. Каждый раз проценты считаются от <b>новой</b> цены, а не от исходной.</div>";
CONTENT.neg.explain = "<p>Числа можно расположить на прямой: справа от нуля — положительные, слева — отрицательные. Чем правее число, тем оно больше. Поэтому −1 &gt; −5, а любое отрицательное число меньше нуля.</p><div class=\"figure\">__SVG_NUMLINE__</div><p><b>Модуль</b> числа — расстояние от него до нуля: |−7| = 7, |4| = 4. Модуль никогда не бывает отрицательным.</p><div class=\"figure\">__SVG_NEG_MOVES__</div><p>На схеме числа −4 и 4 стоят по разные стороны от нуля, но расстояние до нуля у обоих одинаковое: |−4| = 4 и |4| = 4. Ещё на схеме показано сложение как движение: −3 + 5 = 2 — из точки −3 сдвигаемся на 5 вправо. Прибавляем положительное число — идём вправо, отрицательное — влево.</p><h3>Сложение</h3><ul><li>Знаки одинаковые: складываем модули, знак сохраняем. −3 + (−4) = −7.</li><li>Знаки разные: из большего модуля вычитаем меньший, знак берём у числа с большим модулем. −9 + 5 = −4; −2 + 6 = 4.</li></ul><p>Удобно представить термометр. Утром было −7°, потеплело на 12°: −7 + 12 = 5, стало +5°. К вечеру похолодало на 9°: 5 − 9 = −4, стало −4°. Вверх по шкале — прибавляем, вниз — вычитаем.</p><div class=\"figure\">__SVG_NEG_THERMO__</div><h3>Вычитание</h3><p>Вычесть число — значит прибавить противоположное: 3 − (−2) = 3 + 2 = 5; −4 − 6 = −4 + (−6) = −10.</p><h3>Умножение и деление</h3><p>Одинаковые знаки — результат положительный, разные — отрицательный. (−6) · (−3) = 18; (−20) : 4 = −5; 5 · (−2) = −10.</p><h3>Длинные выражения</h3><p>Если в выражении несколько действий, сначала выполняем умножение и деление по порядку, потом сложение и вычитание — как обычно. Каждый минус перед скобкой нужно аккуратно «раздать» внутрь: −(4 − 7) = −4 + 7 = 3.</p><div class=\"note\"><span class=\"hand\">Запомни</span>Несколько минусов подряд считай по количеству: чётное число множителей-минусов даёт плюс, нечётное — минус. Например, в (−2)·(−3)·(−4) минусов три (нечётно) — результат отрицательный.</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>−3 + (−4) считают как −3 + 4 = 1. Скобки с минусом внутри — это отрицательное число, его нужно прибавить, а не «убрать». Другая частая ошибка: запись (−3)^2 путают с −3^2 — в первом случае возводится в квадрат отрицательное число целиком и получается 9, а во втором сначала считают 3^2 = 9 и лишь потом ставят минус, получая −9.</div>";
CONTENT.geo.explain = "<p><b>Периметр</b> — сумма длин всех сторон (длина «забора» вокруг фигуры, измеряется в см, м…). <b>Площадь</b> — сколько единичных квадратиков помещается внутри (измеряется в см², м²…).</p><div class=\"figure\">__SVG_RECT__</div><h3>Формулы</h3><ul><li>Прямоугольник: P = 2(a + b), S = a · b.</li><li>Квадрат: P = 4a, S = a².</li><li>Параллелограмм: S = a · h (основание на высоту, проведённую к нему).</li><li>Треугольник: S = {1|2} · a · h.</li><li>Трапеция: S = {a + b|2} · h (полусумма оснований на высоту).</li></ul><p>Посмотри на схему: у каждой фигуры основание a выделено синим, а высота h (для прямоугольника — сторона b) — красным пунктиром; у трапеции добавляется второе основание b. Видно, что высота всегда проведена под прямым углом к основанию, а у треугольника в формуле появляется множитель {1|2}.</p><div class=\"figure\">__SVG_GEO_AREAS__</div><h3>Единицы</h3><p>1 м = 100 см, но 1 м² = 100 · 100 = 10 000 см². 1 га = 10 000 м².</p><h3>Углы</h3><div class=\"figure\">__SVG_TRIANGLE__</div><ul><li>Прямой угол — 90°, развёрнутый — 180°.</li><li>Сумма углов любого треугольника — 180°.</li><li>Смежные углы (вместе образуют развёрнутый) в сумме дают 180°.</li><li>Вертикальные углы (образуются при пересечении двух прямых, расположены «крест-накрест») всегда равны друг другу.</li></ul><p>Почему у треугольника именно 180°? Слева на схеме — треугольник с углами α, β и γ. Справа те же три угла приложены вершинами в одну точку на прямой, и они вместе заполняют развёрнутый угол: α + β + γ = 180°.</p><div class=\"figure\">__SVG_GEO_TRISUM__</div><h3>Обратные задачи и составные фигуры</h3><p>Если известна площадь или периметр, а нужно найти сторону — просто выполняем обратное действие: не «сторона умножить», а «площадь разделить». Составную фигуру (например, комнату неправильной формы) удобно мысленно разбить на прямоугольники и треугольники, посчитать площадь каждой части отдельно, а потом сложить или вычесть.</p><div class=\"note\"><span class=\"hand\">Запомни</span>Высота — это перпендикуляр к основанию, а не наклонная сторона. В задаче про площадь берём именно высоту. Если известны периметр и одна связь между сторонами (например, a + b), сумму можно сразу подставить в формулу.</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>Площадь треугольника без {1|2}: S = a · h — это площадь параллелограмма. Треугольник — ровно половина. Ещё одна ошибка — путать смежные углы (сумма 180°) с вертикальными (они равны).</div>";
CONTENT.pow.explain = "<p><b>Степенью числа a с натуральным показателем n</b> называют произведение n одинаковых множителей a: a^n = a · a · a · … · a (n раз). Число a называют <b>основанием</b> степени, число n — <b>показателем</b>. Запись 2^5 читают «два в пятой степени» или «пятая степень числа два».</p><p>Например, 2^5 = 2 · 2 · 2 · 2 · 2 = 32. Здесь 2 — основание, 5 — показатель, 32 — значение степени. Вторую степень числа называют ещё «квадратом» (a^2 = a · a), третью — «кубом» (a^3 = a · a · a).</p><h3>Особые показатели: 0 и 1</h3><ul><li>Любое число (кроме нуля) в <b>нулевой степени равно 1</b>: a^0 = 1 при a ≠ 0. Например, 7^0 = 1, 100^0 = 1.</li><li>Любое число в <b>первой степени равно самому себе</b>: a^1 = a. Например, 9^1 = 9.</li></ul><div class=\"note\"><span class=\"hand\">Запомни</span>0^0 в школьной программе не определяют — просто не встречай такое выражение. А вот 0^5 = 0, потому что это 0 · 0 · 0 · 0 · 0.</div><h3>Умножение степеней с одинаковым основанием</h3><p>Если основания одинаковые, при умножении степеней показатели <b>складываются</b>: a^m · a^n = a^(m+n). Это легко понять: 2^3 · 2^4 — это (2·2·2) · (2·2·2·2), то есть семь одинаковых множителей 2, то есть 2^7 = 2^(3+4).</p><h3>Деление степеней с одинаковым основанием</h3><p>При делении степеней с одинаковым основанием (a ≠ 0) показатели <b>вычитаются</b>: a^m : a^n = a^(m−n), где m ≥ n. Например, 5^6 : 5^4 = 5^(6−4) = 5^2 = 25.</p><p>Оба правила видны на схеме. Сверху: 2^3 (три двойки в синей рамке) и 2^4 (четыре двойки в красной) вместе дают 3 + 4 = 7 двоек, то есть 2^3 · 2^4 = 2^7 = 128. Снизу: из семи двоек вычёркиваем три (как при делении 2^7 : 2^3), остаётся 7 − 3 = 4 двойки, то есть 2^4 = 16.</p><div class=\"figure\">__SVG_POW_RULES__</div><h3>Возведение степени в степень</h3><p>Если степень возводят в степень, показатели <b>перемножаются</b>: (a^m)^n = a^(m·n). Например, (2^3)^2 = 2^(3·2) = 2^6 = 64. Проверка: 2^3 = 8, а 8^2 = 64 — совпадает.</p><h3>Степень произведения</h3><p>Чтобы возвести в степень произведение, можно возвести в эту степень каждый множитель отдельно и перемножить результаты: (a · b)^n = a^n · b^n. Например, (2 · 3)^3 = 2^3 · 3^3 = 8 · 27 = 216, и напрямую 6^3 = 216 — совпадает.</p><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>Нельзя складывать степени с РАЗНЫМИ основаниями или разными показателями по этим правилам: 2^3 · 3^2 нельзя превратить в 6^5 — правило применимо только когда основания у множителей совпадают (или когда одинаковые показатели при произведении). Также a^2 + a^3 нельзя «сложить в одну степень» — складывать можно только сами значения, а не показатели.</div><h3>Знак степени отрицательного числа</h3><p>Если основание отрицательное, знак результата зависит от показателя: при <b>чётном</b> показателе степень положительна (минусы «сокращаются» парами), при <b>нечётном</b> — отрицательна (один минус остаётся без пары). Например, (−2)^4 = 16 (показатель чётный), а (−2)^3 = −8 (показатель нечётный). Обрати внимание на скобки: (−2)^4 = 16, но −2^4 = −16, потому что здесь возводится в степень только 2, а минус ставится уже потом.</p><div class=\"note\"><span class=\"hand\">Запомни</span>Чётная степень отрицательного числа — всегда положительна. Нечётная степень отрицательного числа — всегда отрицательна.</div>";
CONTENT.poly.explain = "<p><b>Одночлен</b> — это выражение, составленное из чисел и букв (переменных) только с помощью умножения и возведения в степень: например, 5x, −3x^2y, 7, a^3. Число 4x^2·(−3x) тоже можно упростить и получить одночлен: 4x^2·(−3x) = −12x^3.</p><h3>Стандартный вид одночлена</h3><p>Одночлен записан в <b>стандартном виде</b>, если в нём сначала стоит числовой множитель (его называют <b>коэффициентом</b>), а затем буквенные множители с показателями степени, каждая буква — один раз. Например, −7x^3y^2 — стандартный вид: коэффициент −7, степень по x равна 3, по y равна 2. <b>Степенью одночлена</b> называют сумму показателей всех его букв: у −7x^3y^2 степень равна 3 + 2 = 5.</p><div class=\"note\"><span class=\"hand\">Запомни</span>Если множитель записан как 3x^2·x^3, сначала приведи его к стандартному виду через сложение показателей: 3x^2·x^3 = 3x^5.</div><h3>Многочлен и подобные слагаемые</h3><p><b>Многочлен</b> — это сумма одночленов. Каждый из этих одночленов называют <b>членом многочлена</b>. Например, 3x^2 − 5x + 7 — многочлен из трёх членов (трёхчлен). Многочлен из двух членов называют <b>двучленом</b> (например, x + 3).</p><p><b>Подобные слагаемые</b> — это члены многочлена с одинаковой буквенной частью (одинаковые буквы в одинаковых степенях), отличающиеся только коэффициентом. Например, 5x^2 и −3x^2 подобны, а 5x^2 и 5x — нет, потому что степени x разные.</p><p><b>Приведение подобных слагаемых</b> — это сложение их коэффициентов с сохранением общей буквенной части: 5x^2 − 3x^2 + x^2 = (5 − 3 + 1)x^2 = 3x^2.</p><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>При приведении подобных слагаемых складываются ТОЛЬКО коэффициенты, а буквенная часть переписывается без изменений: 4a − 7a + 2a = (4 − 7 + 2)a = −1a = −a, а не −a^2 и не число без буквы.</div><h3>Сложение и вычитание многочленов</h3><p>Чтобы сложить многочлены, нужно раскрыть скобки (если стоит плюс перед скобкой — знаки внутри не меняются) и привести подобные слагаемые. Чтобы вычесть многочлен, раскрывают скобки со сменой знака каждого члена внутри (если перед скобкой минус), а затем тоже приводят подобные слагаемые.</p><p>Пример: (5x^2 − 3x + 7) − (2x^2 + 4x − 1) = 5x^2 − 3x + 7 − 2x^2 − 4x + 1 = 3x^2 − 7x + 8.</p><h3>Умножение одночлена на многочлен</h3><p>Чтобы умножить одночлен на многочлен, нужно умножить одночлен на <b>каждый</b> член многочлена и сложить результаты — это называют раскрытием скобок или распределительным свойством умножения: a(b + c) = ab + ac. Пример: 3x·(2x^2 − 4x + 5) = 6x^3 − 12x^2 + 15x.</p><h3>Умножение многочлена на многочлен</h3><p>Чтобы перемножить два многочлена, нужно каждый член первого многочлена умножить на каждый член второго и сложить все получившиеся произведения, а затем привести подобные слагаемые. Пример: (x + 2)(x + 5) = x·x + x·5 + 2·x + 2·5 = x^2 + 5x + 2x + 10 = x^2 + 7x + 10.</p><p>Этот же пример можно увидеть на схеме: прямоугольник со сторонами (x + 2) и (x + 5) разбит на четыре части. Их площади: x · x = x^2, x · 5 = 5x, 2 · x = 2x и 2 · 5 = 10. Вся площадь — это сумма четырёх частей, а 5x + 2x дают 7x.</p><div class=\"figure\">__SVG_POLY_TILES__</div><div class=\"note\"><span class=\"hand\">Запомни</span>Удобно представлять умножение двучленов как площадь прямоугольника со сторонами (x + 2) и (x + 5): он разбивается на 4 меньших прямоугольника со сторонами x, 2 и x, 5, и их площади как раз дают все четыре слагаемых.</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>При умножении многочлена на многочлен нельзя перемножить только «первые» и «последние» члены — нужно перемножить КАЖДЫЙ с КАЖДЫМ (в двучлене на двучлен получится 4 произведения, а не 2). Также при раскрытии (x − 3)(x + 3) не забывай про знаки: получится x^2 − 9, а не x^2 + 9.</div>";
CONTENT.fsu.explain = "<p>Когда мы умножаем одну и ту же пару скобок много раз в задачах, математики давно заметили: результат всегда получается по одному и тому же шаблону. Такие готовые шаблоны называют <b>формулами сокращённого умножения (ФСУ)</b>. Они не дают ничего нового — то же самое можно получить обычным раскрытием скобок — но экономят время и почти всегда встречаются в контрольных и на ОГЭ.</p><h3>Квадрат суммы</h3><p>(a + b)^2 = a^2 + 2ab + b^2 — «квадрат первого, плюс удвоенное произведение, плюс квадрат второго».</p><p>Проверим раскрытием скобок: (a + b)(a + b) = a·a + a·b + b·a + b·b = a^2 + 2ab + b^2. Формула не берётся из воздуха — это просто более короткая запись того же самого умножения.</p><div class=\"figure\">__SVG_FSU_SQUARE__</div><p>Смотри на схему: квадрат со стороной (a + b) состоит из квадрата a^2, квадрата b^2 и двух одинаковых прямоугольников a·b — вместе как раз 2ab. Проверка числами при a = 3, b = 2: (3 + 2)^2 = 25, и 9 + 12 + 4 = 25.</p><h3>Квадрат разности</h3><p>(a − b)^2 = a^2 − 2ab + b^2 — тот же принцип, только средний член со знаком минус. Частая путаница: думают, что (a − b)^2 = a^2 − b^2. Это неверно! Проверь на числах: (5 − 2)^2 = 3^2 = 9, а 5^2 − 2^2 = 25 − 4 = 21. Числа разные — формулы разные.</p><h3>Разность квадратов</h3><p>a^2 − b^2 = (a − b)(a + b) — «разность квадратов равна произведению разности и суммы». Это единственная из трёх формул, где слева стоит <b>разность</b>, а не полный квадрат, и раскладывается она на множители, а не в трёхчлен.</p><p>Это тоже видно на рисунке. Возьмём квадрат a × a и вырежем из угла маленький квадрат b × b — останется фигура площадью a^2 − b^2. Разрежем её на две части (1 и 2) и часть 2 переложим сбоку: получится прямоугольник со сторонами (a − b) и (a + b). Проверка при a = 5, b = 3: 25 − 9 = 16 и (5 − 3)(5 + 3) = 2 · 8 = 16.</p><div class=\"figure\">__SVG_FSU_DIFF__</div><h3>Зачем это нужно</h3><p>Во-первых, для быстрого устного счёта: 31^2 = (30 + 1)^2 = 900 + 60 + 1 = 961 — считается в уме за пару секунд, без умножения «31 на 31 столбиком». Во-вторых, для <b>разложения на множители</b>: если видишь выражение вида a^2 − b^2, можно сразу заменить его на (a − b)(a + b), что часто упрощает дальнейшие вычисления или сокращение дробей.</p><h3>Как узнать, какую формулу применять</h3><ul><li>Видишь скобку в квадрате со знаком «+» внутри — это (a + b)^2, раскрываешь в трёхчлен со знаком «+» посередине.</li><li>Видишь скобку в квадрате со знаком «−» внутри — это (a − b)^2, раскрываешь в трёхчлен со знаком «−» посередине.</li><li>Видишь разность двух квадратов (без скобок, просто x^2 − 9) — раскладываешь в произведение (x − 3)(x + 3).</li></ul><div class=\"note\"><span class=\"hand\">Запомни</span>В формулах a и b — это не обязательно одна буква. Например, в (2x + 5)^2 роль «a» играет 2x, а роль «b» играет 5: получится (2x)^2 + 2·(2x)·5 + 5^2 = 4x^2 + 20x + 25.</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>(a + b)^2 ≠ a^2 + b^2 — нельзя «забывать» средний член 2ab! Это самая частая ошибка в этой теме. Всегда проверяй формулу на простых числах: (2+3)^2 = 25, а 2^2+3^2 = 13 — не совпадает, значит средний член обязателен.</div>";
CONTENT.func.explain = "<p>Чтобы описывать зависимость одной величины от другой, в математике используют <b>координатную плоскость</b>: две перпендикулярные числовые прямые — горизонтальную ось <b>Ox</b> (ось абсцисс) и вертикальную ось <b>Oy</b> (ось ординат). Точка пересечения осей называется <b>началом координат</b>, там оба числа равны нулю.</p><div class=\"figure\">__SVG_COORD__</div><p>Любая точка на плоскости задаётся парой чисел (x; y): первое число — координата по горизонтали, второе — по вертикали. Например, точка (3; 2) находится на 3 единицы правее начала координат и на 2 единицы выше.</p><h3>Что такое линейная функция</h3><p><b>Линейная функция</b> — это зависимость вида y = kx + b, где k и b — заданные числа (коэффициенты), а x — независимая переменная (аргумент), y — зависимая переменная (значение функции). Графиком линейной функции всегда является <b>прямая линия</b>.</p><h3>Что означают k и b</h3><ul><li><b>b</b> — это значение y, когда x = 0. Значит, точка (0; b) — это точка, где график пересекает ось Oy. Число b показывает, «откуда стартует» прямая по вертикали.</li><li><b>k</b> — это <b>угловой коэффициент</b>, он же наклон прямой. Он показывает, на сколько изменится y при увеличении x на 1. Если k > 0 — прямая идёт вверх слева направо (функция возрастает). Если k < 0 — прямая идёт вниз (функция убывает). Чем больше |k| по модулю, тем круче наклон.</li></ul><p>Посмотри на схему: на ней график y = 2x + 1. Он пересекает ось Oy в точке (0; 1) — это и есть b = 1. Чтобы увидеть k, сделай «шаг» по прямой: вправо на 1 клетку — и вверх на 2 клетки. Значит, k = 2. Ещё одна точка на этой прямой — (2; 5): проверим, 2 · 2 + 1 = 5.</p><div class=\"figure\">__SVG_FUNC_LINE__</div><p>Частный случай: если k = 0, функция превращается в y = b — это горизонтальная прямая, потому что y не зависит от x вообще.</p><p>Все три случая видны на одной схеме: прямая y = 2x (k = 2 > 0) растёт, прямая y = −x + 3 (k = −1 < 0) убывает, а прямая y = 2 (k = 0) идёт горизонтально.</p><div class=\"figure\">__SVG_FUNC_SLOPES__</div><h3>Как построить график по двум точкам</h3><p>Через любые две различные точки проходит ровно одна прямая, поэтому для построения графика достаточно найти координаты двух точек, отметить их на координатной плоскости и провести через них прямую линию (с помощью линейки, до краёв листа).</p><ul><li>1. Возьми любое удобное значение x (часто x = 0 и ещё одно, например x = 2 или x = -1).</li><li>2. Подставь x в формулу y = kx + b и вычисли y.</li><li>3. Повтори для второго значения x.</li><li>4. Отметь обе точки на координатной плоскости и соедини их прямой линией, продлевая её в обе стороны.</li></ul><h3>Пересечение с осями координат</h3><p>С осью Oy график пересекается всегда в точке (0; b) — подставляем x = 0. С осью Ox график пересекается там, где y = 0: нужно решить уравнение kx + b = 0 относительно x, то есть x = −b/k (если k ≠ 0).</p><div class=\"note\"><span class=\"hand\">Запомни</span>b — это «где прямая начинается» на оси Oy (при x=0), а k — это «насколько круто она идёт» и в какую сторону: вверх (k>0) или вниз (k<0).</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>Не путай координаты точки местами! В записи (x; y) первое число — это движение по горизонтали, второе — по вертикали. Точка (2; 5) и точка (5; 2) — это две совершенно разные точки на плоскости.</div>";
CONTENT.sys.explain = "<p>Иногда в задаче есть сразу <b>два неизвестных числа</b>, и одного уравнения не хватает, чтобы их найти — нужно два условия, то есть два уравнения. Такая пара уравнений, которые должны выполняться <b>одновременно</b>, называется <b>системой уравнений</b>. Обычно её записывают фигурной скобкой:</p><p>{ x + y = 10<br>{ x − y = 2</p><p><b>Решение системы</b> — это пара чисел (x; y), которая одновременно превращает в верное равенство и первое, и второе уравнение. Решить систему — значит найти все такие пары.</p><p>У системы есть наглядный смысл. Каждое уравнение с двумя неизвестными задаёт на координатной плоскости прямую, а решение системы — общая точка этих прямых. Возьмём другую систему: x + y = 8 и x − y = 2. На схеме две прямые пересекаются в точке (5; 3), то есть x = 5, y = 3. Проверка: 5 + 3 = 8 и 5 − 3 = 2 — оба уравнения верны.</p><div class=\"figure\">__SVG_SYS_GRAPH__</div><h3>Способ подстановки</h3><p>Идея: из одного уравнения выражаем одну переменную через другую и подставляем это выражение во второе уравнение — там остаётся только одна неизвестная.</p><ul><li>1. Из любого уравнения выразить одну переменную (например, y) через другую.</li><li>2. Подставить полученное выражение вместо этой переменной во второе уравнение.</li><li>3. Решить получившееся уравнение с одной переменной.</li><li>4. Найденное значение подставить обратно и найти вторую переменную.</li><li>5. Сделать проверку: подставить обе найденные величины в ОБА исходных уравнения.</li></ul><h3>Способ сложения</h3><p>Идея: если сложить (или вычесть) левые и правые части двух уравнений, можно избавиться от одной из переменных — но для этого коэффициенты при этой переменной должны быть противоположными или равными числами. Часто перед сложением одно или оба уравнения нужно умножить на подходящее число.</p><p>Это похоже на весы: пока с обеих сторон делаем одно и то же, равновесие не нарушается. На схеме весы с уравнением x + 3 = 11: если убрать 3 с обеих чаш, получится x = 8.</p><div class=\"figure\">__SVG_BALANCE__</div><ul><li>1. Посмотреть, можно ли сразу сложить или вычесть уравнения так, чтобы одна переменная исчезла.</li><li>2. Если нет — умножить одно или оба уравнения на числа так, чтобы коэффициенты при x (или при y) стали противоположными.</li><li>3. Сложить уравнения почленно — одна переменная пропадает.</li><li>4. Решить получившееся уравнение с одной переменной, затем найти вторую переменную из любого исходного уравнения.</li></ul><h3>Как составить систему по текстовой задаче</h3><p>Главный приём — ввести <b>два обозначения</b> для двух неизвестных величин (например, x и y), а затем по условию задачи записать <b>два независимых условия</b> в виде уравнений: обычно одно условие про сумму (или разность), а другое — про какое-то другое соотношение (стоимость, скорость, проценты и т.д.).</p><div class=\"note\"><span class=\"hand\">Запомни</span>Ответом системы служат ДВЕ величины — x и y. После решения всегда подставляй оба числа в оба исходных уравнения — если хотя бы одно не сходится, где-то ошибка.</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>При способе сложения умножать на число нужно ВСЁ уравнение целиком — обе части, включая правую (число после знака равно), а не только слагаемые с переменной.</div>";
CONTENT.ang.explain = "<p>Когда две прямые пересекаются или один луч «прислоняется» к прямой, образуются углы с особыми свойствами. Разберём два главных вида: <b>смежные</b> и <b>вертикальные</b> углы.</p><h3>Смежные углы</h3><p>Два угла называются <b>смежными</b>, если у них одна сторона общая, а две другие стороны — дополнительные лучи (то есть образуют прямую линию). Проще говоря: смежные углы вместе «выпрямляются» в развёрнутый угол.</p><ul><li>Сумма смежных углов всегда равна <b>180°</b>.</li><li>Если известен один из смежных углов, второй находится по формуле: 180° − (известный угол).</li><li>Смежным может быть острый угол (тогда его сосед — тупой) или наоборот.</li><li>Если оба смежных угла равны, то каждый из них равен 90° — это как раз случай двух перпендикулярных прямых.</li></ul><p>На схеме луч из точки O делит развёрнутый угол на два смежных: ∠1 = 65° и ∠2 = 115°. Их сумма 65° + 115° = 180°, а второй угол легко найти: 180° − 65° = 115°.</p><div class=\"figure\">__SVG_ANG_ADJ__</div><div class=\"note\"><span class=\"hand\">Запомни</span>Смежные углы — это НЕ любые два угла на чертеже, а именно те, что стоят «бок о бок» на одной прямой и в сумме дают развёрнутый угол (180°).</div><h3>Вертикальные углы</h3><p>Когда пересекаются <b>две прямые</b>, образуются сразу 4 угла. Углы, которые лежат друг напротив друга (не соседние, а «через точку пересечения»), называются <b>вертикальными</b>.</p><ul><li><b>Вертикальные углы равны между собой</b> — это главное свойство, и его легко доказать: оба вертикальных угла смежны с одним и тем же третьим углом, а значит, оба равны 180° минус этот третий угол.</li><li>Из четырёх углов при пересечении двух прямых получаются две пары вертикальных углов и четыре пары смежных.</li><li>Зная всего ОДИН из четырёх углов, можно найти все остальные три: противоположный равен ему, а два соседних — по 180° минус известный угол.</li></ul><p>Посмотри на схему: две прямые пересеклись, вертикальные углы окрашены одним цветом — ∠1 = ∠3 = 48° и ∠2 = ∠4 = 132°. Соседние углы дают развёрнутый: 48° + 132° = 180°.</p><div class=\"figure\">__SVG_ANG_CROSS__</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>Не путай вертикальные углы со смежными! Смежные — соседние, в сумме 180° и НЕ равны друг другу (кроме случая 90°). Вертикальные — противоположные, равны друг другу, и в сумме дают не 180°, а могут быть любыми (кроме этого частного случая).</div><h3>Биссектриса угла</h3><p><b>Биссектриса угла</b> — это луч, выходящий из вершины угла и делящий его ровно пополам, на два равных угла. Если угол равен, например, 70°, то биссектриса делит его на два угла по 35° каждый.</p><p>На схеме угол AOB = 84°, а луч OC — его биссектриса. Она делит угол пополам: 84° : 2 = 42°, поэтому ∠AOC = ∠COB = 42° (равные дуги отмечены двумя чёрточками).</p><div class=\"figure\">__SVG_ANG_BISECT__</div><p>Если известна половина угла (угол между стороной и биссектрисой), то весь угол в два раза больше. А если нужно найти биссектрису развёрнутого угла (180°), то она делит его на два прямых угла по 90° — то есть биссектриса развёрнутого угла перпендикулярна ему.</p><div class=\"note\"><span class=\"hand\">Запомни</span>Биссектриса делит угол пополам: если весь угол равен α, то каждая из двух частей равна α : 2. И наоборот: если известна одна часть, весь угол в 2 раза больше неё.</div>";
CONTENT.tri.explain = "<p>Треугольник — простейшая замкнутая фигура из трёх отрезков. Но у него много важных элементов и свойств, которые нужно знать наизусть.</p><div class=\"figure\">__SVG_TRIANGLE__</div><h3>Элементы треугольника</h3><p>Треугольник ABC состоит из трёх <b>вершин</b> (точки A, B, C), трёх <b>сторон</b> (отрезки AB, BC, CA) и трёх <b>углов</b> (углы при вершинах A, B, C). Сторону, лежащую напротив вершины, часто называют противоположной этой вершине.</p><h3>Медиана, биссектриса, высота</h3><ul><li><b>Медиана</b> — отрезок от вершины до середины противоположной стороны. Делит противоположную сторону пополам.</li><li><b>Биссектриса треугольника</b> — отрезок от вершины до противоположной стороны, делящий угол этой вершины пополам.</li><li><b>Высота</b> — отрезок от вершины, перпендикулярный (проведённый под прямым углом) к прямой, содержащей противоположную сторону.</li></ul><p>На схеме три одинаковых треугольника. В первом проведена медиана — две части стороны равны (отмечены чёрточками), во втором биссектриса — равные дуги при вершине, в третьем высота — у основания стоит значок прямого угла, а само основание продолжено пунктиром.</p><div class=\"figure\">__SVG_TRI_LINES__</div><div class=\"note\"><span class=\"hand\">Запомни</span>В обычном треугольнике медиана, биссектриса и высота из одной вершины — это три РАЗНЫХ отрезка. Они совпадают только в равнобедренном треугольнике, и то не всегда — только те, что проведены к основанию.</div><h3>Равнобедренный и равносторонний треугольники</h3><p><b>Равнобедренный</b> треугольник имеет две равные стороны — их называют <b>боковыми</b>, а третью — <b>основанием</b>. Углы при основании равнобедренного треугольника равны между собой.</p><p><b>Равносторонний</b> треугольник — частный случай, у него равны ВСЕ три стороны, а значит, и все три угла равны между собой (по 60° каждый, так как сумма углов треугольника — 180°, а 180 : 3 = 60).</p><p>Вернёмся к равнобедренному треугольнику. На схеме AB = BC, основание — AC, углы при основании ∠A = ∠C = 65°. Тогда угол при вершине B равен 180° − 65° − 65° = 50°. Пунктирный отрезок BH — и высота (угол в точке H прямой), и медиана, и биссектриса сразу.</p><div class=\"figure\">__SVG_TRI_ISO__</div><div class=\"note\"><span class=\"hand\">Запомни</span>Важное свойство: в равнобедренном треугольнике медиана, биссектриса и высота, проведённые к основанию из вершины между боковыми сторонами, — это ОДИН И ТОТ ЖЕ отрезок.</div><h3>Признаки равенства треугольников</h3><p>Два треугольника называются равными, если у них соответственно равны все стороны и все углы. Но чтобы это доказать, не нужно проверять всё — достаточно трёх признаков.</p><ul><li><b>Первый признак (по двум сторонам и углу между ними).</b> Если две стороны и угол между ними одного треугольника равны двум сторонам и углу между ними другого треугольника, то треугольники равны.</li><li><b>Второй признак (по стороне и двум прилежащим углам).</b> Если сторона и два прилежащих к ней угла одного треугольника равны стороне и двум прилежащим к ней углам другого, то треугольники равны.</li><li><b>Третий признак (по трём сторонам).</b> Если три стороны одного треугольника равны трём сторонам другого, то треугольники равны.</li></ul><p>На схеме показано по паре равных треугольников для каждого признака: равные стороны отмечены одинаковыми чёрточками, равные углы — одинаковыми дугами.</p><div class=\"figure\">__SVG_TRI_SIGNS__</div><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>Угол должен быть именно МЕЖДУ данными сторонами (в первом признаке) или стороны должны быть именно ПРИЛЕЖАЩИМИ к данному углу (во втором признаке). Если взять «не тот» угол или «не ту» сторону, признак не сработает — треугольники могут оказаться разными!</div><h3>Зачем это нужно</h3><p>Признаки равенства — это главный инструмент доказательств в геометрии. Если доказано, что треугольники равны, то у них автоматически равны ВСЕ соответственные стороны и углы, даже те, про которые в условии ничего не было сказано напрямую.</p>";
CONTENT.par.explain = "<p><b>Параллельные прямые</b> — это прямые на плоскости, которые не пересекаются, сколько бы их ни продолжали в обе стороны. Обозначение: a ‖ b (прямая a параллельна прямой b).</p><h3>Секущая и восемь углов</h3><p>Если две прямые пересечь третьей прямой — <b>секущей</b>, — то в двух точках пересечения образуется 8 углов (по 4 в каждой точке). Эти углы разбивают на три группы с особыми названиями.</p><ul><li><b>Соответственные углы</b> — лежат по одну сторону от секущей, один сверху, другой снизу (в «одинаковых» позициях у двух точек пересечения).</li><li><b>Накрест лежащие углы</b> — лежат между двумя прямыми (внутри), но по разные стороны от секущей.</li><li><b>Односторонние углы</b> — лежат между двумя прямыми (внутри), по одну и ту же сторону от секущей.</li></ul><p>На схеме прямые a ∥ b и секущая c, углы пронумерованы от 1 до 8. Синие ∠4 и ∠6 — накрест лежащие, они равны. Зелёные ∠1 и ∠5 — соответственные, тоже равны. Красные ∠3 и ∠6 — односторонние, их сумма равна 180°. Внизу схемы то же самое записано в легенде.</p><div class=\"figure\">__SVG_PAR_TRANS__</div><div class=\"note\"><span class=\"hand\">Запомни</span>Накрест лежащие и односторонние углы — всегда «внутренние» (между прямыми). Соответственные — один внутренний, другой внешний, но в одинаковом положении относительно секущей.</div><h3>Признаки параллельности прямых</h3><p>Признаки помогают ДОКАЗАТЬ, что прямые параллельны, если про углы что-то известно:</p><ul><li>Если при пересечении секущей <b>накрест лежащие углы равны</b> — прямые параллельны.</li><li>Если <b>соответственные углы равны</b> — прямые параллельны.</li><li>Если сумма <b>односторонних углов равна 180°</b> — прямые параллельны.</li></ul><h3>Свойства параллельных прямых (обратные теоремы)</h3><p>Если прямые УЖЕ параллельны, то верно обратное — это свойства, а не признаки:</p><ul><li>При пересечении параллельных прямых секущей <b>накрест лежащие углы равны</b>.</li><li><b>Соответственные углы равны</b>.</li><li>Сумма <b>односторонних углов равна 180°</b>.</li></ul><div class=\"warn\"><span class=\"hand\">Частая ошибка</span>Не путай признак и свойство! Признак — когда по углам ДОКАЗЫВАЕМ параллельность («раз углы равны — значит, прямые параллельны»). Свойство — когда прямые УЖЕ параллельны (это дано), и из этого мы находим углы. В задачах почти всегда используется именно свойство: дано a ‖ b, найти угол.</div><h3>Как искать угол при параллельных прямых</h3><p>Раз прямые параллельны, все 8 углов делятся всего на два значения: одно и то же острое (или прямое) значение либо дополняющее его до 180° тупое значение. Если известен один угол, вся картинка углов восстанавливается: накрест лежащий и соответственный — равны данному, а смежный с данным (и односторонний к нему) — 180° минус данный угол.</p><h3>Связь с суммой углов треугольника</h3><p>Раз уж мы заговорили про параллельные прямые: именно с их помощью в геометрии доказывают теорему о сумме углов треугольника (через прямую, параллельную одной из сторон и проходящую через противоположную вершину). Так что параллельные прямые и «сумма углов треугольника = 180°» тесно связаны — это не два случайных факта, а одна и та же логика геометрии.</p><p>Вот такой треугольник ABC: его углы ∠A, ∠B и ∠C вместе дают 180°.</p><div class=\"figure\">__SVG_TRIANGLE__</div>";

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(s){
  return String(s)
    .replace(/\{([^{}|]+)\|([^{}|]+)\}/g,'<span class="fr"><span class="n">$1</span><span class="d">$2</span></span>')
    .replace(/\^(\w+)/g,'<sup>$1</sup>');
}
function plain(s){
  return String(s).replace(/(\d)\{([^{}|]+)\|([^{}|]+)\}/g,'$1 $2/$3').replace(/\{([^{}|]+)\|([^{}|]+)\}/g,'($1/$2)');
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t}return a}
function parseAns(raw){
  var s=String(raw==null?'':raw).trim().toLowerCase().replace(/,/g,'.').replace(/[−–—]/g,'-');
  s=s.replace(/^[a-zа-я]\s*=\s*/,'');
  s=s.replace(/[\sa-zа-яё%°²³]+$/,'');
  var m;
  if((m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/))){
    var d=+m[4]; if(!d) return null;
    var n=(+m[2])*d+(+m[3]); if(m[1]) n=-n;
    return {val:n/d,num:n,den:d};
  }
  if((m=s.match(/^(-?\d+)\/(\d+)$/))){
    var d2=+m[2]; if(!d2) return null;
    return {val:(+m[1])/d2,num:+m[1],den:d2};
  }
  if(/^-?\d+(\.\d+)?$/.test(s)) return {val:parseFloat(s)};
  return null;
}
function gradeNum(item,raw){
  var p=parseAns(raw); if(!p) return false;
  var t=parseAns(item.ans);
  if(Math.abs(p.val-t.val)>1e-9) return false;
  if(item.reduced && p.den && p.den!==1 && gcd(p.num,p.den)!==1) return false;
  return true;
}
function ruDate(ts){
  try{return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}
}
function pct(a,b){return b?Math.round(a/b*100):0}

/* Библиотека учебных SVG-схем. Все цвета берутся из CSS custom properties через currentColor/var(),
   чтобы схемы одинаково хорошо смотрелись в светлой и тёмной теме. */
var SVG_LIB = {};

SVG_LIB.NUMLINE = function(){
  var W=520,H=120,y=60,x0=40,x1=480,step=(x1-x0)/12; // -6..+6
  var ticks='';
  for(var i=-6;i<=6;i++){
    var x=x0+(i+6)*step;
    var big = (i%2===0);
    ticks += '<line x1="'+x+'" y1="'+(y-(big?9:5))+'" x2="'+x+'" y2="'+(y+(big?9:5))+'" stroke="var(--ink)" stroke-width="1.5"/>';
    if(big) ticks += '<text x="'+x+'" y="'+(y+26)+'" font-size="15" text-anchor="middle" fill="var(--muted)">'+i+'</text>';
  }
  var mA=x0+(-3+6)*step, mB=x0+(2+6)*step;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:480px;display:block;margin:0 auto" role="img" aria-label="Числовая прямая от минус 6 до 6">'
    +'<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--ink)" stroke-width="2" marker-end="url(#nl-arrow)"/>'
    +'<defs><marker id="nl-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--ink)"/></marker></defs>'
    +ticks
    +'<circle cx="'+mA+'" cy="'+y+'" r="6" fill="var(--red)"/><text x="'+mA+'" y="'+(y-16)+'" font-size="14" text-anchor="middle" fill="var(--red)" font-weight="700">−3</text>'
    +'<circle cx="'+mB+'" cy="'+y+'" r="6" fill="var(--blue)"/><text x="'+mB+'" y="'+(y-16)+'" font-size="14" text-anchor="middle" fill="var(--blue)" font-weight="700">2</text>'
    +'</svg>';
};

SVG_LIB.PIE = function(){
  var cx=110,cy=110,r=90;
  function arc(startFrac,endFrac,fill){
    var a0=2*Math.PI*startFrac-Math.PI/2, a1=2*Math.PI*endFrac-Math.PI/2;
    var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    var x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    var large = (endFrac-startFrac)>0.5?1:0;
    return '<path d="M'+cx+','+cy+' L'+x0+','+y0+' A'+r+','+r+' 0 '+large+' 1 '+x1+','+y1+' Z" fill="'+fill+'" stroke="var(--sheet)" stroke-width="2"/>';
  }
  var W=220,H=250;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:220px;display:block;margin:0 auto" role="img" aria-label="Круг, разделённый на три из четырёх долей закрашенным">'
    +arc(0,0.25,'var(--blue)')+arc(0.25,0.5,'var(--blue)')+arc(0.5,0.75,'var(--blue)')+arc(0.75,1,'var(--sheet2)')
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--ink)" stroke-width="2"/>'
    +'<line x1="'+cx+'" y1="'+(cy-r)+'" x2="'+cx+'" y2="'+(cy+r)+'" stroke="var(--sheet)" stroke-width="2"/>'
    +'<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r)+'" y2="'+cy+'" stroke="var(--sheet)" stroke-width="2"/>'
    +'<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy+r)+'" stroke="var(--sheet)" stroke-width="2"/>'
    +'<text x="'+cx+'" y="'+(H-18)+'" font-size="16" text-anchor="middle" fill="var(--ink)" font-weight="700">закрашено {3|4}</text>'
    +'</svg>';
};

SVG_LIB.BALANCE = function(){
  var W=340,H=200,cx=170,baseY=170,postTop=40,beamY=60,armX=110,panY=110;
  function pan(x){
    return '<line x1="'+x+'" y1="'+(beamY+2)+'" x2="'+(x-22)+'" y2="'+panY+'" stroke="var(--ink)" stroke-width="1.5"/>'
      +'<line x1="'+x+'" y1="'+(beamY+2)+'" x2="'+(x+22)+'" y2="'+panY+'" stroke="var(--ink)" stroke-width="1.5"/>'
      +'<path d="M'+(x-26)+','+panY+' Q'+x+','+(panY+20)+' '+(x+26)+','+panY+'" fill="none" stroke="var(--ink)" stroke-width="2.5"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:340px;display:block;margin:0 auto" role="img" aria-label="Весы в равновесии — символ равенства в уравнении">'
    +'<line x1="'+cx+'" y1="'+postTop+'" x2="'+cx+'" y2="'+baseY+'" stroke="var(--ink)" stroke-width="4"/>'
    +'<line x1="'+(cx-50)+'" y1="'+baseY+'" x2="'+(cx+50)+'" y2="'+baseY+'" stroke="var(--ink)" stroke-width="4"/>'
    +'<circle cx="'+cx+'" cy="'+postTop+'" r="6" fill="var(--ink)"/>'
    +'<line x1="'+(cx-armX)+'" y1="'+beamY+'" x2="'+(cx+armX)+'" y2="'+beamY+'" stroke="var(--ink)" stroke-width="3"/>'
    +pan(cx-armX)+pan(cx+armX)
    +'<rect x="'+(cx-armX-18)+'" y="'+(panY+4)+'" width="36" height="22" rx="3" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5"/>'
    +'<text x="'+(cx-armX)+'" y="'+(panY+20)+'" font-size="13" text-anchor="middle" fill="var(--blue)" font-weight="700">x + 3</text>'
    +'<rect x="'+(cx+armX-18)+'" y="'+(panY+4)+'" width="36" height="22" rx="3" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5"/>'
    +'<text x="'+(cx+armX)+'" y="'+(panY+20)+'" font-size="13" text-anchor="middle" fill="var(--blue)" font-weight="700">11</text>'
    +'</svg>';
};

SVG_LIB.RECT = function(){
  var W=280,H=190,x=50,y=30,w=180,h=110;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:280px;display:block;margin:0 auto" role="img" aria-label="Прямоугольник со сторонами a и b">'
    +'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="var(--blue-soft)" stroke="var(--ink)" stroke-width="2.5"/>'
    +'<text x="'+(x+w/2)+'" y="'+(y-10)+'" font-size="16" text-anchor="middle" fill="var(--ink)" font-weight="700">a</text>'
    +'<text x="'+(x-16)+'" y="'+(y+h/2+5)+'" font-size="16" text-anchor="middle" fill="var(--ink)" font-weight="700">b</text>'
    +'<text x="'+(x+w/2)+'" y="'+(y+h/2+6)+'" font-size="15" text-anchor="middle" fill="var(--blue)" font-weight="700">S = a · b</text>'
    +'</svg>';
};

SVG_LIB.TRIANGLE = function(){
  var W=280,H=200,A=[140,20],B=[30,170],C=[250,170];
  function ang(p,q,r,label,dx,dy){ return '<text x="'+(p[0]+dx)+'" y="'+(p[1]+dy)+'" font-size="14" text-anchor="middle" fill="var(--red)" font-weight="700">'+label+'</text>'; }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:280px;display:block;margin:0 auto" role="img" aria-label="Треугольник ABC с обозначенными углами">'
    +'<polygon points="'+A.join(',')+' '+B.join(',')+' '+C.join(',')+'" fill="var(--blue-soft)" stroke="var(--ink)" stroke-width="2.5"/>'
    +'<text x="'+A[0]+'" y="'+(A[1]-8)+'" font-size="15" text-anchor="middle" fill="var(--ink)" font-weight="700">A</text>'
    +'<text x="'+(B[0]-14)+'" y="'+(B[1]+16)+'" font-size="15" text-anchor="middle" fill="var(--ink)" font-weight="700">B</text>'
    +'<text x="'+(C[0]+14)+'" y="'+(C[1]+16)+'" font-size="15" text-anchor="middle" fill="var(--ink)" font-weight="700">C</text>'
    +ang(A,B,C,'∠A',0,26)+ang(B,A,C,'∠B',22,-10)+ang(C,A,B,'∠C',-22,-10)
    +'</svg>';
};

SVG_LIB.COORD = function(){
  var W=260,H=260,cx=130,cy=130,s=20;
  var grid='';
  for(var i=-6;i<=6;i++){
    grid += '<line x1="'+(cx+i*s)+'" y1="10" x2="'+(cx+i*s)+'" y2="250" stroke="var(--line)" stroke-width="1"/>';
    grid += '<line x1="10" y1="'+(cy+i*s)+'" x2="250" y2="'+(cy+i*s)+'" stroke="var(--line)" stroke-width="1"/>';
  }
  function pt(x,y){ return {sx:cx+x*s, sy:cy-y*s}; }
  var p1=pt(-2,-1), p2=pt(2,3);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:260px;display:block;margin:0 auto" role="img" aria-label="Координатная плоскость с прямой через две точки">'
    +grid
    +'<line x1="10" y1="'+cy+'" x2="250" y2="'+cy+'" stroke="var(--ink)" stroke-width="2" marker-end="url(#cx-arrow)"/>'
    +'<line x1="'+cx+'" y1="250" x2="'+cx+'" y2="10" stroke="var(--ink)" stroke-width="2" marker-end="url(#cx-arrow)"/>'
    +'<defs><marker id="cx-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--ink)"/></marker></defs>'
    +'<text x="245" y="'+(cy-8)+'" font-size="13" fill="var(--muted)">x</text>'
    +'<text x="'+(cx+8)+'" y="18" font-size="13" fill="var(--muted)">y</text>'
    +'<line x1="'+p1.sx+'" y1="'+p1.sy+'" x2="'+p2.sx+'" y2="'+p2.sy+'" stroke="var(--blue)" stroke-width="2.5"/>'
    +'<circle cx="'+p1.sx+'" cy="'+p1.sy+'" r="5" fill="var(--red)"/>'
    +'<circle cx="'+p2.sx+'" cy="'+p2.sy+'" r="5" fill="var(--red)"/>'
    +'</svg>';
};

SVG_LIB.CIRCLE = function(){
  var W=220,H=220,cx=110,cy=110,r=85;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:220px;display:block;margin:0 auto" role="img" aria-label="Окружность с радиусом">'

SVG_LIB.ANGLES = function(){

(function(){
/* ---------- общие помощники (только внутри IIFE) ---------- */
function svg(W,H,max,label,body){
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+max+'px;display:block;margin:0 auto" role="img" aria-label="'+label+'">'+body+'</svg>';
}
function T(x,y,s,sz,fill,anchor,weight){
  return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'" font-weight="'+(weight||400)+'">'+s+'</text>';
}
function R(x,y,w,h,rx,fill,stroke,sw,extra){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+rx+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+(extra||'')+'/>';
}
function L(x1,y1,x2,y2,stroke,sw,extra){
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+stroke+'" stroke-width="'+sw+'" stroke-linecap="round"'+(extra||'')+'/>';
}
function C(x,y,r,fill,stroke,sw){
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
}
function unit(dx,dy){ var l=Math.sqrt(dx*dx+dy*dy)||1; return [dx/l,dy/l]; }
function AH(x,y,dx,dy,color,sz){
  var d=unit(dx,dy), nx=-d[1], ny=d[0], bx=x-d[0]*sz, by=y-d[1]*sz, w=sz*0.5;
  return '<polygon points="'+x+','+y+' '+(bx+nx*w)+','+(by+ny*w)+' '+(bx-nx*w)+','+(by-ny*w)+'" fill="'+color+'" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round"/>';
}
function AL(x1,y1,x2,y2,color,sw,sz,both){
  var d=unit(x2-x1,y2-y1), e=sz*0.7;
  var a1=both?[x1+d[0]*e,y1+d[1]*e]:[x1,y1];

}

/* ---------- LCM_LINES ---------- */

    var sc=[[by1,['0 %','25 %','50 %','75 %','100 %'],-1],[by2,['0','60','120','180','240'],1]];
    sc.forEach(function(s){
      var y=s[0], dir=s[2];
      b+=R(x0,y,w,bh,'var(--sheet)','none',0,5);
      b+=R(x0,y,w*f,bh,'var(--blue-soft)','none',0,5);
      for(var i=0;i<=4;i++){

    b+=P('M'+r(x0+2)+','+(by2-8)+' v-8 H'+r(X(f)-2)+' v8','none','var(--blue)',2.6);

  /* ================= GEO_AREAS ================= */
  SVG_LIB.GEO_AREAS = function(){
    var W=470,cw=224,ch=178,b='';
    var H=10+ch+12+ch+10;
    function cell(ix,iy,name,drawFn,formula){
      var x=10+ix*(cw+12), y=10+iy*(ch+12);
      var s=R(x,y,cw,ch,'var(--sheet)','var(--line)',1.5,12);
      s+=T(x+cw/2,y+22,name,{s:15,c:'var(--muted)',b:1});
      s+=drawFn(x,y+52,y+52+66); // top y, base y
      s+=formula(x+cw/2,y+ch-14);
      return s;
    }
    var A='var(--blue)',Hc='var(--red)',Bc='var(--green)',fillc='var(--blue-soft)';
    function right(x,y){ return P('M'+r(x)+','+r(y-9)+' h9 v9','none','var(--red)',1.6); }
    function hline(x,yt,yb){
      return L(x,yt,x,yb,Hc,2.2,' stroke-dasharray="5 4"')+right(x,yb)+T(x+9,(yt+yb)/2+5,'h',{s:16,a:'start',c:Hc,b:1});
    }
    function alab(xm,yb){ return T(xm,yb+19,'a',{s:16,c:A,b:1}); }
    var out='';
    // прямоугольник
    out+=cell(0,0,'Прямоугольник',function(x,yt,yb){
      var x0=x+(cw-112)/2;
      return R(x0,yt,112,66,fillc,'var(--ink)',2,2)
        +L(x0,yb,x0+112,yb,A,4.5)+L(x0,yt,x0,yb,Hc,4.5)
        +alab(x0+56,yb)+T(x0-10,yt+38,'b',{s:16,c:Hc,b:1});
    },function(x,y){ return rich(x,y,[{t:'S'},'=',{t:'a',c:A},'·',{t:'b',c:Hc}],20,'middle','var(--ink)',1); });
    // параллелограмм
    out+=cell(1,0,'Параллелограмм',function(x,yt,yb){
      var x0=x+(cw-142)/2;
      return P('M'+r(x0)+','+yb+' L'+r(x0+112)+','+yb+' L'+r(x0+142)+','+yt+' L'+r(x0+30)+','+yt+' Z',fillc,'var(--ink)',2)
        +L(x0,yb,x0+112,yb,A,4.5)+hline(x0+30,yt,yb)+alab(x0+56,yb);
    },function(x,y){ return rich(x,y,[{t:'S'},'=',{t:'a',c:A},'·',{t:'h',c:Hc}],20,'middle','var(--ink)',1); });
    // треугольник
    out+=cell(0,1,'Треугольник',function(x,yt,yb){
      var x0=x+(cw-112)/2;
      return P('M'+r(x0)+','+yb+' L'+r(x0+112)+','+yb+' L'+r(x0+36)+','+yt+' Z',fillc,'var(--ink)',2)
        +L(x0,yb,x0+112,yb,A,4.5)+hline(x0+36,yt,yb)+alab(x0+56,yb);
    },function(x,y){ return rich(x,y,[{t:'S'},'=',{f:[1,2]},'·',{t:'a',c:A},'·',{t:'h',c:Hc}],20,'middle','var(--ink)',1); });
    // трапеция
    out+=cell(1,1,'Трапеция',function(x,yt,yb){
      var x0=x+(cw-112)/2;
      return P('M'+r(x0)+','+yb+' L'+r(x0+112)+','+yb+' L'+r(x0+92)+','+yt+' L'+r(x0+22)+','+yt+' Z',fillc,'var(--ink)',2)
        +L(x0,yb,x0+112,yb,A,4.5)+L(x0+22,yt,x0+92,yt,Bc,4.5)
        +hline(x0+22,yt,yb)+alab(x0+56,yb)+T(x0+57,yt-8,'b',{s:16,c:Bc,b:1});
    },function(x,y){ return rich(x,y,[{t:'S'},'=',{f:['a + b',2]},'·',{t:'h',c:Hc}],20,'middle','var(--ink)',1); });
    return svg(W,H,520,'Формулы площадей: прямоугольник S = a · b, параллелограмм S = a · h, треугольник S = одна вторая a · h, трапеция S = (a + b) / 2 · h; высота h показана пунктиром',out);
  };

  /* ================= GEO_TRISUM ================= */
  SVG_LIB.GEO_TRISUM = function(){
    var W=500,H=262,b='',id='geo_trisum_arrow';
    var al=70,be=50,ga=60, BC=176;
    var Bp=[16,178], Cp=[16+BC,178];
    var AB=BC*Math.sin(ga*Math.PI/180)/Math.sin(al*Math.PI/180);
    var Ap=[Bp[0]+AB*Math.cos(be*Math.PI/180), Bp[1]-AB*Math.sin(be*Math.PI/180)];
    var cA='var(--blue)',cB='var(--red)',cG='var(--green)',sA='var(--blue-soft)',sB='var(--red-soft)',sG='var(--green-soft)';
    // направление от A к B и C (мат. градусы)
    var dAB=180+be, dAC=360-ga; // 230, 300
    b+=P('M'+r(Bp[0])+','+r(Bp[1])+' L'+r(Cp[0])+','+r(Cp[1])+' L'+r(Ap[0])+','+r(Ap[1])+' Z','var(--sheet)','var(--ink)',2.5);
    b+=sector(Ap[0],Ap[1],34,dAB,dAC,sA,cA,2);
    b+=sector(Bp[0],Bp[1],34,0,be,sB,cB,2);
    b+=sector(Cp[0],Cp[1],34,180-ga,180,sG,cG,2);
    b+=P('M'+r(Bp[0])+','+r(Bp[1])+' L'+r(Cp[0])+','+r(Cp[1])+' L'+r(Ap[0])+','+r(Ap[1])+' Z','none','var(--ink)',2.5);
    var pa=pt(Ap[0],Ap[1],56,(dAB+dAC)/2), pb=pt(Bp[0],Bp[1],56,be/2), pg=pt(Cp[0],Cp[1],56,180-ga/2);
    b+=T(pa[0],pa[1]+6,'α',{s:20,c:cA,b:1});
    b+=T(pb[0]+2,pb[1]+6,'β',{s:20,c:cB,b:1});
    b+=T(pg[0]-2,pg[1]+6,'γ',{s:20,c:cG,b:1});
    b+=T(Bp[0]+BC/2,Bp[1]+26,'треугольник',{s:14,c:'var(--muted)',b:1});
    // стрелка «переносим»
    b+=L(212,112,262,112,'var(--muted)',2.2,' marker-end="url(#'+id+')"');
    b+=T(237,96,'сложим',{s:13.5,c:'var(--muted)',b:1});
    b+=T(237,138,'углы',{s:13.5,c:'var(--muted)',b:1});
    // прямая и три угла в одной точке
    var Pc=[382,178], rad=92;
    b+=L(Pc[0]-rad-16,Pc[1],Pc[0]+rad+16,Pc[1],'var(--ink)',2.5);
    b+=sector(Pc[0],Pc[1],rad,180-be,180,sB,cB,2);
    b+=sector(Pc[0],Pc[1],rad,ga,180-be,sA,cA,2);
    b+=sector(Pc[0],Pc[1],rad,0,ga,sG,cG,2);
    // углы: β (слева), α (середина), γ (справа) — порядок по возрасту от левого луча
    // пересчитываем: слева β=50, затем α=70, затем γ=60
    var aB1=180-be, aA1=aB1-al; // aA1 = 60
    b+=C(Pc[0],Pc[1],4,'var(--ink)');
    var lb=pt(Pc[0],Pc[1],58,180-be/2), la=pt(Pc[0],Pc[1],58,aB1-al/2), lg=pt(Pc[0],Pc[1],58,ga/2);
    b+=T(lb[0],lb[1]+6,'β',{s:20,c:cB,b:1});
    b+=T(la[0],la[1]+6,'α',{s:20,c:cA,b:1});
    b+=T(lg[0],lg[1]+6,'γ',{s:20,c:cG,b:1});
    b+=arc(Pc[0],Pc[1],rad+12,0,180,'var(--muted)',1.6).replace('fill="none"','fill="none" stroke-dasharray="4 4"');
    b+=T(Pc[0],Pc[1]-rad-22,'развёрнутый угол = 180°',{s:14,c:'var(--muted)',b:1});
    b+=T(Pc[0],Pc[1]+26,'три угла в одной точке',{s:14,c:'var(--muted)',b:1});
    b+=rich(W/2,H-6,[{t:'α',c:cA},'+',{t:'β',c:cB},'+',{t:'γ',c:cG},'=',{t:'180°'}],24,'middle','var(--ink)',1);

/* ============ PAR_TRANS ============ */
SVG_LIB.PAR_TRANS = function(){
  var W=460,ya=78,yb=208,b='';
  var th=60;
  var Pp=[250,ya], Qp=[250-(yb-ya)/Math.tan(th*RAD),yb];
  var d=[Math.cos(th*RAD),-Math.sin(th*RAD)];
  var c0=[Qp[0]-d[0]*58,Qp[1]-d[1]*58], c1=[Pp[0]+d[0]*58,Pp[1]+d[1]*58];
  var rr=46, i;
  // сектора: [вершина, a0, a1, fill, stroke, номер]
  var N='var(--sheet2)', NL='var(--line)';
  var secs=[
    [Pp,60,180,'var(--green-soft)','var(--green)','1'],
    [Pp,0,60,N,NL,'2'],
    [Pp,240,360,'var(--red-soft)','var(--red)','3'],
    [Pp,180,240,'var(--blue-soft)','var(--blue)','4'],
    [Qp,60,180,'var(--green-soft)','var(--green)','5'],
    [Qp,0,60,'var(--blue-soft)','var(--blue)','6'],
    [Qp,240,360,N,NL,'7'],
    [Qp,180,240,N,NL,'8']
  ];
  for(i=0;i<secs.length;i++){ var s=secs[i]; b += P(secD(s[0][0],s[0][1],rr,s[1],s[2]),s[3],s[4],1.5); }
  // прямые
  b += L(36,ya,424,ya,'var(--ink)',3);
  b += L(36,yb,424,yb,'var(--ink)',3);
  b += L(c0[0],c0[1],c1[0],c1[1],'var(--ink)',3);
  // стрелки параллельности
  var ys=[ya,yb];
  for(i=0;i<2;i++){
    for(var k=0;k<2;k++){
      var x=384+k*9;
      b += P('M'+(x-6)+','+(ys[i]-7)+' L'+x+','+ys[i]+' L'+(x-6)+','+(ys[i]+7),'none','var(--ink)',2.2);
    }
  }
  // красная дуга для ∠6 (односторонний с ∠3)
  b += P(arcD(Qp[0],Qp[1],rr+8,0,60),'none','var(--red)',3.5);
  // номера
  var cols={'1':'var(--green)','2':'var(--muted)','3':'var(--red)','4':'var(--blue)','5':'var(--green)','6':'var(--blue)','7':'var(--muted)','8':'var(--muted)'};
  for(i=0;i<secs.length;i++){
    var q=secs[i], m=(q[1]+q[2])/2, pp=PT(q[0][0],q[0][1],(q[2]-q[1]>100?31:33),m);
    b += T(pp[0],pp[1]+5,q[5],{size:15,w:700,fill:cols[q[5]]});
  }
  b += C(Pp[0],Pp[1],4.5,'var(--ink)');
  b += C(Qp[0],Qp[1],4.5,'var(--ink)');
  b += T(434,ya+5,'a',{size:16,w:700,a:'start',extra:' font-style="italic"'});
  b += T(434,yb+5,'b',{size:16,w:700,a:'start',extra:' font-style="italic"'});
  b += T(c1[0]+13,c1[1]-2,'c',{size:16,w:700,a:'start',extra:' font-style="italic"'});
  b += T(36,ya-10,'a ∥ b',{size:15,w:700,fill:'var(--muted)',a:'start'});
  // легенда
  var y=yb+94, chips=[
    ['var(--blue-soft)','var(--blue)','<tspan fill="var(--blue)">∠4 = ∠6</tspan> — накрест лежащие, равны'],
    ['var(--green-soft)','var(--green)','<tspan fill="var(--green)">∠1 = ∠5</tspan> — соответственные, равны'],
    ['var(--red-soft)','var(--red)','<tspan fill="var(--red)">∠3 + ∠6 = 180°</tspan> — односторонние']
  ];
  for(i=0;i<3;i++){
    b += R(38,y-14+i*30,20,20,chips[i][0],chips[i][1],{rx:6,sw:2.2});
    b += T(70,y+1+i*30,chips[i][2],{size:15,w:700,a:'start'});
  }
  return SVG(W,y+82,460,'Две параллельные прямые a и b и секущая c: накрест лежащие углы 4 и 6 равны, соответственные углы 1 и 5 равны, односторонние углы 3 и 6 в сумме дают 180 градусов','',b);
};

/* ============ TRI_LINES ============ */
SVG_LIB.TRI_LINES = function(){
  var W=480,b='';
  function base(dx){ return {A:[dx+14,150],C:[dx+134,150],B:[dx+52,45]}; }

    var o = P('M'+t.A+' L'+t.B+' L'+t.C+' Z','var(--sheet2)','var(--ink)',2.5);

  }
  function letters(t){

  }
  var dx, t;

  dx=6; t=base(dx);

  b += L(t.B[0],t.B[1],M0[0],M0[1],'var(--blue)',3.5);
  b += tick(t.A,M0,1,'var(--blue)')+tick(M0,t.C,1,'var(--blue)');
  b += C(M0[0],M0[1],4.5,'var(--blue)');
  b += letters(t)+T(M0[0],M0[1]+19,'M',{size:14,w:700,fill:'var(--blue)'});

SVG_LIB.TRI_SIGNS = function(){

    var o=P('M'+pts[0]+' L'+pts[1]+' L'+pts[2]+' Z',fill,'var(--ink)',2.2), i;
    (mk.sides||[]).forEach(function(sd){

function loadStateLocal(kidId){
  if(remoteProgressCache[kidId]) return remoteProgressCache[kidId];
  try{var raw=localStorage.getItem(LS_PREFIX+kidId); if(raw){var o=JSON.parse(raw); if(o&&typeof o==='object') return normalize(o)}}catch(e){}

async function fetchRemoteProgress(kidId){
  if(!db) return;
  try{
    var snap=await db.doc('progress/'+kidId).get();
    if(snap&&snap.exists){
      var d=snap.data();
      if(d&&d.state){
        var r=normalize(d.state);
        var changed=JSON.stringify(r)!==JSON.stringify(remoteProgressCache[kidId]||null);
        remoteProgressCache[kidId]=r;
        if(changed && view.name==='parent') render();
      }
    }
  }catch(e){}
}
function refreshAllKidsProgress(){ KIDS.forEach(function(k){ fetchRemoteProgress(k.id); }); }
function saveStateLocal(){ if(!activeKid) return; try{localStorage.setItem(LS_PREFIX+activeKid,JSON.stringify(S))}catch(e){} }
function scheduleSave(){
  saveStateLocal();

  dirty=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving||!db||!dirty||!activeKid) return;
  saving=true; dirty=false; saveTimer=null;
  var kid=activeKid;
  try{ await db.doc('progress/'+kid).set({state:JSON.parse(JSON.stringify(S)),updatedAt:Date.now()}); dbState='ok'; remoteProgressCache[kid]=normalize(S); }
  catch(e){ dbState='err'; }
  saving=false;
  if(dirty && activeKid===kid) flush();
  paintBar();
}
function hydrate(remote){
  if(saveTimer||saving||dirty) return;
  var r=normalize(remote);
  if(JSON.stringify(r)===JSON.stringify(S)) return;
  S=r; saveStateLocal();
  if(view.name==='home'||view.name==='parent'||view.name==='soon') render(); else paintBar();
}
var progressUnsub=null;
function watchProgress(kidId){
  if(progressUnsub){ try{progressUnsub()}catch(e){} progressUnsub=null; }
  if(!db||!kidId) return;
  var ref=db.doc('progress/'+kidId), first=true;
  progressUnsub=ref.onSnapshot(function(snap){
    if(kidId!==activeKid) return;
    if(snap.exists){
      var d=snap.data();
      if(d&&d.state) hydrate(d.state);
      dbState='ok';
    }else if(first){
      var has=Object.keys(S.practice).length||Object.keys(S.tests).length||S.diag||S.log.length;
      if(has){dirty=true;flush()}
      dbState='ok';
    }
    first=false; paintBar();
  },function(){dbState='err';paintBar()});
}

  kidsSaveTimer=setTimeout(flushKids,500);

  if(JSON.stringify(list)===JSON.stringify(KIDS)) return;

(async function initDb(){

    if(!window.claude||!window.claude.use){dbState='off';paintBar();

/* ======================= ПРОГРЕСС ======================= */
function avail(id){return !TOPICS[id].soon && CONTENT[id]}
function solvedCount(id){var p=S.practice[id]||{};return Object.keys(p).filter(function(k){return k!=='b'&&p[k].ok}).length}
function tStat(id){
  if(!avail(id)) return 'soon';
  var t=S.tests[id];
  if(t && t.total && t.best/t.total>=PASS) return 'done';
  if(solvedCount(id)>0||t) return 'prog';
  return 'new';
}
function needsReview(id){
  var t=S.tests[id];
  return t && Date.now()-t.ts>7*24*3600*1000 && t.best/t.total>=PASS;
}
function overall(){
  var ids=ALL.filter(avail); var d=ids.filter(function(i){return tStat(i)==='done'}).length;
  return {done:d,total:ids.length};
}
function statPill(id){
  var s=tStat(id);
  if(s==='soon') return '<span class="pill">готовится</span>';
  if(s==='done') return needsReview(id)?'<span class="pill rev">повторить</span>':'<span class="pill done">освоено</span>';
  if(s==='prog'){var t=S.tests[id]; return '<span class="pill prog">'+(t?('тест '+t.best+'/'+t.total):('задач '+solvedCount(id)+'/'+(CONTENT[id]?CONTENT[id].tasks.length:20)))+'</span>'}
  return '<span class="pill">не начато</span>';
}

function nextStep(){
  if(!S.diag) return {label:'Пройти входную диагностику',nav:'diag',why:'15 минут — и мы узнаем, с чего начинать'};
  for(var i=0;i<NODE_ORDER.length;i++){
    var n=NODE_ORDER[i], r=S.diag.byNode&&S.diag.byNode[n];
