  if(!parentUnlocked) return viewParentGate();
  var vk=visibleKids();
  if(vk.length===0) return '<div class="sheet"><h1>Кабинет родителя</h1><p class="goal">Пока нет ни одного профиля ребёнка. Создай первый на экране выбора профиля или прими запрос ребёнка ниже.</p><div class="cta" style="margin-top:12px"><button class="btn primary" data-nav="pickkid">К профилям</button></div></div>'+joinSection();
  var kidId=view.parentKid && vk.some(function(k){return k.id===view.parentKid}) ? view.parentKid : vk[0].id;
  var kSt=loadStateLocal(kidId);
  var d=kSt.diag, fullTopics=ALL.filter(avail);
  var switcher='<div class="cta" style="margin-bottom:4px">'+vk.map(function(k){
    return '<button class="btn small'+(k.id===kidId?' primary':' ghost')+'" data-parent-switch="'+k.id+'">'+esc(k.name)+'</button>';
  }).join('')+'<button class="btn small ghost" style="margin-left:auto" data-parent-lock="1">Выйти</button></div>';
  var h='<div class="sheet">'+switcher+'<h1>Кабинет родителя — '+esc(kidName(kidId))+'</h1><p class="goal">Здесь видно, что сделано, где ошибки и что повторять. Отчёты о тестах также можно получить письмом — кнопка внизу каждого теста.</p>'
    +'<div class="cta" style="margin-top:6px;flex-wrap:wrap"><span class="legend" style="margin:0">Класс:</span>'+[4,5,6,7,8,9].map(function(g){return '<button class="btn small'+(kidGrade(kidId)===g?' primary':' ghost')+'" data-parent-grade="'+g+'">'+g+'</button>'}).join('')+'<span class="legend" style="margin:0">диагностика подбирается за два предыдущих класса</span></div></div>';
  h+=joinSection();
  if(CLOUD.on&&CLOUD.me&&CLOUD.me.role==='parent'){
    h+='<div class="sheet"><h2>Вход детей через Gmail</h2><p class="goal">Впишите Gmail ребёнка — и он сможет заходить на страницу семьи со своей почты. Затем ему нужно нажать на свой значок и ввести PIN.</p>'
      +vk.map(function(k){return '<div class="cta" style="margin:8px 0;flex-wrap:wrap"><b style="min-width:90px">'+esc(k.name)+'</b><input id="km-'+k.id+'" type="email" class="txt" style="padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--sheet);min-width:220px" placeholder="name@gmail.com" value="'+esc(k.email||'')+'"><button class="btn small" data-kidmail="'+k.id+'">Сохранить</button><span class="legend" id="kmst-'+k.id+'" style="margin:0"></span></div>'}).join('')
      +'<div style="margin-top:10px">'+pinRequestBtn()+'</div></div>';
  }
  h+='<div class="sheet"><h2>Диагностика</h2>';
  if(d){
    h+='<p style="color:var(--muted)">'+ruDate(d.ts)+' · '+d.score+' из '+d.total+(d.grade?' · за '+(d.grade-2)+'–'+(d.grade-1)+' классы':'')+'</p><div class="nodes">'+NODE_ORDER.filter(function(n){return d.byNode[n]}).map(function(n){
      var r=d.byNode[n], p=pct(r[0],r[1]), color=p===100?'var(--green)':p>=50?'var(--gold)':'var(--red)';
      return '<div class="node"><span>'+NODE_NAMES[n]+'</span><span class="bw"><i style="width:'+p+'%;background:'+color+'"></i></span><span class="pill '+(p===100?'done':p>=50?'prog':'red')+'">'+r[0]+'/'+r[1]+'</span></div>';
    }).join('')+'</div>';
  }else h+='<p class="empty">Диагностика ещё не пройдена.</p>';
  h+='</div>';
  h+='<div class="sheet"><h2>Темы</h2><div class="scroll"><table><thead><tr><th>Тема</th><th>Практика</th><th>Тест</th><th>Статус</th></tr></thead><tbody>'
    +fullTopics.map(function(id){
      var t=kSt.tests[id];
      var pr=kSt.practice[id]||{};
      var solved=Object.keys(pr).filter(function(k){return k!=='b'&&pr[k].ok}).length;
      var s=(!t)?(solved>0?'prog':'new'):(t.best/t.total>=PASS?'done':'prog');
      var pill=s==='done'?'<span class="pill done">освоено</span>':s==='prog'?'<span class="pill prog">'+(t?('тест '+t.best+'/'+t.total):('задач '+solved+'/'+CONTENT[id].tasks.length))+'</span>':'<span class="pill">не начато</span>';
      return '<tr><td>'+esc(TOPICS[id].name)+'</td><td>'+solved+' / '+CONTENT[id].tasks.length+'</td><td>'+(t?('лучший '+t.best+'/'+t.total+', попыток: '+t.tries+'<br><span style="color:var(--muted)">'+ruDate(t.ts)+'</span>'):'—')+'</td><td>'+pill+'</td></tr>';
    }).join('')
    +'</tbody></table></div></div>';
  h+='<div class="sheet"><h2>Журнал попыток</h2>';
  if(!kSt.log.length) h+='<p class="empty">Пока нет завершённых тестов.</p>';
  else h+=kSt.log.slice(0,15).map(function(e){
    var name=e.kind==='diag'?'Диагностика':(TOPICS[e.topic]?'Тест: '+TOPICS[e.topic].name:'Тест');
    return '<details style="border-top:1px solid var(--line);padding:10px 0"><summary style="cursor:pointer"><b>'+esc(name)+'</b> — '+e.score+'/'+e.total+' <span style="color:var(--muted)">· '+ruDate(e.ts)+'</span>'+(e.work?' <span class="pill" style="margin-left:6px">есть решения</span>':'')+'</summary>'
      +(e.wrong.length?'<ul style="margin:8px 0 0;padding-left:20px;font-size:14.5px">'+e.wrong.map(function(w){return '<li>'+esc(w.q)+' — ответ ученика: <b>'+(w.given?esc(w.given):'—')+'</b>, правильно: <b>'+esc(w.right)+'</b>'+(w.work?'<br><span style="color:var(--muted)">Решение: '+esc(w.work)+'</span>':'')+'</li>'}).join('')+'</ul>':'<p style="margin:8px 0 0;font-size:14.5px">Без ошибок.</p>')+'</details>';
  }).join('');
  h+='</div>';
  return h;
}

/* ======================= СОБЫТИЯ ======================= */
document.addEventListener('click',function(ev){
  var t=ev.target.closest&&ev.target.closest('button,a'); if(!t) return;

  if(t.hasAttribute('data-support')){ openSupport('question'); return; }
  if(t.hasAttribute('data-pin-request')){ openSupport('pin'); return; }
  if(t.hasAttribute('data-support-close')){ closeSupport(); return; }
  if(t.hasAttribute('data-support-send')){ sendSupport(); return; }
  if(t.hasAttribute('data-support-kind')){ SUP.kind=t.getAttribute('data-support-kind'); drawSupport(); return; }
  if(t.hasAttribute('data-logout')){ cloudLogout(); return; }
  if(t.hasAttribute('data-google-login')){ openGoogleLogin(); return; }
  if(t.hasAttribute('data-onb-mode')){
    ONB.mode=t.getAttribute('data-onb-mode'); ONB.err='';
    var jr0=CLOUD.me&&CLOUD.me.joinRequest;
    if(ONB.mode==='kid' && jr0 && !ONB.name){ ONB.name=jr0.name||''; ONB.grade=+jr0.grade||0; ONB.parentEmail=jr0.parentEmail||''; }
    render(); try{window.scrollTo(0,0)}catch(e){} return;
  }
  if(t.hasAttribute('data-onb-grade')){ ONB.grade=+t.getAttribute('data-onb-grade'); render(); return; }
  if(t.hasAttribute('data-onb-parent-submit')){ onbParentSubmit(); return; }
  if(t.hasAttribute('data-onb-kid-submit')){ onbKidSubmit(); return; }
  if(t.hasAttribute('data-terms-accept')){ termsAcceptSubmit(); return; }
  if(t.hasAttribute('data-onb-check')){ onbPoll(); return; }
  if(t.hasAttribute('data-join-decide')){ joinDecide(t.getAttribute('data-join-decide'), t.getAttribute('data-approve')==='1', t); return; }
  if(t.hasAttribute('data-kidmail')){
    var kmid=t.getAttribute('data-kidmail'), inp=$('#km-'+kmid), st=$('#kmst-'+kmid), val=(inp&&inp.value||'').trim().toLowerCase();
    if(val && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val)){ if(st) st.textContent='Проверьте адрес почты'; return; }
    var kk=KIDS.filter(function(x){return x.id===kmid})[0]; if(!kk) return;
    if(val) kk.email=val; else delete kk.email;
    scheduleKidsSave(); if(st) st.textContent=val?'Сохранено':'Адрес убран';
    return;
  }
  var nav=t.getAttribute('data-nav');
  if(nav){
    if(nav==='home'||nav==='diag'||nav==='parent'||nav==='versions') go(nav);
    else if(nav==='landing'){ view={name:'landing'}; render(); try{window.scrollTo(0,0)}catch(e){} }
    else if(nav==='pickkid'){ pkReset(); go('pickkid'); }
    else if(nav==='parentgate'){ pkReset(); go('parent'); }
    else if(nav.indexOf('soon/')===0) go('soon',{id:nav.split('/')[1]});
    else if(nav.indexOf('t/')===0){var p=nav.split('/'); go('topic',{id:p[1],tab:p[2]||'explain'})}
    return;
  }
  if(t.hasAttribute('data-finish')){finish();return}
  if(t.hasAttribute('data-retry')){view.result=null;render();try{window.scrollTo(0,0)}catch(e){}return}
  if(t.hasAttribute('data-copy')){
    var ta=$('#rep'); if(!ta) return;
    ta.select();
    var done=function(){var c=$('#copied'); if(c) c.textContent='Скопировано'};
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,function(){document.execCommand('copy');done()})} else {document.execCommand('copy');done()} }catch(e){}
    return;
  }
  /* --- выбор профиля ребёнка --- */
  var pkOpen=t.getAttribute('data-pk-open');
  if(pkOpen!==null){ pick.mode='pin'; pick.kidId=pkOpen; pick.pin=''; pick.err=''; render(); return; }
  if(t.hasAttribute('data-pk-new')){ pick.mode='newname'; pick.name=''; pick.err=''; render(); setTimeout(function(){var el=$('#newKidName'); if(el) el.focus()},30); return; }
  if(t.hasAttribute('data-pk-back')){
    if(pick.mode==='pin') pkReset();
    else if(pick.mode==='newname') pkReset();
    else if(pick.mode==='newgrade'){ pick.mode='newname'; }
    else if(pick.mode==='newpin'){ pick.mode='newgrade'; pick.pin=''; }
    else if(pick.mode==='newpin2'){ pick.mode='newpin'; pick.pin=''; }
    render(); return;
  }
  if(t.hasAttribute('data-pk-name-next')){
    var nameEl=$('#newKidName'); var nm=nameEl?nameEl.value.trim():'';
    if(!nm){ pick.err='Введи имя.'; render(); return; }
    if(KIDS.some(function(k){return k.name.toLowerCase()===nm.toLowerCase()})){ pick.err='Такое имя уже есть — выбери другое.'; render(); return; }
    pick.name=nm; pick.err=''; pick.mode='newgrade'; pick.pin=''; render(); return;
  }
  var pkGr=t.getAttribute('data-pk-grade');
  if(pkGr!==null){ pick.grade=+pkGr; pick.mode='newpin'; pick.pin=''; pick.err=''; render(); return; }
  var pkKeyAttr=t.getAttribute('data-pk-key');
  if(pkKeyAttr!==null){ pkKey(pkKeyAttr); return; }
  /* --- родительский пароль --- */
  if(t.hasAttribute('data-pg-key')){ pgKey(t.getAttribute('data-pg-key')); return; }
  if(t.hasAttribute('data-pg-submit')){ pgSubmit(); return; }
  if(t.hasAttribute('data-parent-grade')){
    var pg=+t.getAttribute('data-parent-grade'), pk=view.parentKid||(KIDS[0]&&KIDS[0].id);
    KIDS.forEach(function(k){ if(k.id===pk) k.grade=pg; });
    scheduleKidsSave(); render(); return;
  }
  if(t.hasAttribute('data-parent-switch')){ parentSwitchKid(t.getAttribute('data-parent-switch')); return; }
  if(t.hasAttribute('data-parent-lock')){ parentUnlocked=false; try{sessionStorage.removeItem(LS_PARENT_OK)}catch(e){} pkReset(); go('pickkid'); return; }

  var optPick=t.getAttribute('data-pick');
  if(optPick!==null){
    $$('.opt',t.parentNode).forEach(function(o){o.classList.remove('sel')});
    t.classList.add('sel'); return;
  }
  var task=t.closest('.task[data-topic]');
  if(task){
    var id=task.getAttribute('data-topic'), key=task.getAttribute('data-i');
    if(t.hasAttribute('data-check')) checkTask(task,id,key);
    else if(t.hasAttribute('data-opt')) checkTask(task,id,key,+t.getAttribute('data-opt'));
    else if(t.hasAttribute('data-hint')) showExtra(task,'hint',id,key);
    else if(t.hasAttribute('data-sol')) showExtra(task,'sol',id,key);
  }
});
document.addEventListener('keydown',function(ev){
  if(SUP.open){ if(ev.key==='Escape') closeSupport(); return; }
  if(view.name==='pickkid' && (pick.mode==='pin'||pick.mode==='newpin'||pick.mode==='newpin2')){
    if(/^[0-9]$/.test(ev.key)) pkKey(ev.key);
    else if(ev.key==='Backspace') pkKey('back');
    return;
  }
  if(view.name==='pickkid' && pick.mode==='newname' && ev.key==='Enter' && ev.target.id==='newKidName'){
    var nb=$('[data-pk-name-next]'); if(nb) nb.click();
    return;
  }
  if(view.name==='parent' && !parentUnlocked && document.getElementById('pgpad')){
    if(/^[0-9]$/.test(ev.key)) pgKey(ev.key);
    else if(ev.key==='Backspace') pgKey('back');
    return;
  }
  if(ev.key==='Enter'&&ev.target.matches&&ev.target.matches('.task[data-topic] input.in')){
    var task=ev.target.closest('.task'); checkTask(task,task.getAttribute('data-topic'),task.getAttribute('data-i'));
  }
});
function itemFor(id,key){return key==='b'?CONTENT[id].bonus:CONTENT[id].tasks[+key]}
function checkTask(task,id,key,optIdx){
  var it=itemFor(id,key), ok, given;
  var pr=S.practice[id]||(S.practice[id]={}); var st=pr[key]||(pr[key]={ok:false,tries:0});
  if(st.ok) return;
  if(it.opts){ given=optIdx; ok=optIdx===it.ans; }
  else{ var inp=$('input.in',task); given=inp.value.trim(); if(given==='') {$('.fb',task).textContent='Введи ответ.'; $('.fb',task).className='fb bad'; return} ok=gradeNum(it,given); }
  st.tries++;
  var fb=$('.fb',task), extra=$('.extra',task);
  if(ok){
    st.ok=true; st.val=it.opts?'':String(given);
    fb.className='fb ok'; fb.innerHTML=okBadge()+'<span>Верно'+(st.tries===1?' — с первого раза':'')+'!</span>';
    if(!it.opts){var inp2=$('input.in',task); inp2.classList.add('ok'); inp2.readOnly=true; $('[data-check]',task).disabled=true}
    else $$('.opt',task).forEach(function(o,k){if(k===it.ans)o.classList.add('ok')});
    extra.innerHTML='<div class="solbox"><b>Решение.</b> '+fmt(it.sol)+'</div>';
    var c=$('#solved'); if(c) c.textContent=solvedCount(id);
    var tabc=$('.tabs .cnt'); if(tabc) tabc.textContent=solvedCount(id)+'/'+CONTENT[id].tasks.length;
  }else{
    fb.className='fb bad';
    if(it.opts){ $$('.opt',task).forEach(function(o,k){if(k===optIdx)o.classList.add('bad')}); fb.textContent='Пока не так. Выбери другой вариант.'; }
    else{ $('input.in',task).classList.add('bad'); fb.textContent='Пока не так. Проверь вычисления'+(it.reduced?' и не забудь сократить дробь':'')+'.'; }
    var btns='';
    btns+='<button class="btn small ghost" data-hint>Подсказка</button> ';
    if(st.tries>=2) btns+='<button class="btn small ghost" data-sol>Показать решение</button>';
    extra.innerHTML='<div class="ans-row" style="margin-top:6px">'+btns+'</div><div class="ex-out"></div>';
  }
  scheduleSave();
  paintBar();
}
function showExtra(task,kind,id,key){
  var it=itemFor(id,key), out=$('.ex-out',task); if(!out) return;
  if(kind==='hint') out.innerHTML='<div class="hintbox"><b>Подсказка.</b> '+fmt(it.hint||'Разбей задачу на шаги и проверь каждый.')+'</div>';
  else{
    out.innerHTML='<div class="solbox"><b>Решение.</b> '+fmt(it.sol)+'<br><span style="color:var(--muted)">Теперь реши похожую задачу сам и введи ответ.</span></div>';
  }
}
document.addEventListener('input',function(ev){
  if(ev.target.id==='supText') SUP.text=ev.target.value;
  else if(ev.target.id==='supContact') SUP.contact=ev.target.value;
  if(ev.target.matches&&ev.target.matches('input.in')){ev.target.classList.remove('bad')}
});

render();
</script>
