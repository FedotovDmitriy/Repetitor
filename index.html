CONTENT.mul4 = {
  goal: 'После этой темы ты сможешь умножать многозначные числа на однозначные и двузначные столбиком, делить их уголком (в том числе с остатком и с нулями в частном) и проверять себя обратным действием.',
  explain: '<p>Складывать и вычитать большие числа ты уже умеешь. Теперь научимся умножать и делить их письменно — так, как это делают в школе и как считают в столбик и уголком. Главное — работать по шагам и не спешить.</p>'
  + '<h3>Умножение на однозначное число</h3>'
  + '<p>Записываем числа столбиком: разряд под разрядом, а однозначный множитель — под единицами. Умножаем каждую цифру верхнего числа на множитель, начиная с единиц. Если получилось 10 или больше, пишем единицы, а десятки запоминаем и прибавляем к следующему произведению. Найдём 3 128 · 4. Единицы: 8 · 4 = 32, пишем 2, запоминаем 3. Десятки: 2 · 4 = 8, и ещё 3 — получается 11, пишем 1, запоминаем 1. Сотни: 1 · 4 = 4, и ещё 1 — это 5. Тысячи: 3 · 4 = 12. Ответ: 12 512.</p>'
  + '<h3>Умножение на двузначное число</h3>'
  + '<p>Двузначный множитель — это единицы плюс десятки: 36 = 6 + 30. Поэтому умножаем число на каждую его часть отдельно и складываем. Сначала на единицы (на 6), получаем первое частичное произведение. Потом на десятки (на 3 десятка) — и второе частичное произведение записываем <b>со сдвигом на один разряд влево</b>: под единицами ставим нуль (можно просто оставить это место пустым). Потом складываем.</p>'
  + '<div class="figure">__SVG_MUL4_COLUMN__</div>'
  + '<p>Посмотри на картинку: 274 · 6 = 1 644, 274 · 30 = 8 220, сумма 1 644 + 8 220 = 9 864.</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Забывают сдвиг: второе частичное произведение пишут прямо под первым, а не на разряд левее. Тогда ответ получается в несколько раз меньше настоящего. Проверь себя прикидкой: 274 · 36 — это примерно 300 · 40 = 12 000, а не 3 000.</div>'
  + '<h3>Нули и свойства умножения</h3>'
  + '<p>Когда в конце множителей стоят нули, умножь числа без нулей, а потом припиши все отброшенные нули. Возьмём 350 · 40: у 350 один нуль, у 40 тоже один — всего два. Считаем 35 · 4 = 140 и приписываем два нуля: 14 000.</p>'
  + '<p>Свойства помогают считать удобно. Переместительное: a · b = b · a. Сочетательное: (a · b) · c = a · (b · c). Например, 25 · 48 = 25 · 4 · 12 = 100 · 12 = 1 200. Распределительное: 7 · 104 = 7 · 100 + 7 · 4 = 728.</p>'
  + '<h3>Деление уголком на однозначное число</h3>'
  + '<p>Записываем делимое, справа «уголок» и делитель. Берём первую цифру делимого; если она меньше делителя, берём первые две. Это первое неполное делимое: делим его, пишем цифру в частном, умножаем её на делитель, вычитаем, «сносим» следующую цифру — и снова делим. Так повторяем, пока не «снесём» все цифры. Число цифр в частном определяется тем, сколько раз мы делили.</p>'
  + '<div class="figure">__SVG_MUL4_LONGDIV__</div>'
  + '<p>3 618 : 6. Первое неполное делимое 36: 36 : 6 = 6. Сносим 1, но 1 меньше 6 — значит, в частном пишем 0. Сносим 8 и делим 18 : 6 = 3. Частное 603.</p>'
  + '<div class="note"><span class="hand">Запомни</span>Каждый раз, когда снесённая цифра образует число меньше делителя, в частном пишем 0 и сносим следующую цифру. Нули в частном нельзя пропускать: 603 и 63 — разные числа!</div>'
  + '<h3>Деление с остатком и проверка</h3>'
  + '<p>Не всегда получается разделить нацело. В конце может остаться <b>остаток</b> — число, которое уже нельзя разделить на делитель. Остаток всегда <b>меньше делителя</b>. Например, 1 000 : 7: 7 · 142 = 994, остаток 1 000 − 994 = 6. Записываем 1 000 : 7 = 142 (ост. 6). Проверка: <b>делитель · частное + остаток = делимое</b>: 7 · 142 + 6 = 1 000.</p>'
  + '<p>Проверка умножением работает и при делении без остатка: если 3 618 : 6 = 603, то 603 · 6 должно дать 3 618.</p>'
  + '<h3>Деление на двузначное число</h3>'

CONTENT.val4 = {
  goal: 'После этой темы ты сможешь переводить одни единицы длины, массы, площади и времени в другие, складывать и вычитать именованные числа и решать задачи на время.',
  explain: '<p>Мы измеряем всё вокруг: длину дороги, вес арбуза, площадь комнаты, время урока. То, что можно измерить, называют <b>величиной</b>, а то, чем измеряют, — <b>единицей измерения</b>. Трудности начинаются, когда единицы разные: например, длина доски в метрах и сантиметрах. Тогда нужно уметь «переводить» одни единицы в другие. Это совсем несложно, если знать лесенку.</p>'
  + '<h3>Длина и масса: лесенка единиц</h3>'
  + '<p>Единицы длины: километр (км), метр (м), дециметр (дм), сантиметр (см), миллиметр (мм). Единицы массы: тонна (т), центнер (ц), килограмм (кг), грамм (г). Посмотри на схему: между соседними ступеньками стоит число, которое показывает, во сколько раз одна единица больше другой.</p>'
  + '<div class="figure">__SVG_VAL4_LADDERS__</div>'
  + '<p>Правило простое. Когда идём <b>вправо</b> (к более мелкой единице), одних и тех же вещей получается больше, поэтому число <b>умножаем</b>. Когда идём <b>влево</b> (к более крупной единице), число <b>делим</b>. Например, 3 м = 3 · 100 = 300 см, а 5000 г = 5000 : 1000 = 5 кг.</p>'
  + '<div class="note"><span class="hand">Запомни</span>1 км = 1000 м; 1 м = 10 дм = 100 см = 1000 мм; 1 дм = 10 см; 1 см = 10 мм. 1 т = 10 ц = 1000 кг; 1 ц = 100 кг; 1 кг = 1000 г.</div>'
  + '<p>Чтобы <b>перевести составное значение</b> в мелкие единицы, переводим крупную часть и прибавляем остаток: 4 км 30 м = 4000 м + 30 м = 4030 м; 5 т 3 ц = 5000 кг + 300 кг = 5300 кг. А чтобы перейти <b>к крупным единицам</b>, делим с остатком: 5210 см : 100 = 52 (остаток 10), значит, 5210 см = 52 м 10 см.</p>'
  + '<h3>Складываем и вычитаем именованные числа</h3>'
  + '<p>Складывать можно только <b>одинаковые единицы</b>: метры с метрами, сантиметры с сантиметрами. Сложим 3 м 45 см и 2 м 78 см. Сначала сантиметры: 45 + 78 = 123 см. Это больше 100, значит, 123 см = 1 м 23 см. Метры: 3 + 2 = 5, да ещё 1 м из сантиметров: 5 + 1 = 6. Ответ: 6 м 23 см. Проверим по-другому: 345 см + 278 см = 623 см = 6 м 23 см. Верно!</p>'
  + '<p>При вычитании иногда не хватает мелких единиц, и приходится «занять» одну крупную. Найдём 5 м 20 см − 2 м 65 см. Двадцать сантиметров меньше шестидесяти пяти, поэтому 1 м из пяти метров превращаем в 100 см: 5 м 20 см = 4 м 120 см. Теперь 120 − 65 = 55 см и 4 − 2 = 2 м. Ответ: 2 м 55 см.</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Переносят «десяток», как в обычных числах, хотя в 1 м не 10 см, а 100 см, а в 1 часе не 100 минут, а 60. Складывая 45 см и 78 см, получают 123 «сантиметра» и пишут 3 м 45 см + 2 м 78 см = 5 м 123 см. Так нельзя: лишние 100 см нужно превратить в метр.</div>'
  + '<h3>Площадь</h3>'
  + '<p>Площадь показывает, сколько места занимает фигура. Её измеряют квадратиками: квадрат со стороной 1 см — это 1 <b>квадратный сантиметр</b> (1 см²). Возьмём квадрат со стороной 1 дм. В его стороне 10 см, значит, вдоль и поперёк помещается по 10 квадратиков, и всего 10 · 10 = 100 см². Так и получается, что 1 дм² = 100 см². Точно так же 1 м² = 100 дм² = 10 000 см², а 1 км² = 1 000 000 м².</p>'
  + '<div class="figure">__SVG_VAL4_AREA__</div>'
  + '<p>Обрати внимание: у единиц площади каждая ступенька — это <b>×100</b>, а не ×10. Поэтому 3 м² 40 дм² = 300 дм² + 40 дм² = 340 дм².</p>'

CONTENT.word4 = {
  goal: 'После этой темы ты сможешь разобраться в текстовой задаче: сделать краткую запись или схему, составить план и решить задачу на цену и стоимость, движение, работу, сравнение и части.',
  explain: '<p>Текстовая задача — это маленькая история с числами и вопросом. Многие боятся задач, потому что начинают считать сразу, не разобравшись, о чём история. А хороший решальщик сначала <b>понимает</b>, потом считает. Вот порядок, который всегда работает.</p>'

  + '<li><b>3. Запиши коротко</b> или нарисуй схему-отрезок: какие числа известны, какое неизвестно.</li>'
  + '<li><b>4. Составь план</b>: какое действие можно сделать первым и что оно даёт.</li>'
  + '<li><b>5. Реши, проверь и запиши ответ.</b></li></ul>'
  + '<h3>Цена, количество, стоимость</h3>'
  + '<p><b>Цена</b> — сколько стоит одна штука (или 1 кг, 1 метр). <b>Количество</b> — сколько штук купили. <b>Стоимость</b> — сколько заплатили за всё. Если 6 тетрадей по 24 рубля, то стоимость: 24 · 6 = 144 рубля. Все три величины связаны одним «треугольником»: стоимость = цена · количество. Отсюда цена = стоимость : количество, а количество = стоимость : цена.</p>'
  + '<div class="figure">__SVG_WORD4_TRIANGLE__</div>'
  + '<p>Точно так же устроены две другие связи из схемы. <b>Движение:</b> путь = скорость · время. Велосипедист едет 3 часа со скоростью 14 км/ч, значит, проедет 14 · 3 = 42 км. <b>Работа:</b> всего = (сколько делают за 1 час) · (число часов). Если мастер за час делает 9 деталей, то за 8 часов он сделает 9 · 8 = 72 детали. Число «сколько делают за 1 час» называют <b>производительностью</b>.</p>'
  + '<div class="note"><span class="hand">Запомни</span>Во всех трёх задачах работает одна идея: <b>«за одну единицу» · «число единиц» = «всё вместе»</b>. Если «всё вместе» известно, а ищем одну из частей — делим.</div>'
  + '<h3>Встречное движение и вдогонку</h3>'
  + '<p>Если два человека идут <b>навстречу</b>, каждую минуту расстояние между ними уменьшается сразу на две скорости, поэтому скорости <b>складываем</b>. Расстояние 36 км, скорости 4 и 5 км/ч: скорость сближения 4 + 5 = 9 км/ч, до встречи 36 : 9 = 4 часа. Если один <b>догоняет</b> другого (оба едут в одну сторону), расстояние уменьшается лишь на <b>разность</b> скоростей. Расстояние 18 км, скорости 15 и 12 км/ч: 15 − 12 = 3 км/ч, догонит через 18 : 3 = 6 часов.</p>'
  + '<h3>Сравнение чисел: «на» и «в»</h3>'
  + '<p>Слова в условии подсказывают действие. «<b>На</b> 9 больше» — прибавляем 9, «на 9 меньше» — вычитаем 9. «<b>В</b> 3 раза больше» — умножаем на 3, «в 3 раза меньше» — делим на 3. Схема-отрезок делает это видимым: отрезок «на 9 больше» — это такой же отрезок и ещё кусочек 9, а «в 3 раза больше» — три одинаковых отрезка.</p>'
  + '<div class="figure">__SVG_WORD4_BARS__</div>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Путают «на» и «в». Задача «в 3 раза меньше» — это деление, а не вычитание: если красных шаров 12, а синих в 3 раза меньше, то синих 12 : 3 = 4, а не 12 − 3. Ещё одна ловушка: «первый на 5 больше второго» значит, что у второго на 5 <b>меньше</b>, и чтобы его найти, надо из числа для первого вычесть 5.</div>'
  + '<h3>Задачи в 2–3 действия</h3>'

  + '<h3>Задачи на части</h3>'

  + '<div class="figure">__SVG_WORD4_PARTS__</div>'

CONTENT.geo4 = {
  goal: 'После этой темы ты сможешь находить периметр и площадь прямоугольника, квадрата и составных фигур, узнавать виды углов и треугольников, знать радиус и диаметр круга и называть части куба и параллелепипеда.',
  explain: '<p>Геометрия — это наука о фигурах. Тетрадный лист, окно, футбольное поле, монета, коробка — вокруг нас одни фигуры. Давай разберёмся, как их измерять и как их называть.</p>'
  + '<h3>Периметр и площадь</h3>'
  + '<p><b>Периметр</b> — это сумма длин всех сторон фигуры. Представь, что ты идёшь вокруг клумбы: сколько шагов сделаешь, пока не вернёшься на место, — это и есть периметр. У прямоугольника противоположные стороны равны, поэтому у него две «длины» и две «ширины». Если длина 9 см, а ширина 4 см, то P = 9 + 4 + 9 + 4 = 26 см. Короче: <b>P = (a + b) · 2</b>. У квадрата все четыре стороны равны: <b>P = a · 4</b>.</p>'
  + '<p><b>Площадь</b> — это сколько места фигура занимает. Её измеряют квадратиками. Прямоугольник 5 см на 3 см можно разлиновать на 3 ряда по 5 квадратиков со стороной 1 см, всего 5 · 3 = 15 таких квадратиков. Значит, <b>S = a · b</b>, а для квадрата <b>S = a · a</b>. Площадь пишут с маленькой двойкой: 15 см² (читается «пятнадцать квадратных сантиметров»).</p>'
  + '<div class="note"><span class="hand">Запомни</span>Периметр — это <i>длина</i> границы, его меряют в см, м, км. Площадь — это <i>размер поверхности</i>, её меряют в см², дм², м². Периметр мы складываем, площадь — умножаем.</div>'
  + '<h3>Единицы площади</h3>'
  + '<p>1 см² — это квадрат со стороной 1 см. А 1 дм² — квадрат со стороной 1 дм = 10 см. В нём 10 рядов по 10 квадратиков, то есть <b>1 дм² = 100 см²</b>. Точно так же 1 м² — квадрат со стороной 10 дм, в нём 10 · 10 = 100 дм². Значит, <b>1 м² = 100 дм²</b>. (А в 1 м² сантиметровых квадратов 100 · 100 = 10 000.) Поэтому 3 дм² = 300 см², а 500 дм² = 5 м².</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Думают, что в 1 дм² десять см², потому что в 1 дм десять см. Это верно для длины, а для площади единицы «в квадрате»: 10 · 10 = 100. Ещё ошибка — перемножать величины в разных единицах: сначала переведи всё в одну единицу (3 дм · 20 см = 30 см · 20 см = 600 см²).</div>'
  + '<h3>Сложные фигуры из прямоугольников</h3>'
  + '<p>Если фигура похожа на букву Г, её можно разрезать на два прямоугольника, найти площадь каждого и сложить. Есть и второй путь: дополнить фигуру до большого прямоугольника, найти его площадь и вычесть «лишний» кусок. Оба пути должны дать один и тот же ответ — это хорошая проверка.</p>'
  + '<div class="figure">__SVG_GEO4_COMPOSITE__</div>'
  + '<h3>Если площадь или периметр известны</h3>'
  + '<p>Площадь — это a · b, значит, неизвестную сторону находим делением: <b>b = S : a</b>. Например, площадь 84 см², одна сторона 12 см, тогда вторая 84 : 12 = 7 см. С периметром так: сначала находим сумму двух соседних сторон, P : 2, а потом вычитаем известную. Периметр 40 см, одна сторона 14 см: 40 : 2 = 20, 20 − 14 = 6 см.</p>'
  + '<h3>Виды углов</h3>'
  + '<p>Угол — это две линии (лучи), которые выходят из одной точки. Самый важный угол — <b>прямой</b>: такой угол у тетрадного листа и у угольника, он равен 90°. Всё, что меньше прямого, — <b>острый</b> угол. Больше прямого, но меньше развёрнутого — <b>тупой</b>. А если стороны угла лежат на одной прямой, получается <b>развёрнутый</b> угол, он равен 180° — два прямых угла вместе.</p>'
  + '<div class="figure">__SVG_GEO4_ANGLES__</div>'
  + '<h3>Виды треугольников</h3>'
  + '<p>Треугольники делят на виды по сторонам: <b>равносторонний</b> (все стороны равны), <b>равнобедренный</b> (две стороны равны, они называются боковыми, а третья — основанием), <b>разносторонний</b> (все стороны разные). А по углам треугольник может быть <b>прямоугольным</b> — тогда в нём есть прямой угол. Один и тот же треугольник можно назвать по-разному: например, треугольник со сторонами 3, 4 и 5 см, у которого есть прямой угол, — разносторонний и прямоугольный сразу.</p>'
  + '<div class="figure">__SVG_GEO4_TRIANGLES__</div>'
  + '<div class="note"><span class="hand">Запомни</span>Равносторонний треугольник — это «особый» равнобедренный: у него не две, а все три стороны равны. Его периметр находят умножением: P = a · 3.</div>'
  + '<h3>Окружность и круг</h3>'
  + '<p>Окружность рисуют циркулем: это линия, все точки которой одинаково удалены от центра. <b>Круг</b> — это фигура внутри окружности. Отрезок от центра до любой точки окружности — <b>радиус</b>. Отрезок через центр, соединяющий две точки окружности, — <b>диаметр</b>. Диаметр состоит из двух радиусов: <b>d = r · 2</b>. Если радиус 6 см, то диаметр 12 см; если диаметр 18 см, то радиус 9 см.</p>'
  + '<h3>Куб и прямоугольный параллелепипед</h3>'
  + '<p>Коробка из-под обуви — это прямоугольный параллелепипед, а игральная кость — куб. У них по <b>6 граней</b> (плоские стороны), <b>12 рёбер</b> (линии, где встречаются две грани) и <b>8 вершин</b> (уголки). У параллелепипеда грани — прямоугольники, причём противоположные грани одинаковые. У куба все грани — равные квадраты, а все 12 рёбер равны.</p>',
  examples: [

CONTENT.frac4 = {
  goal: 'После этой темы ты сможешь читать и записывать дроби, сравнивать их, складывать и вычитать дроби с одинаковыми знаменателями и находить долю от числа и число по его доле.',
  explain: '<p>Что делать, если пирог нужно разделить между четырьмя друзьями? Каждому достанется <i>часть</i> пирога. Именно для таких частей и придумали доли и дроби.</p>'
  + '<h3>Что такое доля</h3>'
  + '<p>Возьмём целое: яблоко, шоколадку, отрезок, число 20. Разделим его на несколько <b>равных</b> частей. Каждая такая часть — это <b>доля</b>. Если целое разделили на 2 равные части, каждая — половина, то есть {1|2}. Если на 4 равные части — четверть, {1|4}. На 5 частей — одна пятая, {1|5}, и так далее. Главное слово здесь «равные»: если куски разного размера, то долями их назвать нельзя.</p>'
  + '<h3>Что такое дробь</h3>'
  + '<p>Часто мы берём не одну долю, а несколько. Тогда получается <b>дробь</b>. Смотри на схему: полоску разделили на 8 равных частей и закрасили 3 из них. Закрашено {3|8} полоски (читается «три восьмых»).</p>'
  + '<div class="figure">__SVG_FRAC4_PARTS__</div>'
  + '<p>Дробь записывают двумя числами с чертой между ними. Число под чертой — <b>знаменатель</b>: он показывает, на сколько равных частей разделили целое. Число над чертой — <b>числитель</b>: он показывает, сколько таких частей взяли. Черта дроби заменяет знак деления: {3|8} = 3 : 8.</p>'
  + '<div class="note"><span class="hand">Запомни</span>Знаменатель — <i>название</i> долей (пятые, седьмые, десятые), а числитель — их <i>количество</i>. Целое равно дроби, у которой числитель и знаменатель одинаковые: {5|5} = 1, {12|12} = 1.</div>'
  + '<h3>Сравнение дробей</h3>'
  + '<p><b>1) Одинаковые знаменатели.</b> Части одного размера, значит, больше та дробь, у которой больше частей, то есть больше числитель. {5|9} больше {2|9}, потому что 5 частей больше, чем 2 части того же размера.</p>'
  + '<p><b>2) Одинаковые числители.</b> Частей поровну, но размеры разные. Чем на большее число частей разрезали целое, тем мельче каждая часть. Поэтому дробь с <b>большим знаменателем меньше</b>: {1|8} меньше {1|3}, {3|10} меньше {3|5}. Вспомни пиццу: одна восьмая часть меньше одной трети. На схеме выше видно, что доли {1|2}, {1|3}, {1|4}, {1|5} становятся всё короче.</p>'
  + '<h3>Сложение и вычитание с одинаковыми знаменателями</h3>'
  + '<p>Складывать восьмые с восьмыми так же легко, как яблоки с яблоками: {2|9} + {5|9} = {7|9}. Мы взяли 2 девятых и ещё 5 девятых, всего 7 девятых. Вычитание тоже просто: {7|8} − {3|8} = {4|8}. Знаменатель не меняется — размер долей тот же, меняется только их количество. Если в сумме получилось столько частей, сколько во всём целом, то это целое число: {3|7} + {4|7} = {7|7} = 1.</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Складывают и знаменатели: {2|9} + {5|9} = {7|18}. Так делать нельзя! Ты же не пересчитываешь заново, на сколько частей разрезан пирог, ты лишь считаешь, сколько кусков у тебя стало. Знаменатель остаётся 9.</div>'
  + '<h3>Доля от числа и число по доле</h3>'
  + '<p>Как найти {1|5} от 45? Разделим 45 на 5 равных частей: 45 : 5 = 9. Значит, одна пятая от 45 равна 9. А чтобы найти {3|5} от 20, сначала найдём одну пятую: 20 : 5 = 4, а потом возьмём таких частей три: 4 · 3 = 12.</p>'
  + '<p>Бывает и наоборот: известна часть, а нужно найти всё число. Если {1|4} числа равна 12, то всего таких частей 4, значит, число равно 12 · 4 = 48.</p>'
  + '<div class="figure">__SVG_FRAC4_OF_NUMBER__</div>'
  + '<p>Правило: <b>чтобы найти долю от числа, надо число разделить на знаменатель</b> (получится одна доля), <b>а затем умножить на числитель</b>. Чтобы найти число по его доле, надо, наоборот, известную часть разделить на числитель, а потом умножить на знаменатель.</p>'
  + '<h3>Правильные и неправильные дроби, числовой луч</h3>'
  + '<p>Дробь, которая меньше целого, называют <b>правильной</b>: у неё числитель меньше знаменателя, например {2|5} или {7|9}. Дробь, у которой числитель равен знаменателю или больше его, называют <b>неправильной</b>: {5|5}, {7|5}, {9|4}. Она равна 1 или больше 1. Этого названия достаточно запомнить, действий с ними пока не будет.</p>'
  + '<p>Дроби можно отмечать на числовом луче. Возьмём единичный отрезок от 0 до 1 и разделим его на 5 равных частей. Первая отметка — {1|5}, вторая — {2|5}, пятая попадёт в точку 1, а дальше идём за единицу: {7|5} стоит правее 1 на две пятых.</p>'
  + '<div class="figure">__SVG_FRAC4_LINE__</div>',
  examples: [
    {t:'Круг разделили на 10 равных частей и закрасили 7. Запиши дробь, назови числитель и знаменатель.', s:'Закрашено {7|10} круга (семь десятых). Знаменатель 10 — на столько частей разделили круг, числитель 7 — столько частей закрасили.'},
    {t:'Сравни дроби: {4|9} и {7|9}; {2|5} и {2|3}.', s:'У первой пары одинаковые знаменатели, поэтому больше та, у которой больше числитель: {4|9} меньше {7|9}. У второй пары одинаковые числители. Пятые доли мельче третьих, значит, {2|5} меньше {2|3}.'},
    {t:'Найди значения: {5|12} + {7|12}; {8|11} − {3|11}.', s:'Знаменатель оставляем прежним. {5|12} + {7|12} = {12|12} = 1, потому что взяли все 12 частей. {8|11} − {3|11} = {5|11}.'},

CONTENT.ratio = {
  goal: 'После этой темы ты сможешь сравнивать числа с помощью отношения, делить величину в заданном отношении, решать пропорции и задачи на прямую и обратную пропорциональность, а по масштабу переводить сантиметры на карте в километры на местности.',
  explain: '<p>Как сравнить два числа? Можно узнать, на сколько одно больше другого (вычитанием), а можно — <b>во сколько раз</b> оно больше (делением). Второй способ и называют отношением. Оно нужно везде: в рецептах, на картах, в задачах про цену и работу.</p>'
  + '<h3>Отношение двух чисел</h3>'
  + '<p><b>Отношение</b> чисел a и b — это частное a : b (b не равно нулю). Оно показывает две вещи: <b>во сколько раз</b> a больше b и <b>какую часть</b> a составляет от b. Например, в классе 12 мальчиков и 18 девочек. Отношение мальчиков к девочкам: 12 : 18 = {2|3}. Значит, мальчиков составляют {2|3} от числа девочек. А отношение девочек к мальчикам: 18 : 12 = {3|2} = 1,5 — девочек в 1,5 раза больше.</p>'
  + '<p>Отношение не изменится, если оба числа умножить или разделить на одно и то же число (кроме нуля): 12 : 18 = 6 : 9 = 2 : 3. Поэтому отношения можно сокращать так же, как дроби. Если величины измерены в разных единицах, сначала переведи их в одинаковые: отношение 2 м к 50 см — это 200 : 50 = 4.</p>'
  + '<p>Проценты — это тоже отношение: 25% — то же самое, что отношение 25 : 100, то есть {1|4}. Подробно проценты ты изучал в другой теме, здесь достаточно запомнить эту связь.</p>'
  + '<h3>Деление числа в данном отношении</h3>'
  + '<p>Разделим 60 ₽ между двумя друзьями в отношении 2 : 3. Это значит: на каждые 2 части одного приходится 3 части другого. Всего частей 2 + 3 = 5. Одна часть: 60 : 5 = 12 ₽. Первый получит 2 · 12 = 24 ₽, второй — 3 · 12 = 36 ₽. Проверка: 24 + 36 = 60, и 24 : 36 = 2 : 3.</p>'
  + '<h3>Пропорция и её основное свойство</h3>'
  + '<p><b>Пропорция</b> — это равенство двух отношений, например 3 : 4 = 9 : 12. Крайние члены — первый и последний (3 и 12), средние — два внутренних (4 и 9).</p>'
  + '<div class="figure">__SVG_RATIO_PROPORTION__</div>'
  + '<div class="note"><span class="hand">Запомни</span>Основное свойство пропорции: <b>произведение крайних членов равно произведению средних</b>. В пропорции 3 : 4 = 9 : 12 имеем 3 · 12 = 36 и 4 · 9 = 36. Это свойство работает и в обратную сторону: если произведения равны, пропорция верна.</div>'
  + '<p>Как найти неизвестный член? Пусть 3 : 4 = x : 12. Здесь x — средний член. Он равен произведению крайних, делённому на другой средний: x = 3 · 12 : 4 = 9. Если неизвестен крайний член, то он равен произведению средних, делённому на другой крайний: в пропорции x : 6 = 14 : 21 получаем x = 6 · 14 : 21 = 4.</p>'
  + '<h3>Прямая пропорциональность</h3>'
  + '<p>Величины прямо пропорциональны, если при увеличении одной в несколько раз другая увеличивается во столько же раз. Цена и количество: за 3 кг яблок заплатили 240 ₽. Сколько стоят 5 кг? Составим пропорцию: 3 : 5 = 240 : x, значит x = 5 · 240 : 3 = 400 ₽. Можно и через цену одного килограмма: 240 : 3 = 80 ₽, потом 80 · 5 = 400 ₽. Оба способа дают один ответ.</p>'
  + '<h3>Обратная пропорциональность</h3>'
  + '<p>Иногда всё наоборот: чем больше одна величина, тем меньше другая. Бригада из 2 рабочих красит забор за 12 дней. Если рабочих станет 4 (в 2 раза больше), то дней потребуется 6 (в 2 раза меньше). Общий объём работы не меняется: 2 · 12 = 4 · 6 = 24 «рабочих-дня».</p>'
  + '<div class="figure">__SVG_RATIO_INVERSE__</div>'
  + '<p>Значит, у обратной пропорциональности неизменно <b>произведение</b>: 6 рабочих сделают ту же работу за 24 : 6 = 4 дня.</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Не различают прямую и обратную зависимость. Спроси себя: «Если одна величина вырастет, другая тоже вырастет или уменьшится?» Больше килограммов — больше цена (прямая). Больше рабочих — меньше дней (обратная). Ещё одна ошибка: считать отношение, не переведя величины в одинаковые единицы (метры и сантиметры).</div>'
  + '<h3>Масштаб карты и плана</h3>'
  + '<p><b>Масштаб</b> — отношение длины на карте к длине на местности. Запись 1 : 2 000 000 значит: 1 см на карте изображает 2 000 000 см на местности. Переведём: 2 000 000 см = 20 000 м = 20 км. Итак, 1 см на карте — это 20 км.</p>'
  + '<div class="figure">__SVG_RATIO_MAP_SCALE__</div>'
  + '<p>С карты на местность: умножай. Между городами 3,5 см, значит на местности 3,5 · 20 = 70 км. С местности на карту: дели. Расстояние 90 км на карте займёт 90 : 20 = 4,5 см. Для плана комнаты работает то же правило: при масштабе 1 : 50 отрезок в 1 см на плане — это 50 см в комнате.</p>',
  examples: [

    {t:'Раздели 60 ₽ между Аней и Борей в отношении 2 : 3.', s:'Всего частей: 2 + 3 = 5. Одна часть: 60 : 5 = 12 ₽. Аня получит 2 · 12 = 24 ₽, Боря — 3 · 12 = 36 ₽. Проверка: 24 + 36 = 60.'},
    {t:'Найди x в пропорциях: а) 3 : 4 = x : 12; б) 5 : x = 15 : 21.', s:'а) x — средний член: x = 3 · 12 : 4 = 36 : 4 = 9. б) x тоже средний: 5 · 21 = x · 15, отсюда x = 105 : 15 = 7. Проверка: 5 : 7 и 15 : 21 — сократим второе на 3, получим 5 : 7.'},

CONTENT.coord = {
  goal: 'После этой темы ты сможешь находить и отмечать точки на координатной плоскости, определять четверть по знакам координат, считать расстояния, строить симметричные точки и находить площадь и периметр прямоугольника по координатам его вершин.',
  explain: '<p>На числовой прямой положение точки задаёт одно число. Чтобы указать место на листе, на карте или на экране, одного числа мало: нужны два. Так появилась координатная плоскость — «клетчатая карта», где у каждой точки есть свой «адрес».</p>'
  + '<h3>Оси и координаты точки</h3>'
  + '<p>Проведём две числовые прямые, перпендикулярные друг другу. Горизонтальная называется <b>осью Ox</b> (осью абсцисс), вертикальная — <b>осью Oy</b> (осью ординат). Точка их пересечения — <b>начало координат</b>, она обозначается буквой O и имеет координаты (0; 0). На обеих осях выбрана одна и та же единица длины, а отрицательные числа лежат левее и ниже начала координат — так же, как на числовой прямой.</p>'
  + '<p>Координаты точки записывают в скобках через точку с запятой: A(x; y). Первое число x — <b>абсцисса</b> — показывает, на сколько шагов идти по горизонтали (вправо, если x положительное, влево, если отрицательное). Второе число y — <b>ордината</b> — показывает шаги по вертикали (вверх или вниз). Чтобы отметить точку A(3; −2): от начала координат иди на 3 вправо, потом на 2 вниз.</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Путают порядок координат. Точки (3; 2) и (2; 3) — разные! Всегда сначала абсцисса (по горизонтали), потом ордината (по вертикали). Запомни: «сначала входишь в подъезд по Ox, потом поднимаешься на этаж по Oy».</div>'
  + '<h3>Четверти и знаки координат</h3>'
  + '<p>Оси делят плоскость на четыре части — <b>четверти</b>. Их нумеруют против часовой стрелки, начиная с правой верхней. Знаки координат в каждой четверти свои.</p>'
  + '<div class="figure">__SVG_COORD6_QUADRANTS__</div>'
  + '<ul><li>I четверть: x &gt; 0, y &gt; 0, например (3; 2).</li>'
  + '<li>II четверть: x &lt; 0, y &gt; 0, например (−2; 3).</li>'
  + '<li>III четверть: x &lt; 0, y &lt; 0, например (−4; −2).</li>'
  + '<li>IV четверть: x &gt; 0, y &lt; 0, например (2; −3).</li></ul>'
  + '<p>Точки на осях не принадлежат ни одной четверти. У точки на оси Ox ордината равна 0: например, (5; 0) или (−4; 0). У точки на оси Oy равна 0 абсцисса: (0; 3) или (0; −6).</p>'
  + '<h3>Расстояние между точками на одной линии</h3>'
  + '<p>Если у двух точек одинаковые ординаты, они лежат на одной горизонтали, и расстояние между ними — это разность абсцисс (из большего вычитаем меньшее). Для A(−3; 2) и B(4; 2) получаем 4 − (−3) = 7. Если одинаковы абсциссы, точки лежат на одной вертикали, и мы вычитаем ординаты: для C(−1; −5) и D(−1; 3) расстояние 3 − (−5) = 8. Минус перед скобкой превращается в плюс — как в теме об отрицательных числах.</p>'
  + '<h3>Симметрия</h3>'
  + '<p>Две точки симметричны относительно оси, если ось — «зеркало»: точки лежат на одинаковом расстоянии от неё по разные стороны. Возьмём A(3; 2).</p>'
  + '<div class="figure">__SVG_COORD6_SYMMETRY__</div>'
  + '<div class="note"><span class="hand">Запомни</span>Относительно оси Oy у точки меняется знак абсциссы: (x; y) → (−x; y). Относительно оси Ox меняется знак ординаты: (x; y) → (x; −y). Относительно начала координат меняются оба знака: (x; y) → (−x; −y). Координата, знак которой не меняется, остаётся той же.</div>'
  + '<h3>Прямоугольник по координатам вершин</h3>'
  + '<p>Если стороны прямоугольника идут вдоль осей (то есть вдоль клеток), его размеры легко найти по координатам вершин. Возьмём A(−3; −2), B(2; −2), C(2; 2), D(−3; 2). Сторона AB горизонтальна: AB = 2 − (−3) = 5. Сторона BC вертикальна: BC = 2 − (−2) = 4. Тогда периметр P = 2 · (5 + 4) = 18, площадь S = 5 · 4 = 20.</p>'
  + '<div class="figure">__SVG_COORD6_RECT__</div>'
  + '<p>Для прямоугольника со сторонами вдоль осей достаточно знать две противоположные вершины: длина равна разности их абсцисс, ширина — разности ординат.</p>'
  + '<h3>Середина отрезка</h3>'
  + '<p>Середина отрезка находится на одинаковом расстоянии от его концов. Её координата — <b>полусумма</b> координат концов. На числовой прямой середина отрезка с концами −7 и 5 равна (−7 + 5) : 2 = −1. На плоскости для отрезка с концами (−3; 2) и (5; 2) абсцисса середины (−3 + 5) : 2 = 1, а ордината остаётся 2: середина — точка (1; 2). Для вертикального отрезка наоборот: абсцисса не меняется, а ордината — полусумма ординат.</p>',
  examples: [
    {t:'Как отметить точку A(3; −2)? В какой она четверти?', s:'Из начала координат идём на 3 клетки вправо (x = 3 > 0), затем на 2 клетки вниз (y = −2 < 0). Знаки (+; −) — это IV четверть.'},
    {t:'В какой четверти лежит точка (−5; 4)? Где лежит точка (0; −3)?', s:'У (−5; 4) абсцисса отрицательная, ордината положительная — II четверть. У (0; −3) абсцисса равна нулю, значит, точка лежит на оси Oy (на 3 клетки ниже начала координат), и ни в какой четверти её нет.'},
    {t:'Найди расстояние между A(−3; 2) и B(4; 2), а также между C(−1; −5) и D(−1; 3).', s:'У A и B одинаковые ординаты, поэтому вычитаем абсциссы: 4 − (−3) = 7. У C и D одинаковые абсциссы, вычитаем ординаты: 3 − (−5) = 8.'},
    {t:'Найди точки, симметричные P(−4; 5) относительно оси Ox, оси Oy и начала координат.', s:'Относительно Ox меняем знак ординаты: (−4; −5). Относительно Oy меняем знак абсциссы: (4; 5). Относительно начала координат меняем оба знака: (4; −5).'},
    {t:'Стороны прямоугольника ABCD идут вдоль осей. Вершины A(−2; −1) и C(4; 3) противоположные. Найди периметр и площадь.', s:'Длина: 4 − (−2) = 6. Ширина: 3 − (−1) = 4. Периметр 2 · (6 + 4) = 20. Площадь 6 · 4 = 24.'},
    {t:'Найди середину отрезка с концами (−3; 2) и (5; 2). Найди также середину отрезка с концами −7 и 5 на числовой прямой.', s:'Отрезок горизонтален, ордината остаётся 2. Абсцисса: (−3 + 5) : 2 = 1. Середина — точка (1; 2). На числовой прямой: (−7 + 5) : 2 = −2 : 2 = −1.'},
    {t:'Три вершины прямоугольника со сторонами вдоль осей: A(−3; 1), B(4; 1), C(4; −4). Найди четвёртую вершину D.', s:'A и B имеют ординату 1, C — ординату −4, значит, D тоже имеет ординату −4. Стороны AD и BC вертикальны, поэтому абсцисса D та же, что у A: −3. Итак, D(−3; −4). Стороны: AB = 4 − (−3) = 7, BC = 1 − (−4) = 5.'}

CONTENT.alg6 = {
  goal: 'После этой темы ты сможешь находить значения буквенных выражений, раскрывать скобки, приводить подобные слагаемые, решать уравнения (в том числе с десятичными и отрицательными числами) и составлять уравнение по условию задачи.',
  explain: '<p>Буква в математике — это «коробка для числа». Пока мы не знаем число или хотим написать правило сразу для всех чисел, вместо него ставим букву. Так короче и удобнее: вместо «периметр прямоугольника — это удвоенная сумма длины и ширины» пишем P = 2(a + b).</p>'
  + '<h3>Буквенное выражение и его значение</h3>'
  + '<p>Выражение с буквами называют <b>буквенным</b>. Знак умножения между числом и буквой не пишут: 5x означает 5 · x. Если тетрадь стоит n рублей, то 7 тетрадей стоят 7n рублей. Чтобы найти <b>значение выражения</b>, подставляем вместо буквы число и считаем по порядку действий. Пусть a = 3 и b = −2. Тогда 4a + 5b = 4 · 3 + 5 · (−2) = 12 − 10 = 2. Отрицательное число при подстановке всегда берём в скобки — так меньше ошибок со знаками.</p>'
  + '<h3>Распределительное свойство и раскрытие скобок</h3>'
  + '<p>Чтобы умножить число на сумму, можно умножить его на каждое слагаемое и сложить результаты: <b>a(b + c) = ab + ac</b>. Посмотри на прямоугольник: его общая площадь равна сумме площадей двух частей.</p>'
  + '<div class="figure">__SVG_ALG6_DISTRIB__</div>'
  + '<p>Для разности всё так же: 3(x − 4) = 3x − 12. Число снаружи умножается на КАЖДОЕ слагаемое в скобках, вместе с его знаком. А что, если перед скобкой стоит минус? Минус — это множитель −1, поэтому <b>все знаки внутри скобок меняются на противоположные</b>: −(a + b) = −a − b, а −(a − b) = −a + b. Например, −(3x − 7) = −3x + 7. А вот −2(x − 5) = −2x + 10, потому что (−2) · (−5) = +10.</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Умножают число только на первое слагаемое в скобках: пишут 3(x − 4) = 3x − 4. Правильно: 3x − 12. Вторая ошибка — забывают поменять знак у второго слагаемого после минуса: −(x − 7) — это −x + 7, а не −x − 7.</div>'
  + '<h3>Коэффициент и подобные слагаемые</h3>'
  + '<p>Числовой множитель в записи слагаемого называют <b>коэффициентом</b>. В слагаемом 7x коэффициент 7, в −4y коэффициент −4, а в слагаемом x он равен 1 (x = 1 · x), в слагаемом −x он равен −1. <b>Подобные слагаемые</b> — те, у которых одинаковая буквенная часть: 5x и 3x подобны, а 5x и 3y — нет. Чтобы привести подобные, складываем их коэффициенты, а буквенную часть оставляем: 5x + 3x = 8x, 2x − 6x = −4x.</p>'
  + '<div class="figure">__SVG_ALG6_LIKE__</div>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Складывают неподобное: 3x + 5 = 8x (нельзя: x и число — разные «сорта»). Или пишут x + x + x = x^3. На самом деле x + x + x = 3x, потому что мы считаем, сколько всего иксов.</div>'
  + '<h3>Уравнения</h3>'
  + '<p><b>Уравнение</b> — это равенство с неизвестным числом, которое надо найти. Число, при подстановке которого получается верное равенство, называют <b>корнем</b> уравнения. Уравнение — как весы в равновесии: если сделать с обеими чашами одно и то же (добавить, убрать, увеличить в несколько раз), равновесие сохранится. Отсюда два правила: <b>1)</b> любое слагаемое можно перенести в другую часть, поменяв знак; <b>2)</b> обе части можно разделить на число, не равное нулю (обычно на коэффициент при x).</p>'
  + '<div class="figure">__SVG_ALG6_BALANCE2__</div>'
  + '<p>Решим 3x + 5 = 20. Переносим 5 вправо: 3x = 20 − 5 = 15. Делим на 3: x = 5. Проверка: 3 · 5 + 5 = 20, верно. Если x есть в обеих частях, сначала собираем иксы слева, а числа справа: 5x − 7 = 2x + 11, значит 5x − 2x = 11 + 7, 3x = 18, x = 6. Уравнение вида a(x + b) = c можно решать двумя способами: поделить обе части на a (4(x + 3) = 32, x + 3 = 8, x = 5) или раскрыть скобки (4x + 12 = 32, 4x = 20, x = 5).</p>'
  + '<div class="note"><span class="hand">Запомни</span>Порядок такой: раскрыть скобки, привести подобные, собрать иксы в одной части, числа — в другой, поделить на коэффициент, сделать проверку. Коэффициент может быть отрицательным или десятичным: −3x = 12 даёт x = −4, а 0,5x = 3,5 даёт x = 3,5 : 0,5 = 7.</div>'
  + '<h3>Задача — через уравнение</h3>'
  + '<p>Алгоритм такой: <b>1)</b> обозначь буквой то, что надо найти (или то, через что легко выразить остальное); <b>2)</b> запиши остальные величины через эту букву; <b>3)</b> найди в условии два способа получить одно и то же число и приравняй их; <b>4)</b> реши уравнение; <b>5)</b> вернись к вопросу задачи и проверь ответ по условию. Пример: «В одной коробке x карандашей, в другой на 6 больше. Всего 40». Уравнение x + (x + 6) = 40, значит 2x + 6 = 40, 2x = 34, x = 17. В первой коробке 17, во второй 23.</p>',
  examples: [
    {t:'Найди значение выражения 3a + 2b − 5 при a = 4 и b = −1,5.', s:'Подставляем числа, отрицательное берём в скобки: 3 · 4 + 2 · (−1,5) − 5 = 12 − 3 − 5 = 4.'},
    {t:'Раскрой скобки: 4(x − 3) и −2(5 − x).', s:'4(x − 3) = 4x − 12 (умножили на оба слагаемых). −2(5 − x) = (−2) · 5 + (−2) · (−x) = −10 + 2x = 2x − 10.'},
    {t:'Упрости выражение −(3x − 7) + 2(x + 1).', s:'Первая скобка со знаком минус: −(3x − 7) = −3x + 7. Вторая: 2(x + 1) = 2x + 2. Складываем: −3x + 7 + 2x + 2 = (−3x + 2x) + (7 + 2) = −x + 9.'},
    {t:'Приведи подобные слагаемые: 5a + 3b − 2a + 4b − b.', s:'Слагаемые с a: 5a − 2a = 3a. Слагаемые с b: 3b + 4b − b = 6b (у −b коэффициент −1). Итого 3a + 6b.'},
    {t:'Реши уравнение 5x − 7 = 2x + 11.', s:'Переносим 2x влево, −7 вправо (со сменой знаков): 5x − 2x = 11 + 7. Тогда 3x = 18, x = 6. Проверка: слева 5 · 6 − 7 = 23, справа 2 · 6 + 11 = 23. Верно.'},
    {t:'Реши уравнение 4(x + 3) = 32 двумя способами.', s:'Способ 1: делим обе части на 4: x + 3 = 8, x = 5. Способ 2: раскрываем скобки: 4x + 12 = 32, 4x = 20, x = 5. Ответы совпали. Проверка: 4 · (5 + 3) = 32.'},
    {t:'Реши уравнение 0,6x + 1,4 = −1,6.', s:'Переносим 1,4: 0,6x = −1,6 − 1,4 = −3. Делим на 0,6: x = −3 : 0,6 = −30 : 6 = −5. Проверка: 0,6 · (−5) + 1,4 = −3 + 1,4 = −1,6.'},
    {t:'Задача. Три пачки печенья и коробка конфет стоят 260 рублей. Коробка конфет стоит 110 рублей. Сколько стоит пачка печенья?', s:'Пусть пачка стоит x рублей. Три пачки — 3x. Вместе с конфетами: 3x + 110 = 260. Тогда 3x = 150, x = 50. Пачка печенья стоит 50 рублей. Проверка: 3 · 50 + 110 = 260.'}

    {q:'Периметр прямоугольника со сторонами a и b находят по формуле P = 2(a + b). Найди P (в см), если a = 12 см, b = 8,5 см.', ans:'41', hint:'Сначала посчитай сумму в скобках.', sol:'P = 2 · (12 + 8,5) = 2 · 20,5 = 41 см.'},

    {q:'Найди коэффициент в произведении 4 · a · (−5) после упрощения (запиши его числом).', ans:'-20', hint:'Перемножь числа, а букву оставь.', sol:'4 · a · (−5) = (4 · (−5)) · a = −20a. Коэффициент равен −20.'},

CONTENT.circ6 = {
  goal: 'После этой темы ты сможешь называть части окружности и круга, находить длину окружности и площадь круга по радиусу или диаметру (принимая π = 3,14) и понимать, чем шар отличается от сферы.',
  explain: '<p>Колесо, монета, тарелка, циферблат, обруч — вокруг нас много круглых предметов. Сегодня разберёмся, из чего состоит окружность, как измерить её длину и как найти площадь круга.</p>'
  + '<h3>Окружность и круг</h3>'
  + '<p><b>Окружность</b> — это замкнутая линия, все точки которой находятся на одном и том же расстоянии от одной точки, называемой <b>центром</b>. Если ты нарисовал циркулем кружок, то ты нарисовал именно окружность — линию. А <b>круг</b> — это окружность вместе со всей областью внутри неё. Проще: окружность — это обруч, а круг — это блин. У окружности можно измерить длину (как у верёвки), у круга — площадь (сколько места он занимает).</p>'
  + '<div class="figure">__SVG_CIRC6_PARTS__</div>'
  + '<h3>Радиус, диаметр, хорда, дуга</h3>'
  + '<ul><li><b>Радиус</b> (r) — отрезок от центра до любой точки окружности. Все радиусы одной окружности равны.</li>'
  + '<li><b>Хорда</b> — отрезок, соединяющий две любые точки окружности.</li>'
  + '<li><b>Диаметр</b> (d) — хорда, проходящая через центр. Это самая длинная хорда.</li>'
  + '<li><b>Дуга</b> — часть окружности между двумя её точками.</li></ul>'
  + '<div class="note"><span class="hand">Запомни</span>Диаметр вдвое длиннее радиуса: <b>d = 2r</b>, а <b>r = d : 2</b>. Например, если радиус 7 см, то диаметр 14 см; если диаметр 9 см, то радиус 4,5 см.</div>'
  + '<h3>Длина окружности</h3>'
  + '<p>Возьми ниточку, обведи ею крышку от банки, выпрями и измерь. Потом измерь диаметр крышки. Ты увидишь, что нитка длиннее диаметра чуть больше, чем в три раза. Это верно для любой окружности: отношение длины окружности к её диаметру — одно и то же число. Его обозначают греческой буквой <b>π</b> («пи»). Оно равно 3,14159… (десятичная запись бесконечна), а в задачах мы берём <b>π ≈ 3,14</b>.</p>'
  + '<div class="figure">__SVG_CIRC6_UNROLL__</div>'
  + '<p>Значит, длина окружности <b>C = π · d</b>, а так как d = 2r, то <b>C = 2 · π · r</b>. Пример при π = 3,14: пусть r = 5 см. Тогда C = 2 · 3,14 · 5 = 6,28 · 5 = 31,4 см. Если известен диаметр d = 20 см, то сразу C = 3,14 · 20 = 62,8 см. Чтобы найти радиус по длине окружности, действуем обратно: r = C : (2 · 3,14). Для C = 18,84 получаем r = 18,84 : 6,28 = 3 см.</p>'
  + '<h3>Площадь круга</h3>'
  + '<p>Квадрат со стороной r имеет площадь r · r = r². Круг радиуса r по площади равен примерно трём таким квадратам и ещё маленькому «кусочку» (0,14 квадрата). Поэтому <b>S = π · r²</b>, где r² = r · r.</p>'
  + '<div class="figure">__SVG_CIRC6_AREA__</div>'
  + '<p>Пример при π = 3,14: r = 10 см, значит S = 3,14 · 10 · 10 = 314 см². Если дан диаметр d = 8 см, сначала находим радиус: r = 4 см, потом S = 3,14 · 4 · 4 = 3,14 · 16 = 50,24 см². Площадь измеряют в квадратных единицах (см², м²), а длину окружности — в обычных (см, м).</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>1) Путают радиус и диаметр: в формулы C = 2πr и S = πr² входит именно радиус. Если дан диаметр, сначала раздели его на 2. 2) Считают r² как 2 · r. Но r² = r · r: при r = 5 это 25, а не 10. 3) Пишут площадь в см вместо см².</div>'
  + '<p>Полезно знать, как размеры влияют друг на друга. Если увеличить радиус в 2 раза, то длина окружности тоже вырастет в 2 раза (C = 2πr), а вот площадь — в 2 · 2 = 4 раза (в формуле r умножается само на себя). Проверь: r = 1 даёт S = 3,14, а r = 2 даёт S = 3,14 · 4 = 12,56, то есть ровно в 4 раза больше.</p>'
  + '<h3>Шар и сфера</h3>'
  + '<p>В пространстве роль круга играет <b>шар</b>, а роль окружности — <b>сфера</b>. Сфера — это поверхность, как оболочка мыльного пузыря или резиновая плёнка мячика. Шар — это сфера вместе со всем, что внутри неё, как целый арбуз или апельсин. У шара и сферы есть центр, радиус и диаметр — они определяются так же, как у окружности: радиус — от центра до поверхности, диаметр — через центр от одной точки поверхности до противоположной, и снова d = 2r. Формулы для длины окружности пригодятся, если шар «разрезать по экватору»: сечение шара через центр — это круг того же радиуса.</p>',

/* ======================= УТИЛИТЫ ======================= */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(s){
  return String(s)
    .replace(/\{([^{}|]+)\|([^{}|]+)\}/g,'<span class="fr"><span class="n">$1</span><span class="d">$2</span></span>')
    .replace(/\^(\w+)/g,'<sup>$1</sup>');
}
function plain(s){
  return String(s).replace(/(\d)\{([^{}|]+)\|([^{}|]+)\}/g,'$1 $2/$3').replace(/\{([^{}|]+)\|([^{}|]+)\}/g,'($1/$2)');
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t}return a}
function parseAns(raw){
  var s=String(raw==null?'':raw).trim().toLowerCase().replace(/,/g,'.').replace(/[−–—]/g,'-');
  s=s.replace(/^[a-zа-я]\s*=\s*/,'');
  s=s.replace(/[\sa-zа-яё%°²³]+$/,'');
  var m;
  // смешанное число: целая часть (может содержать пробелы-разделители разрядов) + пробел + дробь — пробел перед дробью значим
  if((m=s.match(/^(-?)(\d[\d\s ]*\d|\d)\s+(\d+)\/(\d+)$/))){
    var whole=+m[2].replace(/[\s ]/g,'');
    var d=+m[4]; if(!d) return null;
    var n=whole*d+(+m[3]); if(m[1]) n=-n;
    return {val:n/d,num:n,den:d};
  }
  if((m=s.match(/^(-?\d+)\/(\d+)$/))){
    var d2=+m[2]; if(!d2) return null;
    return {val:(+m[1])/d2,num:+m[1],den:d2};
  }
  // "450 000" -> "450000": пробелы-разделители разрядов в обычном числе не считаются ошибкой
  var s2=s.replace(/(\d)[\s ]+(?=\d)/g,'$1');
  if(/^-?\d+(\.\d+)?$/.test(s2)) return {val:parseFloat(s2)};
  return null;
}
function gradeNum(item,raw){
  var p=parseAns(raw); if(!p) return false;
  var t=parseAns(item.ans);
  if(Math.abs(p.val-t.val)>1e-9) return false;
  if(item.reduced && p.den && p.den!==1 && gcd(p.num,p.den)!==1) return false;
  return true;
}
function ruDate(ts){
  try{return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}
}
function pct(a,b){return b?Math.round(a/b*100):0}
function okBadge(){return '<span class="okbadge" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 10.5 L8 14.5 L16 5.5"/></svg></span>';}

/* Библиотека учебных SVG-схем. Все цвета берутся из CSS custom properties через currentColor/var(),
   чтобы схемы одинаково хорошо смотрелись в светлой и тёмной теме. */
var SVG_LIB = {};

SVG_LIB.NUMLINE = function(){
  var W=520,H=120,y=60,x0=40,x1=480,step=(x1-x0)/12; // -6..+6
  var ticks='';
  for(var i=-6;i<=6;i++){
    var x=x0+(i+6)*step;
    var big = (i%2===0);
    ticks += '<line x1="'+x+'" y1="'+(y-(big?9:5))+'" x2="'+x+'" y2="'+(y+(big?9:5))+'" stroke="var(--ink)" stroke-width="1.5"/>';
    if(big) ticks += '<text x="'+x+'" y="'+(y+26)+'" font-size="15" text-anchor="middle" fill="var(--muted)">'+i+'</text>';
  }
  var mA=x0+(-3+6)*step, mB=x0+(2+6)*step;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:480px;display:block;margin:0 auto" role="img" aria-label="Числовая прямая от минус 6 до 6">'
    +'<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--ink)" stroke-width="2" marker-end="url(#nl-arrow)"/>'
    +'<defs><marker id="nl-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--ink)"/></marker></defs>'
    +ticks
    +'<circle cx="'+mA+'" cy="'+y+'" r="6" fill="var(--red)"/><text x="'+mA+'" y="'+(y-16)+'" font-size="14" text-anchor="middle" fill="var(--red)" font-weight="700">−3</text>'
    +'<circle cx="'+mB+'" cy="'+y+'" r="6" fill="var(--blue)"/><text x="'+mB+'" y="'+(y-16)+'" font-size="14" text-anchor="middle" fill="var(--blue)" font-weight="700">2</text>'
    +'</svg>';
};

function AH(x,y,dx,dy,color,sz){
  var d=unit(dx,dy), nx=-d[1], ny=d[0], bx=x-d[0]*sz, by=y-d[1]*sz, w=sz*0.5;
  return '<polygon points="'+x+','+y+' '+(bx+nx*w)+','+(by+ny*w)+' '+(bx-nx*w)+','+(by-ny*w)+'" fill="'+color+'" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round"/>';
}
function AL(x1,y1,x2,y2,color,sw,sz,both){
  var d=unit(x2-x1,y2-y1), e=sz*0.7;
  var a1=both?[x1+d[0]*e,y1+d[1]*e]:[x1,y1];
  return L(a1[0],a1[1],x2-d[0]*e,y2-d[1]*e,color,sw)+AH(x2,y2,d[0],d[1],color,sz)+(both?AH(x1,y1,-d[0],-d[1],color,sz):'');
}

(function(){

    +(o.extra||'')+'>'+s+'</text>';
}

  return '<line x1="'+F(x1)+'" y1="'+F(y1)+'" x2="'+F(x2)+'" y2="'+F(y2)+'" stroke="'+col+'" stroke-width="'+(w||2)+'" stroke-linecap="round"'+(extra||'')+'/>';
}
function R(x,y,w,h,fill,stroke,o){
  o = o || {};
  return '<rect x="'+F(x)+'" y="'+F(y)+'" width="'+F(w)+'" height="'+F(h)+'" rx="'+(o.rx===undefined?4:o.rx)+'" fill="'+fill+'"'
    +(stroke?' stroke="'+stroke+'" stroke-width="'+(o.sw||2)+'"':'')+(o.extra||'')+'/>';
}
function C(x,y,r,fill,stroke,w,extra){
  return '<circle cx="'+F(x)+'" cy="'+F(y)+'" r="'+r+'" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="'+(w||2)+'"':'')+(extra||'')+'/>';
}
function P(d,fill,stroke,w,extra){
  return '<path d="'+d+'" fill="'+(fill||'none')+'"'+(stroke?' stroke="'+stroke+'" stroke-width="'+(w||2)+'" stroke-linejoin="round" stroke-linecap="round"':'')+(extra||'')+'/>';
}
function SVG(W,H,mw,label,defs,body){
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+mw+'px;display:block;margin:0 auto" role="img" aria-label="'+label+'">'
    +(defs?'<defs>'+defs+'</defs>':'')+body+'</svg>';

function ARROWDEF(id,col){

/* текст со степенями: строки и пары [основание, показатель] */
function M(){
  var out='', pend=false;

    var a=arguments[i];
    var s = (typeof a==='string') ? a : a[0];
    out += pend ? '<tspan dy="7">'+s+'</tspan>' : s;
    pend=false;
    if(typeof a!=='string'){ out += '<tspan dy="-7" font-size="13">'+a[1]+'</tspan>'; pend=true; }
  }
  if(pend) out += '<tspan dy="7"> </tspan>';

}
/* геометрия: математические углы (против часовой), y экрана вниз */
function PT(cx,cy,r,a){ return [cx+r*Math.cos(a*RAD), cy-r*Math.sin(a*RAD)]; }

  return 'M'+F(p[0])+','+F(p[1])+' A'+r+','+r+' 0 '+((a1-a0)>180?1:0)+' 0 '+F(q[0])+','+F(q[1]);

function secD(cx,cy,r,a0,a1){
  var p=PT(cx,cy,r,a0), q=PT(cx,cy,r,a1);
  return 'M'+F(cx)+','+F(cy)+' L'+F(p[0])+','+F(p[1])+' A'+r+','+r+' 0 '+((a1-a0)>180?1:0)+' 0 '+F(q[0])+','+F(q[1])+' Z';

function plane(o){

  out += L(ox,Yc(o.ymin-ey),ox,Yc(o.ymax+0.45),'var(--ink)',2,' marker-end="url(#'+o.id+'_ah)"');

  }

/* ============ POLY_TILES ============ */
SVG_LIB.POLY_TILES = function(){
  var W=480,H=330,x0=64,y0=62,X=120,u=16; // x = 120, единица = 16
  var w2=5*u, h2=2*u, b='';
  b += T(x0+X/2,50,'x',{size:16,w:700,fill:'var(--blue)',extra:' font-style="italic"'});
  b += T(x0+X+w2/2,50,'5',{size:16,w:700,fill:'var(--gold)'});
  b += T(x0-14,y0+X/2+5,'x',{size:16,w:700,fill:'var(--blue)',a:'end',extra:' font-style="italic"'});
  b += T(x0-14,y0+X+h2/2+5,'2',{size:16,w:700,fill:'var(--red)',a:'end'});
  // плитки
  b += R(x0,y0,X,X,'var(--blue-soft)','var(--blue)',{rx:6});
  b += R(x0+X,y0,w2,X,'var(--gold-soft)','var(--gold)',{rx:6});
  b += R(x0,y0+X,X,h2,'var(--red-soft)','var(--red)',{rx:6});
  b += R(x0+X,y0+X,w2,h2,'var(--green-soft)','var(--green)',{rx:6});
  b += T(x0+X/2,y0+X/2+4,M(['x','2']),{size:22,w:700,fill:'var(--blue)'});
  b += T(x0+X+w2/2,y0+X/2+6,'5x',{size:20,w:700,fill:'var(--gold)'});
  b += T(x0+X/2,y0+X+h2/2+6,'2x',{size:17,w:700,fill:'var(--red)'});
  b += T(x0+X+w2/2,y0+X+h2/2+6,'10',{size:17,w:700,fill:'var(--green)'});
  // общие размеры
  var tw=X+w2, th=X+h2;
  b += P('M'+x0+','+(y0+th+12)+' v7 H'+(x0+tw)+' v-7','none','var(--muted)',2);
  b += T(x0+tw/2,y0+th+38,'x + 5',{size:16,w:700});
  b += P('M'+(x0-40)+','+y0+' h-7 V'+(y0+th)+' h7','none','var(--muted)',2);
  b += T(x0-56,y0+th/2,'x + 2',{size:16,w:700,extra:' transform="rotate(-90 '+(x0-56)+' '+(y0+th/2)+')" dy="5"'});
  // правая колонка — площади
  var rx=310;
  b += T(rx,y0+8,'Площади частей',{size:15,w:700,fill:'var(--muted)',a:'start'});
  var rows=[['var(--blue)',M('x · x = ',['x','2'])],['var(--gold)','x · 5 = 5x'],['var(--red)','2 · x = 2x'],['var(--green)','2 · 5 = 10']];
  for(var i=0;i<4;i++){
    b += R(rx,y0+26+i*34,16,16,rows[i][0]==='var(--blue)'?'var(--blue-soft)':rows[i][0]==='var(--gold)'?'var(--gold-soft)':rows[i][0]==='var(--red)'?'var(--red-soft)':'var(--green-soft)',rows[i][0],{rx:4,sw:2});
    b += T(rx+26,y0+40+i*34,rows[i][1],{size:16,w:600,fill:rows[i][0],a:'start'});
  }
  // итог
  b += T(W/2,y0+th+78,'(x + 2)(x + 5) = '+'<tspan fill="var(--blue)">'+M(['x','2'])+'</tspan> + <tspan fill="var(--gold)">5x</tspan> + <tspan fill="var(--red)">2x</tspan> + <tspan fill="var(--green)">10</tspan>',{size:18,w:700});
  b += T(W/2,y0+th+106,'= '+M(['x','2'],' + 7x + 10'),{size:18,w:700});
  return SVG(W,y0+th+122,480,'Алгебраические плитки: прямоугольник со сторонами x + 2 и x + 5 разбит на части x², 5x, 2x и 10, вместе x² + 7x + 10','',b);
};

/* ============ FSU_SQUARE ============ */
SVG_LIB.FSU_SQUARE = function(){
  var W=380,a=120,bb=80,x0=110,y0=66,b='';
  var tot=a+bb;
  // размеры сверху
  b += T(x0+tot/2,18,'a + b',{size:16,w:700});
  b += P('M'+x0+',30 v-6 H'+(x0+tot)+' v6','none','var(--muted)',2);
  b += T(x0+a/2,54,'a',{size:16,w:700,fill:'var(--blue)',extra:' font-style="italic"'});
  b += T(x0+a+bb/2,54,'b',{size:16,w:700,fill:'var(--green)',extra:' font-style="italic"'});
  b += P('M'+(x0-36)+','+y0+' h-6 V'+(y0+tot)+' h6','none','var(--muted)',2);
  b += T(x0-56,y0+tot/2,'a + b',{size:16,w:700,extra:' transform="rotate(-90 '+(x0-56)+' '+(y0+tot/2)+')" dy="5"'});
  b += T(x0-12,y0+a/2+5,'a',{size:16,w:700,fill:'var(--blue)',a:'end',extra:' font-style="italic"'});
  b += T(x0-12,y0+a+bb/2+5,'b',{size:16,w:700,fill:'var(--green)',a:'end',extra:' font-style="italic"'});
  // части
  b += R(x0,y0,a,a,'var(--blue-soft)','var(--blue)',{rx:6});
  b += R(x0+a,y0,bb,a,'var(--gold-soft)','var(--gold)',{rx:6});
  b += R(x0,y0+a,a,bb,'var(--gold-soft)','var(--gold)',{rx:6});
  b += R(x0+a,y0+a,bb,bb,'var(--green-soft)','var(--green)',{rx:6});
  b += T(x0+a/2,y0+a/2,M(['a','2']),{size:22,w:700,fill:'var(--blue)'});
  b += T(x0+a/2,y0+a/2+24,'= 9',{size:15,w:600,fill:'var(--blue)'});
  b += T(x0+a+bb/2,y0+a/2+4,'ab',{size:20,w:700,fill:'var(--gold)'});
  b += T(x0+a+bb/2,y0+a/2+24,'= 6',{size:15,w:600,fill:'var(--gold)'});
  b += T(x0+a/2,y0+a+bb/2+4,'ab',{size:20,w:700,fill:'var(--gold)'});
  b += T(x0+a/2,y0+a+bb/2+24,'= 6',{size:15,w:600,fill:'var(--gold)'});
  b += T(x0+a+bb/2,y0+a+bb/2,M(['b','2']),{size:22,w:700,fill:'var(--green)'});
  b += T(x0+a+bb/2,y0+a+bb/2+22,'= 4',{size:15,w:600,fill:'var(--green)'});
  var yy=y0+tot+40;
  b += T(W/2,yy,M(['(a + b)','2'],' = ')+'<tspan fill="var(--blue)">'+M(['a','2'])+'</tspan> + <tspan fill="var(--gold)">2ab</tspan> + <tspan fill="var(--green)">'+M(['b','2'])+'</tspan>',{size:19,w:700});
  b += T(W/2,yy+30,'при a = 3, b = 2:',{size:14,fill:'var(--muted)'});
  b += T(W/2,yy+58,M(['(3 + 2)','2'],' = 25 = ')+'<tspan fill="var(--blue)">9</tspan> + <tspan fill="var(--gold)">12</tspan> + <tspan fill="var(--green)">4</tspan> ✓',{size:18,w:700});
  return SVG(W,yy+74,400,'Квадрат со стороной a плюс b разбит на части a в квадрате, два раза ab и b в квадрате; при a равном 3 и b равном 2 получаем 25 равно 9 плюс 12 плюс 4','',b);
};

/* ============ FSU_DIFF ============ */
SVG_LIB.FSU_DIFF = function(){
  var W=420,u=22,a=5*u,bb=3*u,d=a-bb,s=a+bb,b='';
  var x0=90,y0=52;
  var defs=ARROWDEF('fsu_diff_ah','var(--muted)');
  // левая фигура
  b += T(x0+a/2,y0-18,'a',{size:16,w:700,extra:' font-style="italic"'});
  b += P('M'+x0+','+(y0-10)+' v-5 H'+(x0+a)+' v5','none','var(--muted)',1.5);
  b += T(x0-12,y0+a/2+5,'a',{size:16,w:700,a:'end',extra:' font-style="italic"'});
  b += R(x0+d,y0,bb,bb,'none','var(--muted)',{rx:4,sw:2,extra:' stroke-dasharray="5 4"'});
  b += T(x0+d+bb/2,y0+bb/2+2,M(['b','2']),{size:18,w:700,fill:'var(--muted)'});
  b += R(x0,y0+bb,a,d,'var(--blue-soft)','var(--ink)',{rx:3});
  b += R(x0,y0,d,bb,'var(--green-soft)','var(--ink)',{rx:3});
  b += T(x0+a/2,y0+bb+d/2+6,'1',{size:17,w:700,fill:'var(--blue)'});
  b += T(x0+d/2,y0+bb/2+6,'2',{size:17,w:700,fill:'var(--green)'});
  // размеры справа
  b += P('M'+(x0+a+10)+','+y0+' h5 V'+(y0+bb)+' h-5','none','var(--muted)',1.5);
  b += T(x0+a+24,y0+bb/2+5,'b',{size:15,w:700,a:'start',extra:' font-style="italic"'});
  b += P('M'+(x0+a+10)+','+(y0+bb)+' h5 V'+(y0+a)+' h-5','none','var(--muted)',1.5);
  b += T(x0+a+24,y0+bb+d/2+5,'a − b',{size:15,w:700,a:'start'});
  // пояснение справа
  var tx=x0+a+84;
  b += T(tx,y0+30,'вырезали',{size:15,w:600,fill:'var(--muted)',a:'start'});
  b += T(tx,y0+50,'угол b × b',{size:15,w:600,fill:'var(--muted)',a:'start'});
  b += T(tx,y0+84,'осталось',{size:15,w:600,a:'start'});
  b += T(tx,y0+106,M(['a','2'],' − ',['b','2']),{size:17,w:700,a:'start'});
  // стрелка
  var ay0=y0+a+14, ay1=y0+a+50;
  b += L(x0+a/2,ay0,x0+a/2,ay1,'var(--muted)',2.5,' marker-end="url(#fsu_diff_ah)"');
  b += T(x0+a/2+14,(ay0+ay1)/2+5,'часть 2 переложили',{size:14,fill:'var(--muted)',a:'start'});
  // прямоугольник (a+b) x (a-b)
  var rx=(W-s)/2, ry=ay1+42;
  b += P('M'+rx+','+(ry-10)+' v-5 H'+(rx+s)+' v5','none','var(--muted)',1.5);
  b += T(rx+s/2,ry-22,'a + b',{size:16,w:700});
  b += R(rx,ry,a,d,'var(--blue-soft)','var(--ink)',{rx:3});
  b += R(rx+a,ry,bb,d,'var(--green-soft)','var(--ink)',{rx:3});
  b += T(rx+a/2,ry+d/2+6,'1',{size:17,w:700,fill:'var(--blue)'});
  b += T(rx+a+bb/2,ry+d/2+6,'2',{size:17,w:700,fill:'var(--green)'});
  b += P('M'+(rx-10)+','+ry+' h-5 V'+(ry+d)+' h5','none','var(--muted)',1.5);
  b += T(rx-22,ry+d/2+5,'a − b',{size:15,w:700,a:'end'});
  b += T(rx+s/2,ry+d+30,'(a − b)(a + b)',{size:18,w:700});
  var yy=ry+d+82;
  b += T(W/2,yy,M(['a','2'],' − ',['b','2'],' = (a − b)(a + b)'),{size:21,w:700,fill:'var(--green)'});
  b += T(W/2,yy+28,'при a = 5, b = 3:',{size:14,fill:'var(--muted)'});
  b += T(W/2,yy+54,M(['5','2'],' − ',['3','2'],' = 25 − 9 = 16 = 2 · 8 ✓'),{size:17,w:700});
  return SVG(W,yy+70,420,'Разность квадратов: из квадрата a на a вырезан квадрат b на b, оставшаяся Г-образная фигура перекроена в прямоугольник a минус b на a плюс b; при a = 5 и b = 3 получаем 25 минус 9 равно 16 равно 2 умножить на 8',defs,b);
};

/* ============ FUNC_LINE ============ */
SVG_LIB.FUNC_LINE = function(){
  var W=360,s=28,ox=180,oy=170;
  var X=function(v){return ox+v*s;}, Y=function(v){return oy-v*s;};
  var defs=ARROWDEF('func_line_ah','var(--ink)');
  var b=plane({id:'func_line',ox:ox,oy:oy,s:s,xmin:-5,xmax:5,ymin:-5,ymax:5,skipY:[1]});
  // прямая y = 2x + 1 (от y = -5.3 до y = 5.3)
  b += L(X(-3.15),Y(-5.3),X(2.15),Y(5.3),'var(--blue)',3.5);
  // шаговый треугольник
  b += P('M'+X(0)+','+Y(1)+' L'+X(1)+','+Y(1)+' L'+X(1)+','+Y(3),'none','var(--green)',3.5);
  b += T(X(0.5),Y(1)+18,'1',{size:14,w:700,fill:'var(--green)',halo:'var(--sheet)'});
  b += T(X(1)+9,Y(2)+5,'2',{size:14,w:700,fill:'var(--green)',halo:'var(--sheet)',a:'start'});
  // точки
  b += C(X(0),Y(1),6,'var(--red)','var(--sheet)',2);
  b += C(X(2),Y(5),6,'var(--gold)','var(--sheet)',2);
  b += T(X(0)-18,Y(1)+5,'b = 1',{size:14,w:700,fill:'var(--red)',halo:'var(--sheet)',a:'end'});
  b += T(X(2)+11,Y(5)+5,'(2; 5)',{size:14,w:700,fill:'var(--gold)',halo:'var(--sheet)',a:'start'});
  b += T(X(-1.85),Y(-1.9),'y = 2x + 1',{size:15,w:700,fill:'var(--blue)',halo:'var(--sheet)',a:'end'});
  // пояснения
  var y=oy+5.6*s+34;
  b += T(W/2,y,'y = kx + b:  y = 2x + 1',{size:18,w:700,fill:'var(--blue)'});
  b += T(W/2,y+28,'k = 2: вправо на 1 → вверх на 2',{size:15,w:600,fill:'var(--green)'});
  b += T(W/2,y+54,'b = 1: точка (0; 1) на оси Oy',{size:15,w:600,fill:'var(--red)'});
  b += T(W/2,y+80,'x = 2: y = 2 · 2 + 1 = 5, точка (2; 5)',{size:15,w:600,fill:'var(--gold)'});
  return SVG(W,y+98,360,'График функции y = 2x + 1: прямая проходит через точку (0; 1) на оси Oy, при шаге вправо на 1 поднимается на 2, проходит через точку (2; 5)',defs,b);
};

/* ============ FUNC_SLOPES ============ */
SVG_LIB.FUNC_SLOPES = function(){
  var W=360,s=30,ox=180,oy=150;
  var X=function(v){return ox+v*s;}, Y=function(v){return oy-v*s;};
  var defs=ARROWDEF('func_slopes_ah','var(--ink)');
  var b=plane({id:'func_slopes',ox:ox,oy:oy,s:s,xmin:-4,xmax:4,ymin:-4,ymax:4});
  b += L(X(-4.5),Y(2),X(4.5),Y(2),'var(--green)',3.5);
  b += L(X(-1.6),Y(4.6),X(4.6),Y(-1.6),'var(--red)',3.5);
  b += L(X(-2.3),Y(-4.6),X(2.3),Y(4.6),'var(--blue)',3.5);
  b += C(X(1),Y(2),4.5,'var(--sheet)','var(--ink)',2);
  b += T(X(2.45),Y(4.05),'y = 2x',{size:15,w:700,fill:'var(--blue)',halo:'var(--sheet)',a:'start'});
  b += T(X(4.5),Y(-2.25),'y = −x + 3',{size:15,w:700,fill:'var(--red)',halo:'var(--sheet)',a:'end'});
  b += T(X(-4.4),Y(2.4),'y = 2',{size:15,w:700,fill:'var(--green)',halo:'var(--sheet)',a:'start'});
  var y=oy+4.6*s+36;
  var rows=[['var(--blue)','y = 2x','k = 2 > 0 — растёт'],['var(--red)','y = −x + 3','k = −1 < 0 — убывает'],['var(--green)','y = 2','k = 0 — горизонталь']];
  for(var i=0;i<3;i++){
    var yy=y+i*30;
    b += L(30,yy-5,62,yy-5,rows[i][0],4);
    b += T(74,yy,rows[i][1],{size:15,w:700,fill:rows[i][0],a:'start'});
    b += T(170,yy,rows[i][2],{size:15,w:600,fill:'var(--ink)',a:'start'});
  }
  return SVG(W,y+82,360,'Три прямые: y = 2x растёт, y = −x + 3 убывает, y = 2 горизонтальна',defs,b);
};

/* ============ SYS_GRAPH ============ */

  b += T(X(5),Y(5.05)-10,'x = 5, y = 3',{size:15,w:700,fill:'var(--green)'});

  return SVG(W,yy+20,440,'Графическое решение системы x + y = 8 и x − y = 2: две прямые пересекаются в точке (5; 3), значит x = 5, y = 3',defs,b);
};

/* ============ ANG_ADJ ============ */
SVG_LIB.ANG_ADJ = function(){
  var W=440,Ox=220,Oy=185,len=160,b='';
  var t=65;
  var tip=PT(Ox,Oy,len,t);
  var rr=112;
  b += P(secD(Ox,Oy,rr,0,t),'var(--blue-soft)');
  b += P(secD(Ox,Oy,rr,t,180),'var(--red-soft)');
  b += L(20,Oy,420,Oy,'var(--ink)',3);
  b += L(Ox,Oy,tip[0],tip[1],'var(--ink)',3);
  b += P(arcD(Ox,Oy,40,0,t),'none','var(--blue)',3.5);
  b += P(arcD(Ox,Oy,40,t,180),'none','var(--red)',3.5);
  var l1=PT(Ox,Oy,82,t/2), l2=PT(Ox,Oy,82,(t+180)/2);
  b += T(l1[0]+4,l1[1]+5,'∠1 = 65°',{size:15,w:700,fill:'var(--blue)'});
  b += T(l2[0],l2[1]+5,'∠2 = 115°',{size:15,w:700,fill:'var(--red)'});
  // развёрнутый угол
  b += P('M'+(Ox-52)+','+Oy+' A52,52 0 0 0 '+(Ox+52)+','+Oy,'none','var(--gold)',2.5,' stroke-dasharray="6 5"');
  b += T(Ox,Oy+70,'180° — развёрнутый угол',{size:14,fill:'var(--gold)',w:600});
  b += C(Ox,Oy,5,'var(--ink)');
  b += T(Ox+13,Oy+20,'O',{size:15,w:700});
  b += T(28,Oy+22,'A',{size:15,w:700});
  b += T(412,Oy+22,'B',{size:15,w:700});
  b += T(tip[0]+12,tip[1]+4,'C',{size:15,w:700,a:'start'});
  b += T(W/2,Oy+112,'<tspan fill="var(--blue)">∠1</tspan> + <tspan fill="var(--red)">∠2</tspan> = 180°',{size:21,w:700});
  b += T(W/2,Oy+140,'<tspan fill="var(--blue)">65°</tspan> + <tspan fill="var(--red)">115°</tspan> = 180°',{size:16,w:600,fill:'var(--muted)'});
  return SVG(W,Oy+158,440,'Смежные углы: луч OC делит развёрнутый угол на угол 1, равный 65 градусам, и угол 2, равный 115 градусам; их сумма 180 градусов','',b);
};

/* ============ ANG_CROSS ============ */
SVG_LIB.ANG_CROSS = function(){
  var W=440,Ox=220,Oy=140,th=24,b='';
  var rr=118;
  var secs=[[-th,th,'var(--blue)','var(--blue-soft)','∠1 = 48°',97],[th,180-th,'var(--red)','var(--red-soft)','∠2 = 132°',72],
            [180-th,180+th,'var(--blue)','var(--blue-soft)','∠3 = 48°',97],[180+th,360-th,'var(--red)','var(--red-soft)','∠4 = 132°',72]];
  var i;
  for(i=0;i<4;i++){ b += P(secD(Ox,Oy,rr,secs[i][0],secs[i][1]),secs[i][3]); }
  var e1=PT(Ox,Oy,150,th), e2=PT(Ox,Oy,150,180+th), e3=PT(Ox,Oy,150,-th), e4=PT(Ox,Oy,150,180-th);

/* ============ TRI_SIGNS ============ */
SVG_LIB.TRI_SIGNS = function(){
  var W=450,b='';

    var o=P('M'+pts[0]+' L'+pts[1]+' L'+pts[2]+' Z',fill,'var(--ink)',2.2), i;
    (mk.sides||[]).forEach(function(sd){
      var p=pts[sd[0]], q=pts[(sd[0]+1)%3], c=COL[sd[1]];

    });
    (mk.angs||[]).forEach(function(an){
      var v=pts[an[0]], n1=pts[(an[0]+1)%3], n2=pts[(an[0]+2)%3];
      var ab=between(dirA(v,n1),dirA(v,n2));

    });

  }
  function T1(base,dx,dy,sx,sy,rot){ // положение точки: масштаб/зеркало/поворот вокруг центра

  var shapes=[

  var marks=[

    {sides:[[0,'b',1],[1,'r',2],[2,'g',3]]}
  ];
  var titles=['I признак','II признак','III признак'];
  var subs=[['две стороны и угол','между ними'],['сторона и два','прилежащих угла'],['три стороны','']];
  var xs=[75,225,375];
  for(var i=0;i<3;i++){

};

/* Сервер (Cloudflare Pages Functions + D1) необязателен: если /api/me не отвечает JSON-ом,
   приложение работает как раньше — с localStorage или базой claude.ai. */
var CLOUD = {pending:true, on:false, support:false, me:null, err:''};
var LS_FAMILY = 'mvk-family-v1';
async function cloudInit(){
  try{
    var q=new URLSearchParams(location.search), le=q.get('login_error');
    if(le){ CLOUD.err=le; try{history.replaceState(null,'',location.pathname)}catch(e){} }
  }catch(e){}
  try{
    if(location.protocol==='http:'||location.protocol==='https:'){
      var ctl=new AbortController(), to=setTimeout(function(){ctl.abort()},4000);
      var r=await fetch('/api/me',{credentials:'same-origin',signal:ctl.signal}); clearTimeout(to);
      if(/json/.test(r.headers.get('content-type')||'')){
        var j=await r.json();
        if(r.ok&&j.ok){ CLOUD.on=true; CLOUD.support=true; CLOUD.me=j; }
        else if(j.configured){ CLOUD.support=true; if(j.google){ CLOUD.on=true; CLOUD.me=null; } if(j.disabled) CLOUD.err='disabled'; }
      }
    }
  }catch(e){}
  if(CLOUD.on && CLOUD.me) cloudAdoptFamily();
  CLOUD.pending=false;
}
/* Кэш на устройстве не должен «перетекать» между семьями */
function cloudAdoptFamily(){
  if(!CLOUD.me.familyId) return; // ещё не в семье (новый пользователь)
  var prev=null; try{prev=localStorage.getItem(LS_FAMILY)}catch(e){}
  if(prev && prev!==CLOUD.me.familyId){
    try{ Object.keys(localStorage).filter(function(k){return k.indexOf('mvk-')===0}).forEach(function(k){localStorage.removeItem(k)}); }catch(e){}
    try{ sessionStorage.removeItem('mvk-parentok-v1') }catch(e){}
    KIDS=[]; activeKid=null; PARENT_PASS=''; parentUnlocked=false; S=normalize(null);
  }
  try{localStorage.setItem(LS_FAMILY,CLOUD.me.familyId)}catch(e){}
}
function cloudExpired(){
  if(!CLOUD.me) return;
  CLOUD.me=null; activeKid=null; view={name:'landing'}; render();
}
async function cloudLogout(){
  try{ await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}); }catch(e){}
  try{ Object.keys(localStorage).filter(function(k){return k.indexOf('mvk-')===0}).forEach(function(k){localStorage.removeItem(k)}); sessionStorage.removeItem('mvk-parentok-v1'); }catch(e){}
  location.href=location.pathname;
}
/* Окно выбора почты Google открывается отдельным окошком в левом нижнем углу экрана,
   размером не больше 30% ширины и высоты экрана. */
var GLOGIN_NAME='mvk_google_login';
function openGoogleLogin(){
  try{
    var scr=window.screen||{};
    var aw=scr.availWidth||scr.width||1024;
    var ah=scr.availHeight||scr.height||768;
    var w=Math.max(1,Math.round(aw*0.3));
    var h=Math.max(1,Math.round(ah*0.3));
    var left=scr.availLeft||0;
    var top=(scr.availTop||0)+Math.max(0,ah-h);
    var feats='width='+w+',height='+h+',left='+left+',top='+top+',menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes';
    var win=window.open('/api/auth/google',GLOGIN_NAME,feats);
    if(!win){ location.href='/api/auth/google'; return; }
    try{win.focus()}catch(e){}
    var iv=setInterval(function(){
      var closed=true; try{closed=win.closed}catch(e){closed=true}
      if(closed){ clearInterval(iv); cloudInit().then(function(){render()}); }
    },400);
  }catch(e){ location.href='/api/auth/google'; }
}
/* Если это и есть то самое окошко входа (открыто из openGoogleLogin) и вход завершён —
   передаём результат в основное окно и закрываемся, а не показываем всё приложение внутри окошка. */
function popupSelfClose(){
  try{
    if(window.name===GLOGIN_NAME && window.opener && !window.opener.closed){
      var target=window.opener;
      try{ target.location.href=location.href; }catch(e){}
      try{ target.focus(); }catch(e){}
      setTimeout(function(){ try{window.close()}catch(e){} },50);
      return true;
    }
  }catch(e){}
  return false;
}
/* Адаптер с тем же интерфейсом, что и у window.claude db: doc(path).get/set/onSnapshot */
function makeCloudDb(){
  function api(method,path,body){
    return fetch('/api/doc?path='+encodeURIComponent(path),{method:method,credentials:'same-origin',
      headers:body!==undefined?{'content-type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined})
    .then(function(r){
      if(r.status===401){ cloudExpired(); throw new Error('401'); }
      return r.json().then(function(j){ if(!j.ok) throw new Error(j.error||'error'); return j; });
    });
  }
  function snap(j){ return {exists:!!j.exists,data:function(){return j.data}}; }
  return {doc:function(path){ return {
    get:function(){ return api('GET',path).then(snap); },
    set:function(data){ return api('PUT',path,data); },
    onSnapshot:function(cb,err){
      var stop=false,last=null,t=null;
      function tick(){
        if(stop) return;
        if(document.hidden){ t=setTimeout(tick,4000); return; }
        api('GET',path).then(function(j){ var s=JSON.stringify(j); if(s!==last){ last=s; cb(snap(j)); } },function(e){ if(err) err(e); })
          .then(function(){ if(!stop) t=setTimeout(tick,8000); });
      }
      tick();
      return function(){ stop=true; clearTimeout(t); };
    }
  }; }};
}

async function sendSupport(){
  var pin=SUP.kind==='pin', text=SUP.text.trim();
  if(!pin && text.length<3){ SUP.err='Напиши хотя бы пару слов.'; drawSupport(); return; }
  var web=$('#supWeb'); var hp=web?web.value:'';
  var ctx={version:APP_VERSION,screen:view.name+(view.id?'/'+view.id:''),kid:activeKid?(kidName(activeKid)+' ('+kidGrade(activeKid)+' кл.)'):''};
  var ok=false;
  if(CLOUD.support){
    SUP.sending=true; SUP.err=''; drawSupport();
    try{
      var r=await fetch(pin?'/api/pin-request':'/api/support',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},
        body:JSON.stringify(pin?{what:text}:Object.assign({kind:SUP.kind,message:text,contact:SUP.contact,website:hp},ctx))});
      var j=await r.json().catch(function(){return {}});
      if(r.ok&&j.ok){
        SUP.done=pin?(j.auto?'PIN-коды отправлены на вашу почту.':'Запрос отправлен. Поддержка пришлёт PIN-коды на вашу почту.'):'Сообщение отправлено. Мы прочитаем его и ответим, если нужно.';
        SUP.text=''; ok=true;
      }else if(r.status>=400&&r.status<500&&j.error){ SUP.sending=false; SUP.err=j.error; drawSupport(); return; }
    }catch(e){}
    SUP.sending=false;
  }
  if(!ok){
    if(pin){ SUP.err='Сейчас запрос отправить не получилось. Попробуйте чуть позже.'; drawSupport(); return; }
    var body=text+'\n\n—\nТип: '+KIND_LABEL[SUP.kind]+'\nВерсия: '+APP_VERSION+'\nЭкран: '+ctx.screen+(ctx.kid?'\nРебёнок: '+ctx.kid:'')+(SUP.contact?'\nМоя почта: '+SUP.contact:'');
    SUP.mailto='mailto:'+SUPPORT_EMAIL+'?subject='+encodeURIComponent('Математика в клетку — '+KIND_LABEL[SUP.kind])+'&body='+encodeURIComponent(body);
  }
  drawSupport();
}

async function fetchRemoteProgress(kidId){
  if(!db) return;
  try{
    var snap=await db.doc('progress/'+kidId).get();
    if(snap&&snap.exists){
      var d=snap.data();
      if(d&&d.state){
        var r=normalize(d.state);
        var changed=JSON.stringify(r)!==JSON.stringify(remoteProgressCache[kidId]||null);
        remoteProgressCache[kidId]=r;
        if(changed && view.name==='parent') render();
      }
    }
  }catch(e){}
}

  saveStateLocal();
  if(!db||!activeKid) return;
  dirty=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving||!db||!dirty||!activeKid) return;
  saving=true; dirty=false; saveTimer=null;
  var kid=activeKid;
  try{ await db.doc('progress/'+kid).set({state:JSON.parse(JSON.stringify(S)),updatedAt:Date.now()}); dbState='ok'; remoteProgressCache[kid]=normalize(S); }
  catch(e){ dbState='err'; }
  saving=false;
  if(dirty && activeKid===kid) flush();
  paintBar();
}
function hydrate(remote){
  if(saveTimer||saving||dirty) return;
  var r=normalize(remote);
  if(JSON.stringify(r)===JSON.stringify(S)) return;
  S=r; saveStateLocal();
  if(view.name==='home'||view.name==='parent'||view.name==='soon') render(); else paintBar();
}
var progressUnsub=null;
function watchProgress(kidId){
  if(progressUnsub){ try{progressUnsub()}catch(e){} progressUnsub=null; }
  if(!db||!kidId) return;
  var ref=db.doc('progress/'+kidId), first=true;
  progressUnsub=ref.onSnapshot(function(snap){
    if(kidId!==activeKid) return;
    if(snap.exists){
      var d=snap.data();
      if(d&&d.state) hydrate(d.state);
      dbState='ok';
    }else if(first){
      var has=Object.keys(S.practice).length||Object.keys(S.tests).length||S.diag||S.log.length;
      if(has){dirty=true;flush()}
      dbState='ok';
    }
    first=false; paintBar();
  },function(){dbState='err';paintBar()});
}
function scheduleKidsSave(){
  saveKidsLocal();
  if(!kidsDb) return;
  kidsDirty=true;
  clearTimeout(kidsSaveTimer);
  kidsSaveTimer=setTimeout(flushKids,500);
}
async function flushKids(){
  if(kidsSaving||!kidsDb||!kidsDirty) return;
  kidsSaving=true; kidsDirty=false; kidsSaveTimer=null;
  try{ await kidsDb.doc('kids/list').set({kids:JSON.parse(JSON.stringify(KIDS)),parentPass:PARENT_PASS||'',updatedAt:Date.now()}); }
  catch(e){}
  kidsSaving=false;
  if(kidsDirty) flushKids();
}
function hydrateKids(remote){
  if(kidsSaveTimer||kidsSaving||kidsDirty) return;
  if(remote && typeof remote.parentPass==='string' && remote.parentPass && remote.parentPass!==PARENT_PASS){ setParentPass(remote.parentPass); if(view.name==='parent') render(); }
  var list=(remote&&Array.isArray(remote.kids))?remote.kids:null;
  if(!list) return;
  if(JSON.stringify(list)===JSON.stringify(KIDS)) return;
  KIDS=list; saveKidsLocal();
  if(activeKid && !visibleKids().some(function(k){return k.id===activeKid})) activeKid=null;
  if(view.name==='pickkid'||view.name==='parent') render();
}

/* ======================= ПРОГРЕСС ======================= */
function avail(id){return !TOPICS[id].soon && CONTENT[id]}
function solvedCount(id){var p=S.practice[id]||{};return Object.keys(p).filter(function(k){return k!=='b'&&p[k].ok}).length}
function tStat(id){
  if(!avail(id)) return 'soon';
  var t=S.tests[id];
  if(t && t.total && t.best/t.total>=PASS) return 'done';
  if(solvedCount(id)>0||t) return 'prog';
  return 'new';
}
function needsReview(id){
  var t=S.tests[id];
  return t && Date.now()-t.ts>7*24*3600*1000 && t.best/t.total>=PASS;
}
function overall(){
  var ids=ALL.filter(avail); var d=ids.filter(function(i){return tStat(i)==='done'}).length;
  return {done:d,total:ids.length};
}
function statPill(id){
  var s=tStat(id);
  if(s==='soon') return '<span class="pill">готовится</span>';
  if(s==='done') return needsReview(id)?'<span class="pill rev">повторить</span>':'<span class="pill done">освоено</span>';
  if(s==='prog'){var t=S.tests[id]; return '<span class="pill prog">'+(t?('тест '+t.best+'/'+t.total):('задач '+solvedCount(id)+'/'+(CONTENT[id]?CONTENT[id].tasks.length:20)))+'</span>'}
  return '<span class="pill">не начато</span>';
}

  if(!S.diag) return {label:'Пройти входную диагностику',nav:'diag',why:'15 минут — и мы узнаем, с чего начинать'};
  for(var i=0;i<NODE_ORDER.length;i++){
    var n=NODE_ORDER[i], r=S.diag.byNode&&S.diag.byNode[n];
    if(r && r[0]<r[1]){
      var id=topicForNode(n,kidGrade(activeKid));
      if(id && TOPICS[id] && avail(id) && tStat(id)!=='done') return {label:'Продолжить: '+TOPICS[id].name,nav:'t/'+id+'/explain',why:'по диагностике здесь есть пробел'};
    }
  }
  var pool=ALL.filter(avail);
  for(var j=0;j<pool.length;j++) if(tStat(pool[j])!=='done') return {label:'Следующая тема: '+TOPICS[pool[j]].name,nav:'t/'+pool[j]+'/explain',why:'идём по порядку'};

function gradeAll(items,box){

    if(it.opts){var sel=$('.opt.sel',row); given=sel?+sel.getAttribute('data-pick'):null; ok=given===it.ans; return {q:it.q,given:given==null?'':it.opts[given],right:it.opts[it.ans],ok:ok,sol:it.sol,node:it.node}}
    given=$('input',row).value.trim(); ok=given!==''&&gradeNum(it,given);
    var workEl=$('textarea.work',row), work=workEl?workEl.value.trim():'';
    return {q:it.q,given:given,right:it.ans,ok:ok,sol:it.sol,node:it.node,reduced:it.reduced,work:work};
  });
}
function finish(){

    $('#ferr').textContent='Осталось без ответа: '+empty+'. Нажми ещё раз, чтобы завершить — пустые засчитаются как ошибки.';
    $('#ferr').className='fb bad'; box.setAttribute('data-warned','1'); return;
  }
  var score=res.filter(function(r){return r.ok}).length, total=res.length, now=Date.now();
  var entry={ts:now,kind:kind,topic:topic||null,score:score,total:total,wrong:res.filter(function(r){return !r.ok}).map(function(r){return {q:plain(r.q),given:plain(r.given),right:plain(r.right),work:r.work||''}}),work:res.map(function(r){return r.work||''}).join('|').length>0};
  var result={kind:kind,topic:topic,score:score,total:total,items:res,ts:now};
  if(kind==='diag'){

  }else{
    var prev=S.tests[topic]; S.tests[topic]={best:prev?Math.max(prev.best,score):score,total:total,ts:now,last:score,tries:(prev?prev.tries:0)+1};
  }
  S.log.unshift(entry); if(S.log.length>40) S.log.length=40;

  try{window.scrollTo(0,0)}catch(e){}
}
