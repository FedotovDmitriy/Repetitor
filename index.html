CONTENT.gcd = {
  goal: 'После этой темы ты сможешь раскладывать любое число на простые множители, находить наибольший общий делитель (НОД) и наименьшее общее кратное (НОК) и решать задачи «разделить поровну» и «когда встретятся снова».',
  explain: '<p>Мы уже знаем, что простые числа делятся только на 1 и на само себя (2, 3, 5, 7, 11, …), а составные — ещё на что-то. О признаках делимости и о том, как узнать, простое ли число, смотри тему «Делимость». Здесь мы используем простые числа как «кирпичики», из которых складываются все остальные.</p>'
  + '<h3>Разложение на простые множители</h3>'
  + '<p>Любое составное число можно записать как произведение простых чисел. Например, 60 = 6 · 10, но 6 и 10 ещё не простые, поэтому раскладываем дальше: 6 = 2 · 3, 10 = 2 · 5. Получаем 60 = 2 · 2 · 3 · 5. Это и есть <b>разложение на простые множители</b>. Его удобно рисовать в виде дерева: сверху число, ниже пара множителей, и так до тех пор, пока в «листьях» не останутся одни простые числа.</p>'
  + '<div class="figure">__SVG_FACTOR_TREE__</div>'
  + '<p>Одинаковые множители записывают степенью: 60 = 2^2 · 3 · 5. Если число большое, удобнее делить «в столбик» на простые числа по порядку: 360 : 2 = 180, 180 : 2 = 90, 90 : 2 = 45, 45 : 3 = 15, 15 : 3 = 5, 5 : 5 = 1. Значит, 360 = 2 · 2 · 2 · 3 · 3 · 5 = 2^3 · 3^2 · 5.</p>'
  + '<div class="note"><span class="hand">Запомни</span>Разложение на простые множители у каждого числа только одно (с точностью до порядка множителей). Как бы ты ни строил дерево, в конце получится один и тот же набор простых чисел. Принято записывать их по возрастанию.</div>'
  + '<h3>Общие делители и НОД</h3>'
  + '<p>Выпишем все делители чисел 18 и 24: D(18) = {1, 2, 3, 6, 9, 18} и D(24) = {1, 2, 3, 4, 6, 8, 12, 24}. Числа, которые есть в обоих множествах, — это <b>общие делители</b>: {1, 2, 3, 6}. Самый большой из них называется <b>наибольшим общим делителем</b>: НОД(18, 24) = 6.</p>'
  + '<p>Когда числа большие, перебирать делители долго. Тогда раскладываем числа на простые множители и берём <b>общую часть</b>. Посмотри на 12 = 2 · 2 · 3 и 18 = 2 · 3 · 3.</p>'
  + '<div class="figure">__SVG_GCD_VENN__</div>'
  + '<p>Общие множители у них 2 и 3, значит НОД(12, 18) = 2 · 3 = 6. Алгоритм такой: <b>1)</b> разложить числа; <b>2)</b> выписать все общие простые множители (если множитель встречается в обоих числах дважды, берём его дважды); <b>3)</b> перемножить.</p>'
  + '<p>Если у чисел нет ни одного общего простого множителя, их НОД равен 1. Такие числа называются <b>взаимно простыми</b>. Например, 8 = 2 · 2 · 2 и 15 = 3 · 5 — взаимно простые, хотя ни одно из них не является простым! Взаимно простыми бывают и два простых числа: 7 и 11.</p>'
  + '<h3>Общие кратные и НОК</h3>'
  + '<p>Кратные числа — это результаты умножения на 1, 2, 3, …: K(4) = {4, 8, 12, 16, 20, 24, …}, K(6) = {6, 12, 18, 24, …}. Общие кратные — числа из обоих рядов: 12, 24, 36, … Самое маленькое из них — <b>наименьшее общее кратное</b>: НОК(4, 6) = 12. Представь двух кузнечиков: один прыгает по 4 деления, другой по 6. Первый раз они приземлятся на одной отметке именно в точке 12.</p>'
  + '<div class="figure">__SVG_LCM_LINES__</div>'
  + '<p>Как искать НОК через разложение: <b>1)</b> разложить оба числа; <b>2)</b> выписать разложение одного из них; <b>3)</b> дописать «недостающие» множители другого; <b>4)</b> перемножить. Для 12 = 2 · 2 · 3 и 30 = 2 · 3 · 5 берём 2 · 2 · 3 и добавляем недостающую 5: НОК(12, 30) = 2 · 2 · 3 · 5 = 60.</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Не путай НОД и НОК. НОД — это <i>делитель</i>, он не больше меньшего из чисел; НОК — это <i>кратное</i>, оно не меньше большего из чисел. И не перемножай числа «на всякий случай»: НОК(6, 8) — это 24, а не 6 · 8 = 48. Произведение даёт лишь какое-то общее кратное, но не наименьшее.</div>'
  + '<div class="note"><span class="hand">Запомни</span>Два полезных факта. Если числа взаимно простые, то их НОК равен произведению: НОК(8, 15) = 120. А для любых двух чисел НОД(a, b) · НОК(a, b) = a · b. Проверим на числах 8 и 18: НОД(8, 18) = 2, НОК(8, 18) = 72, и 2 · 72 = 144 = 8 · 18.</div>'
  + '<h3>Как понять, что использовать в задаче</h3>'
  + '<ul><li><b>НОД</b> нужен, когда что-то <i>делят поровну</i> на как можно большее число одинаковых частей: раскладывают по наборам, режут на квадраты, делят на команды.</li>'
  + '<li><b>НОК</b> нужен, когда что-то <i>повторяется</i> и мы ждём первого совпадения: два автобуса выехали вместе, две лампочки мигнули вместе, — когда это случится снова?</li></ul>'
  + '<p>Ещё одно применение: чтобы сократить дробь, делят числитель и знаменатель на их НОД (дробь {36|60} после деления на 12 превращается в {3|5}), а чтобы привести дроби к общему знаменателю, ищут НОК их знаменателей. Подробнее об этом — в темах про дроби.</p>',
  examples: [
    {t:'Разложите число 360 на простые множители.', s:'Делим на простые числа по порядку: 360 : 2 = 180; 180 : 2 = 90; 90 : 2 = 45; 45 не делится на 2, делим на 3: 45 : 3 = 15; 15 : 3 = 5; 5 : 5 = 1. Собираем делители: 360 = 2 · 2 · 2 · 3 · 3 · 5 = 2^3 · 3^2 · 5. Проверка: 8 · 9 · 5 = 360.'},
    {t:'Найдите НОД(84, 126).', s:'Раскладываем: 84 = 2 · 2 · 3 · 7; 126 = 2 · 3 · 3 · 7. Общие множители: 2, 3 и 7 (двойка у 126 всего одна, поэтому берём её один раз; тройка у 84 одна). НОД = 2 · 3 · 7 = 42.'},
    {t:'Найдите НОК(84, 126) и проверьте себя по формуле НОД · НОК = a · b.', s:'Берём разложение 84 = 2 · 2 · 3 · 7 и добавляем недостающий множитель числа 126 = 2 · 3 · 3 · 7. Не хватает одной тройки. НОК = 2 · 2 · 3 · 3 · 7 = 252. Проверка: НОД · НОК = 42 · 252 = 10 584, а 84 · 126 = 10 584. Совпало.'},
    {t:'Текстовая задача. В магазине 54 красные и 90 белых роз. Из них составляют одинаковые букеты, и в них должны войти все розы. Какое наибольшее число букетов можно составить? Сколько красных и сколько белых роз в каждом букете?', s:'Число букетов должно делить и 54, и 90, а нам нужно наибольшее — это НОД. 54 = 2 · 3 · 3 · 3; 90 = 2 · 3 · 3 · 5. Общее: 2 · 3 · 3 = 18. Значит, можно составить 18 букетов. Красных в букете: 54 : 18 = 3, белых: 90 : 18 = 5.'},
    {t:'Текстовая задача. Два автобуса отправились от остановки одновременно в 8:00. Первый возвращается на остановку каждые 15 минут, второй — каждые 20 минут. Во сколько они снова окажутся на остановке одновременно?', s:'Ищем первое общее кратное, то есть НОК(15, 20). 15 = 3 · 5; 20 = 2 · 2 · 5. Берём 2 · 2 · 5 и добавляем недостающую 3: 2 · 2 · 5 · 3 = 60. Через 60 минут, то есть в 9:00.'},
    {t:'Найдите ошибку. Ученик написал: «НОК(6, 8) = 6 · 8 = 48». Верно ли это?', s:'Число 48 действительно делится и на 6, и на 8, то есть это общее кратное, но не наименьшее. Раскладываем: 6 = 2 · 3; 8 = 2 · 2 · 2. Берём 2 · 2 · 2 и добавляем недостающую 3: НОК = 24. Проверка: 24 : 6 = 4 и 24 : 8 = 3, а меньшее общее кратное найти нельзя. Правильно: НОК(6, 8) = 24.'},
    {t:'Определите, какие из пар чисел взаимно простые: 15 и 28; 21 и 35; 16 и 27. Для взаимно простых пар найдите НОК.', s:'15 = 3 · 5 и 28 = 2 · 2 · 7 — общих множителей нет, пара взаимно простая. 21 = 3 · 7 и 35 = 5 · 7 — общий множитель 7, не взаимно простые. 16 = 2 · 2 · 2 · 2 и 27 = 3 · 3 · 3 — общих нет, взаимно простые. Для взаимно простых НОК равен произведению: НОК(15, 28) = 420; НОК(16, 27) = 432.'},
    {t:'Сократите дробь {36|60}, используя НОД.', s:'36 = 2 · 2 · 3 · 3; 60 = 2 · 2 · 3 · 5. НОД(36, 60) = 2 · 2 · 3 = 12. Делим числитель и знаменатель на 12: 36 : 12 = 3; 60 : 12 = 5. Получаем {3|5}. Больше сокращать нельзя: 3 и 5 взаимно простые.'}
  ],
  tasks: [
    {q:'Разложите число 66 на простые множители. Чему равен наибольший из этих множителей?', ans:'11', hint:'Сначала раздели 66 на 2, потом реши, как разложить частное.', sol:'66 = 2 · 33 = 2 · 3 · 11. Простые множители: 2, 3, 11. Наибольший — 11.'},

    {q:'Число разложено на простые множители: 2 · 2 · 3 · 7. Какое это число?', ans:'84', hint:'Просто перемножь все множители по порядку.', sol:'2 · 2 = 4; 4 · 3 = 12; 12 · 7 = 84.'},
    {q:'Найдите НОД(16, 24), выписав делители обоих чисел.', ans:'8', hint:'Выпиши D(16) и D(24) и найди самое большое число, которое есть в обоих множествах.', sol:'D(16) = {1, 2, 4, 8, 16}; D(24) = {1, 2, 3, 4, 6, 8, 12, 24}. Общие делители: 1, 2, 4, 8. Наибольший — 8.'},

    {q:'Дробь {36|60} сократили, поделив числитель и знаменатель на их НОД. Найдите сумму числителя и знаменателя получившейся дроби.', ans:'8', hint:'Сначала найди НОД(36, 60), потом подели оба числа на него.', sol:'36 = 2 · 2 · 3 · 3; 60 = 2 · 2 · 3 · 5; НОД = 12. 36 : 12 = 3; 60 : 12 = 5. Дробь {3|5}, сумма 3 + 5 = 8.'},
    {q:'В школьной столовой 48 красных и 60 синих шаров надо разложить в одинаковые наборы так, чтобы все шары были использованы. Какое наибольшее число наборов можно получить?', ans:'12', hint:'Число наборов — общий делитель 48 и 60, причём наибольший.', sol:'48 = 2 · 2 · 2 · 2 · 3; 60 = 2 · 2 · 3 · 5. НОД = 2 · 2 · 3 = 12. Можно сделать 12 наборов (в каждом 4 красных и 5 синих шара).'},
    {q:'Участок земли имеет размеры 72 м на 96 м. Его нужно разбить на одинаковые квадратные грядки без остатка. Какова наибольшая возможная сторона грядки (в метрах)?', ans:'24', hint:'Сторона квадрата должна укладываться и в 72 м, и в 96 м целое число раз.', sol:'Сторона грядки — общий делитель 72 и 96, наибольшая — НОД. 72 = 2 · 2 · 2 · 3 · 3; 96 = 2 · 2 · 2 · 2 · 2 · 3. НОД = 2 · 2 · 2 · 3 = 24. Сторона 24 м: 72 : 24 = 3 и 96 : 24 = 4, всего 12 грядок.'},
    {q:'Два автобуса вышли от вокзала в одно время. Один возвращается на вокзал через каждые 12 минут, другой — через каждые 18 минут. Через сколько минут после выезда они впервые снова будут на вокзале одновременно?', ans:'36', hint:'Время, когда оба на вокзале, кратно и 12, и 18. Нужно наименьшее такое время.', sol:'12 = 2 · 2 · 3; 18 = 2 · 3 · 3. НОК = 2 · 2 · 3 · 3 = 36. Через 36 минут.'},
    {q:'Сколько различных простых чисел входит в разложение числа 360 на простые множители?', ans:'3', hint:'Раскладывай на простые множители и отмечай, какие простые числа встретились.', sol:'360 = 2 · 2 · 2 · 3 · 3 · 5. Различные простые: 2, 3, 5. Их три.'},
    {q:'Найдите НОК(36, 48, 60).', ans:'720', hint:'Разложи все три числа. В НОК каждый простой множитель нужен в наибольшей степени, в какой он встречается.', sol:'36 = 2^2 · 3^2; 48 = 2^4 · 3; 60 = 2^2 · 3 · 5. Берём 2^4, 3^2 и 5: 16 · 9 · 5 = 720.'},

    {q:'НОД двух чисел равен 5, а их НОК равен 60. Одно из чисел — 15. Найдите другое число.', ans:'20', hint:'Вспомни: НОД · НОК = произведению самих чисел.', sol:'НОД · НОК = 5 · 60 = 300 — это произведение чисел. Второе число: 300 : 15 = 20. Проверка: НОД(15, 20) = 5, НОК(15, 20) = 60.'},
    {q:'Три маяка мигают с периодами 6, 8 и 10 секунд. В начальный момент они вспыхнули одновременно. Сколько раз за следующие 11 минут все три маяка снова вспыхнут одновременно?', ans:'5', hint:'Сначала найди, через сколько секунд после совместной вспышки будет следующая. Потом подели 11 минут (в секундах) на этот период.', sol:'НОК(6, 8, 10): 6 = 2 · 3; 8 = 2^3; 10 = 2 · 5 — берём 2^3 · 3 · 5 = 120 секунд. 11 минут = 660 секунд; 660 : 120 = 5 (остаток 60). Совместные вспышки будут через 120, 240, 360, 480 и 600 секунд — 5 раз.'},
    {q:'На какое наименьшее натуральное число надо умножить число 72, чтобы получилось число, являющееся квадратом натурального числа (то есть произведением двух одинаковых натуральных чисел)?', ans:'2', hint:'Разложи 72 на простые множители. У числа-квадрата каждый простой множитель встречается чётное число раз.', sol:'72 = 2 · 2 · 2 · 3 · 3. Тройки стоят парой, а двоек три — не хватает одной для пары. Умножаем на 2: 72 · 2 = 144 = 2 · 2 · 2 · 2 · 3 · 3 = 12 · 12. Множитель 1 не подходит, так как 72 не квадрат (8^2 = 64, 9^2 = 81). Ответ: 2.'}

    {q:'В кладовой 56 яблок и 42 груши. Из них надо составить одинаковые подарки, использовав все фрукты. Какое наибольшее число подарков можно составить?', ans:'14', sol:'НОД(56, 42): 56 = 2 · 2 · 2 · 7; 42 = 2 · 3 · 7. Общее: 2 · 7 = 14. Получится 14 подарков (по 4 яблока и 3 груши).'},
    {q:'Два бегуна стартовали одновременно с одной отметки беговой дорожки. Один пробегает круг за 60 секунд, другой — за 45 секунд. Через сколько секунд после старта они первый раз снова окажутся вместе на старте?', ans:'180', sol:'Нужно НОК(60, 45). 60 = 2 · 2 · 3 · 5; 45 = 3 · 3 · 5. Берём 2 · 2 · 3 · 5 и добавляем недостающую 3: 2 · 2 · 3 · 3 · 5 = 180 секунд.'},

  lab: [
    {t:'Дерево из собственных чисел', b:'Возьми свой год рождения, номер дома и номер квартиры. Для каждого числа нарисуй на бумаге дерево разложения на простые множители, а простые числа обведи в кружки. Перемножь листья и проверь, что получилось исходное число. Затем построй второе, «другое» дерево для одного из чисел (начни с другой пары множителей) и убедись, что набор простых чисел на концах веток тот же самый.'},
    {t:'Квадраты из бумаги', b:'Вырежи из клетчатой бумаги прямоугольник 12 на 18 клеток. Попробуй разрезать его на одинаковые квадраты без остатка: сначала со стороной 2, потом 3, потом 4, 5, 6. Отметь, при каких сторонах получилось, а при каких нет. Найди наибольшую сторону — это НОД(12, 18) — и посчитай, сколько квадратов вышло (должно быть 6).'},

    {t:'Раздача конфет по-честному', b:'Возьми 24 любых мелких предмета одного вида (конфеты, пуговицы, монеты) и 36 предметов другого вида. Попробуй разложить их в одинаковые кучки так, чтобы в каждой кучке были предметы обоих видов и ничего не осталось. Найди, при каком наибольшем числе кучек это получается, и сколько предметов каждого вида в одной кучке. Проверь себя вычислением НОД(24, 36).'}

CONTENT.deg = {
  goal: 'После этой темы ты сможешь читать и записывать степень с натуральным показателем, быстро вычислять квадраты, кубы и степени десяти и правильно считать примеры со степенями.',
  explain: '<p>Ты уже умеешь складывать одинаковые слагаемые: 5 + 5 + 5 = 5 · 3. А что, если одинаковые не слагаемые, а <b>множители</b>? Например, 5 · 5 · 5. Записывать такое длинно, поэтому придумали короткую запись — <b>степень</b>.</p>'
  + '<h3>Что такое степень</h3>'
  + '<p>Произведение одинаковых множителей записывают так: 5 · 5 · 5 = 5^3. Читается: «пять в третьей степени». Число, которое повторяют, называется <b>основанием</b> степени, а число, которое показывает, сколько раз его повторили, — <b>показателем</b>.</p>'
  + '<p>Общее правило: a^n — это произведение n одинаковых множителей, каждый из которых равен a. Например, 2^5 = 2 · 2 · 2 · 2 · 2 = 32. Здесь основание 2, показатель 5. Само число 32 называют <b>значением степени</b>.</p>'
  + '<div class="note"><span class="hand">Запомни</span>Показатель степени говорит, <b>сколько раз</b> основание берётся множителем, а не на что его умножают. 2^5 — это пять двоек, перемноженных друг на друга.</div>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>2^3 — это НЕ 2 · 3 = 6. Это 2 · 2 · 2 = 8. Перед вычислением всегда сначала расписывай степень в произведение одинаковых множителей.</div>'
  + '<h3>Квадрат и куб числа</h3>'
  + '<p>Вторую степень называют <b>квадратом</b> числа, а третью — <b>кубом</b>. Названия пришли из геометрии: площадь квадрата со стороной 3 равна 3 · 3 = 3^2 = 9 клеток, а объём куба с ребром 3 равен 3 · 3 · 3 = 3^3 = 27 кубиков.</p>'
  + '<div class="figure">__SVG_POW_SQUARE_CUBE__</div>'
  + '<p>Эти значения полезно знать наизусть.</p>'
  + '<ul><li><b>Квадраты:</b> 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225, 256, 289, 324, 361, 400 (это 1^2, 2^2, …, 20^2).</li>'
  + '<li><b>Кубы:</b> 1, 8, 27, 64, 125, 216, 343, 512, 729, 1000 (это 1^3, 2^3, …, 10^3).</li></ul>'
  + '<h3>Степени десяти и запись числа</h3>'
  + '<p>Степени числа 10 самые простые: 10^1 = 10, 10^2 = 100, 10^3 = 1000, 10^4 = 10 000. Показатель равен количеству нулей после единицы. Поэтому любое число можно записать <b>суммой разрядных слагаемых</b>:</p>'
  + '<p>4302 = 4 · 10^3 + 3 · 10^2 + 0 · 10 + 2. Слагаемое с нулевой цифрой можно и не писать: 4302 = 4 · 10^3 + 3 · 10^2 + 2.</p>'
  + '<p>Такие записи помогают и в жизни: в 1 километре 1000 = 10^3 метров, в 1 метре 100 = 10^2 сантиметров.</p>'
  + '<h3>Порядок действий со степенями</h3>'
  + '<p>Возведение в степень — действие «старше» умножения. Порядок такой: <b>1)</b> скобки; <b>2)</b> степени; <b>3)</b> умножение и деление слева направо; <b>4)</b> сложение и вычитание слева направо.</p>'
  + '<p>Сравни: 2 + 3^2 = 2 + 9 = 11, а (2 + 3)^2 = 5^2 = 25. Скобки меняют ответ, потому что в скобках степень берётся от всей суммы. Ещё пример: 3 · 2^4 = 3 · 16 = 48 — возводим в степень только двойку, а не всё произведение 3 · 2.</p>'
  + '<h3>Удвоения и особые случаи</h3>'
  + '<p>Степени двойки растут очень быстро. Сложим лист бумаги пополам: после каждого сложения число слоёв удваивается. Получаем 1, 2, 4, 8, 16, 32 слоя — это 2^0, 2^1, …, 2^5.</p>'
  + '<div class="figure">__SVG_POW_DOUBLING__</div>'
  + '<p>Два особых случая. Первая степень числа — само число: a^1 = a (например, 7^1 = 7). Нулевая степень любого числа, кроме нуля, равна единице: a^0 = 1. Почему так? Смотри на двойки: 2^3 = 8, 2^2 = 4, 2^1 = 2 — каждый раз делим на 2, значит следующий шаг 2 : 2 = 1, то есть 2^0 = 1. Такое соглашение придумано, чтобы все правила степеней работали без исключений.</p>'
  + '<p>Полезно помнить и про 0 и 1: 0^n = 0 и 1^n = 1 при любом натуральном n, ведь произведение единиц всегда 1, а нулей — 0.</p>',
  examples: [

    {t:'Запишите с помощью степеней произведение 2 · 2 · 3 · 3 · 3 и найдите его значение.', s:'Двойка повторяется 2 раза, тройка — 3 раза: 2 · 2 · 3 · 3 · 3 = 2^2 · 3^3. Значения: 2^2 = 4, 3^3 = 27. Итого 4 · 27 = 108.'},
    {t:'Вычислите 4^3 + 3^4.', s:'4^3 = 4 · 4 · 4 = 64. 3^4 = 3 · 3 · 3 · 3 = 81. Сумма: 64 + 81 = 145.'},
    {t:'Определите порядок действий и вычислите 200 − (2 + 3)^3 + 2 · 3^2.', s:'① Скобки: 2 + 3 = 5. ② Степени: 5^3 = 125 и 3^2 = 9. ③ Умножение: 2 · 9 = 18. ④ Вычитание и сложение слева направо: 200 − 125 = 75; 75 + 18 = 93.'},
    {t:'Найдите ошибку. Ученик написал: 4^3 = 12 и 2^5 = 10. Как правильно?', s:'Ученик умножил основание на показатель. Но 4^3 = 4 · 4 · 4 = 64, а 2^5 = 2 · 2 · 2 · 2 · 2 = 32. Показатель — это число множителей, а не число, на которое умножают.'},
    {t:'Представьте число 75 681 в виде суммы разрядных слагаемых, записывая разрядные единицы как степени числа 10.', s:'75 681 = 7 · 10 000 + 5 · 1000 + 6 · 100 + 8 · 10 + 1. Записываем разрядные единицы степенями: 75 681 = 7 · 10^4 + 5 · 10^3 + 6 · 10^2 + 8 · 10 + 1.'},
    {t:'Одна клетка делится каждый час на две. Сколько клеток будет через 7 часов, если вначале была одна?', s:'Каждый час число клеток удваивается: 1, 2, 4, 8, 16, 32, 64, 128. Значит, через 7 часов их 2^7 = 128.'},
    {t:'Найдите методом проб число, квадрат которого равен 2209.', s:'40^2 = 1600, а 50^2 = 2500, значит число между 40 и 50. Квадрат оканчивается на 9, поэтому число оканчивается на 3 или на 7. Проверяем 43^2 = 1849 (мало) и 47^2 = 47 · 47 = 2209. Ответ: 47.'},
    {t:'Вычислите 1^100 + 0^5 + 9^1 + 9^0.', s:'1^100 = 1 (произведение единиц). 0^5 = 0. 9^1 = 9. 9^0 = 1. Сумма: 1 + 0 + 9 + 1 = 11.'}
  ],

CONTENT.mot = {
  goal: 'После этой темы ты будешь уверенно решать задачи на движение: находить путь, скорость и время, а также определять, когда и где встретятся или догонят друг друга два движущихся объекта.',
  explain: '<p>Задачи на движение — одни из самых частых в математике: в них что-то едет, идёт или плывёт, а нам нужно узнать, как далеко, как быстро или как долго. Хорошая новость: вся тема держится на одной простой формуле.</p>'
  + '<h3>Путь, скорость, время</h3>'
  + '<p><b>Скорость</b> — это путь, который объект проходит за единицу времени (за 1 час, за 1 минуту, за 1 секунду). Если автобус едет со скоростью 50 км/ч, значит, за каждый час он проезжает 50 км. Тогда за 3 часа он проедет 50 · 3 = 150 км. Так рождается главная формула:</p>'
  + '<div class="note"><span class="hand">Запомни</span>Путь = скорость · время, то есть <b>s = v · t</b>. Отсюда: <b>v = s : t</b> (скорость), <b>t = s : v</b> (время). Две последние формулы — это просто «обратные» действия к умножению.</div>'
  + '<p>Примеры. Пешеход идёт 4 часа со скоростью 5 км/ч: s = 5 · 4 = 20 км. Поезд прошёл 360 км за 6 часов: v = 360 : 6 = 60 км/ч. Велосипедисту надо проехать 48 км при скорости 12 км/ч: t = 48 : 12 = 4 ч.</p>'
  + '<h3>Единицы измерения скорости</h3>'
  + '<p>Единицы бывают разные: км/ч, м/мин, м/с. Главное правило — <b>единицы должны быть согласованы</b>: если скорость в метрах в минуту, то и время нужно брать в минутах, а путь получится в метрах. Если единицы разные, сначала переведи их.</p>'
  + '<p>Как перевести 72 км/ч в м/с? За 1 час машина проезжает 72 км = 72 000 м. В часе 3600 секунд. Значит, за 1 секунду: 72 000 : 3600 = 20 м. Итак, 72 км/ч = 20 м/с. Обратно: 15 м/с — это 15 · 3600 = 54 000 м за час, то есть 54 км/ч.</p>'
  + '<h3>Два движущихся объекта: четыре случая</h3>'
  + '<p>Когда движутся сразу два объекта, главный вопрос: как быстро <b>меняется расстояние между ними</b>? Эту величину называют <b>скоростью сближения</b> (расстояние уменьшается) или <b>скоростью удаления</b> (расстояние растёт). Всё зависит от того, куда они едут.</p>'
  + '<div class="figure">__SVG_MOT_CASES__</div>'
  + '<ul><li><b>Навстречу друг другу.</b> Каждый «съедает» часть расстояния, поэтому скорости <b>складываются</b>: v сближения = v₁ + v₂. Если между городами 300 км, а машины едут навстречу со скоростями 60 и 90 км/ч, то каждый час расстояние уменьшается на 150 км, и встреча произойдёт через 300 : 150 = 2 часа.</li>'
  + '<li><b>В противоположные стороны.</b> Расстояние растёт с обеих сторон, скорости снова <b>складываются</b>: v удаления = v₁ + v₂.</li>'
  + '<li><b>Вдогонку</b> (один догоняет другого, оба едут в одну сторону). Догоняющий быстрее, поэтому расстояние сокращается только на <b>разность</b> скоростей: v сближения = v₁ − v₂.</li>'
  + '<li><b>С отставанием</b> (в одну сторону, но передний быстрее). Расстояние растёт на разность скоростей: v удаления = v₁ − v₂.</li></ul>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Путают, когда скорости складывать, а когда вычитать. Проверь себя вопросом: «объекты движутся навстречу или в разные стороны — или едут в одну сторону?» Если в одну сторону — скорости вычитаются, иначе — складываются. Ещё одна ошибка: делить расстояние на одну скорость вместо скорости сближения.</div>'
  + '<h3>Время встречи и время догона</h3>'
  + '<p>Раз v сближения — это «сколько километров в час исчезает между объектами», то время до встречи находим по той же формуле: <b>t = расстояние : скорость сближения</b>. Например, турист впереди на 12 км, идёт 4 км/ч, а его догоняет велосипедист со скоростью 10 км/ч. Скорость сближения 10 − 4 = 6 км/ч, время догона: 12 : 6 = 2 ч.</p>'
  + '<p>Если один из участников выехал раньше, сначала посчитай, какое расстояние он успел проехать (или на сколько «оторвался») до старта второго. Это и будет новое начальное расстояние.</p>'
  + '<h3>График движения</h3>'
  + '<p>Движение можно нарисовать: по горизонтали откладываем время t (в часах), по вертикали — расстояние s (в километрах). Объект с постоянной скоростью изображается <b>прямой линией</b>: чем круче прямая, тем больше скорость. Пусть между пунктами 200 км, и навстречу выехали автомобили: первый из начала (расстояние 0) со скоростью 40 км/ч, второй — из пункта на расстоянии 200 км со скоростью 60 км/ч. Первая прямая идёт вверх, вторая — вниз.</p>'
  + '<div class="figure">__SVG_MOT_GRAPH__</div>'
  + '<p>Точка пересечения прямых — это встреча: оба объекта в один и тот же момент находятся в одном месте. Проверим счётом: скорость сближения 40 + 60 = 100 км/ч, время 200 : 100 = 2 ч; первый к этому моменту проехал 40 · 2 = 80 км. Именно это подписано на графике у точки встречи.</p>',
  examples: [
    {t:'Автобус ехал 5 часов со скоростью 54 км/ч. Найдите путь. Затем найдите, за сколько часов он проедет 432 км с той же скоростью.', s:'Путь: s = v · t = 54 · 5 = 270 км. Время на 432 км: t = s : v = 432 : 54 = 8 ч.'},
    {t:'Переведите 72 км/ч в м/с, а 15 м/с — в км/ч.', s:'72 км = 72 000 м; в часе 3600 с; 72 000 : 3600 = 20, то есть 72 км/ч = 20 м/с. За 1 ч при скорости 15 м/с проходится 15 · 3600 = 54 000 м = 54 км, значит, 15 м/с = 54 км/ч.'},
    {t:'Составьте выражение и решите: из двух городов, расстояние между которыми 420 км, одновременно навстречу друг другу выехали два автомобиля со скоростями 60 и 80 км/ч. Через сколько часов они встретятся?', s:'Автомобили едут навстречу, значит, скорости складываются: 60 + 80 = 140 км/ч — скорость сближения. Время до встречи: 420 : (60 + 80) = 420 : 140 = 3 ч.'},
    {t:'Найдите ошибку. Два пешехода вышли навстречу друг другу из пунктов, расстояние между которыми 30 км. Скорости 4 и 6 км/ч. Ученик решил: 30 : (6 − 4) = 15 ч. Верно ли это?', s:'Неверно. Пешеходы идут навстречу, поэтому скорости надо складывать, а не вычитать: 4 + 6 = 10 км/ч. Верное время: 30 : 10 = 3 ч. Ученик посчитал так, как будто один догоняет другого.'},
    {t:'Турист вышел из лагеря со скоростью 5 км/ч. Через 3 часа вслед за ним выехал велосипедист со скоростью 20 км/ч. Через сколько часов после своего выезда велосипедист догонит туриста?', s:'За 3 часа турист успел уйти на 5 · 3 = 15 км — это начальное расстояние между ними. Скорость сближения при движении вдогонку: 20 − 5 = 15 км/ч. Время догона: 15 : 15 = 1 ч. Проверка: за 1 ч велосипедист проедет 20 км, а турист за 4 часа пройдёт 5 · 4 = 20 км — они в одной точке.'},
    {t:'Два автомобиля выезжают из одного пункта одновременно: один на восток со скоростью 70 км/ч, другой на запад со скоростью 50 км/ч. Какое расстояние между ними будет через 2 часа?', s:'Движутся в противоположные стороны, значит, скорость удаления 70 + 50 = 120 км/ч. Расстояние через 2 ч: 120 · 2 = 240 км. Можно и так: 70 · 2 = 140 км и 50 · 2 = 100 км, вместе 240 км.'},
    {t:'Расстояние между пунктами 200 км. Из одного пункта выехал автомобиль со скоростью 40 км/ч, из другого одновременно навстречу — со скоростью 60 км/ч. Запишите расстояние от первого пункта до первого автомобиля через t часов и найдите, на каком расстоянии от первого пункта они встретятся.', s:'Первый автомобиль: s = 40 · t. Второй едет навстречу, его расстояние до первого пункта: 200 − 60 · t. Встреча, когда они в одном месте: 40 · t = 200 − 60 · t. Проще: время встречи 200 : (40 + 60) = 2 ч, тогда s = 40 · 2 = 80 км. Так же получается 200 − 60 · 2 = 80 км.'}
  ],
  tasks: [
    {q:'Поезд идёт со скоростью 65 км/ч. Какой путь он пройдёт за 4 часа (в км)?', ans:'260', hint:'Путь = скорость · время.', sol:'s = v · t = 65 · 4 = 260 км.'},
    {q:'Электричка прошла 360 км за 6 часов. Найдите её скорость (в км/ч).', ans:'60', hint:'Скорость = путь : время.', sol:'v = 360 : 6 = 60 км/ч.'},
    {q:'Велосипедист едет со скоростью 42 км/ч. За сколько часов он проедет 252 км?', ans:'6', hint:'Время = путь : скорость.', sol:'t = 252 : 42 = 6 ч.', },

    {q:'Два велосипедиста находятся на расстоянии 20 км друг от друга и одновременно выезжают навстречу, каждый со скоростью 10 км/ч. Вместе с первым вылетает муха со скоростью 30 км/ч; она летит ко второму, встретив его, разворачивается и летит к первому, и так далее, пока велосипедисты не встретятся. Сколько километров пролетит муха?', ans:'30', hint:'Не считай отдельные перелёты! Найди, сколько времени летела муха — оно равно времени до встречи велосипедистов.', sol:'Скорость сближения велосипедистов 10 + 10 = 20 км/ч, до встречи 20 : 20 = 1 ч. Всё это время муха летит со скоростью 30 км/ч, значит, пролетит 30 · 1 = 30 км.'}

CONTENT.logic = {
  goal: 'После этой темы ты сможешь работать с множествами и кругами Эйлера, пересчитывать варианты без пропусков и решать простые логические задачи про «рыцарей и лжецов».',
  explain: '<p>Математика — это не только числа. Ещё она учит аккуратно собирать предметы в группы, честно считать варианты и рассуждать так, чтобы вывод нельзя было оспорить. Все три умения нужны и в олимпиадах, и в жизни: например, когда надо понять, сколько разных нарядов можно составить из имеющейся одежды.</p>'
  + '<h3>Множество, элемент, подмножество</h3>'
  + '<p><b>Множество</b> — это набор объектов, собранных по какому-то признаку. Сами объекты называют <b>элементами</b>. Записывают множество в фигурных скобках: A = {2, 4, 6}. Про число 4 говорят «4 принадлежит A» и пишут 4 ∈ A, а про число 5 — «5 не принадлежит A». Порядок элементов не важен, а повторы не считаются: {1, 2, 2, 3} — то же самое, что {1, 2, 3}, в нём три элемента.</p>'
  + '<p>Множество, в котором нет ни одного элемента, называется <b>пустым</b> и обозначается ∅. Например, множество простых чисел, кратных 4, пусто: любое число, кратное 4, делится ещё и на 2 и на 4, поэтому простым быть не может. Если каждый элемент множества B есть и в множестве A, то B называют <b>подмножеством</b> множества A. Пример: {2, 4} — подмножество множества {2, 4, 6}. Подмножеством считаются и само множество, и пустое множество.</p>'
  + '<p>У множества {a, b, c} восемь подмножеств: ∅, {a}, {b}, {c}, {a, b}, {a, c}, {b, c}, {a, b, c}. Вообще у множества из n элементов ровно 2^n подмножеств: каждый элемент можно «взять» или «не брать», и так для каждого.</p>'
  + '<h3>Пересечение и объединение</h3>'
  + '<p>Пусть A = {1, 2, 3, 4, 5, 6} и B = {4, 5, 6, 7, 8}. <b>Пересечение</b> A ∩ B — это общие элементы: {4, 5, 6}. <b>Объединение</b> A ∪ B — все элементы, которые есть хотя бы в одном из множеств, причём общие записываются один раз: {1, 2, 3, 4, 5, 6, 7, 8}.</p>'
  + '<p>Посчитаем: в A шесть элементов, в B пять, вместе 6 + 5 = 11, но в объединении их только 8. Общие три элемента мы посчитали дважды. Значит, 11 − 3 = 8.</p>'
  + '<div class="note"><span class="hand">Запомни</span>Формула включений-исключений для двух множеств: n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Здесь n(A) — число элементов в A. Общую часть вычитаем, потому что при сложении она попала в сумму два раза.</div>'
  + '<h3>Круги Эйлера</h3>'
  + '<p>Чтобы не запутаться, множества рисуют кругами, а всё, о чём идёт речь, — прямоугольником. Такие рисунки называют <b>кругами Эйлера</b> (или диаграммами Эйлера–Венна). Общую часть кругов — пересечение — считают первой.</p>'
  + '<div class="figure">__SVG_SET_EULER__</div>'
  + '<p>В классе 30 школьников. Футболом занимаются 18, шахматами — 15, обоими — 7. Начинаем с середины: «оба» — 7. Только футбол: 18 − 7 = 11. Только шахматы: 15 − 7 = 8. Всего в кругах 11 + 7 + 8 = 26 человек, значит, ни тем, ни другим не занимаются 30 − 26 = 4 школьника — они в прямоугольнике вне кругов.</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Сложить 18 + 15 = 33 и удивиться, что получилось больше 30. Школьники, которые ходят в обе секции, попали в сумму дважды. Всегда сначала находи «оба» и вычитай их.</div>'
  + '<h3>Высказывания, «все», «некоторые», «ни один»</h3>'
  + '<p><b>Высказывание</b> — это предложение, про которое можно сказать, истинно оно или ложно. «7 · 8 = 56» — истинное высказывание, «7 · 8 = 54» — ложное. Вопрос «Который час?» и восклицание «Ура!» высказываниями не являются.</p>'
  + '<ul><li><b>«Все», «каждый»</b> — общее утверждение. Чтобы его опровергнуть, хватит одного <b>контрпримера</b>: «Все простые числа нечётны» — ложь, потому что 2 — простое и чётное.</li>'
  + '<li><b>«Некоторые», «существует»</b> — значит «хотя бы один». Чтобы подтвердить, достаточно одного примера: «Некоторые простые числа чётны» — истина.</li>'
  + '<li><b>«Ни один»</b> — не подходит ни один элемент. Опровергает такое утверждение один подходящий пример.</li></ul>'
  + '<p><b>Отрицание</b> высказывания — это высказывание, которое ложно тогда, когда исходное истинно, и наоборот. Отрицание «Все ученики пришли» — это «Некоторые ученики не пришли».</p>'
  + '<div class="warn"><span class="hand">Частая ошибка</span>Отрицание слова «все» — не «ни один». Чтобы сказать «Все ученики пришли» неправду, достаточно, чтобы отсутствовал хотя бы один, а вовсе не все. Верное отрицание: «Не все пришли», то есть «некоторые не пришли».</div>'
  + '<h3>Перебор вариантов, дерево и правило произведения</h3>'
  + '<p>Сколько двузначных чисел можно записать цифрами 1, 2, 3, если цифры не повторяются? Перебираем по порядку. Начинаем с 1: 12, 13. Начинаем с 2: 21, 23. Начинаем с 3: 31, 32. Всего 6. Порядок перебора — «сначала все числа на 1, потом все на 2» — гарантирует, что мы ничего не пропустим и не посчитаем дважды.</p>'
  + '<p>Тот же перебор можно нарисовать как <b>дерево возможностей</b>: из корня выходят три ветки (первая цифра 1, 2 или 3), а из каждой — по две ветки (вторая цифра — любая из двух оставшихся). Листьев на дереве 3 · 2 = 6.</p>'
  + '<div class="note"><span class="hand">Запомни</span>Правило произведения: если первый выбор можно сделать m способами, а после него второй — n способами (для любого первого), то всего пар m · n. Например, 3 футболки и 4 пары шорт дают 3 · 4 = 12 комплектов. Для трёх выборов перемножают три числа и так далее.</div>'
  + '<h3>Блок-схема: логика по шагам</h3>'
  + '<p>Последовательность действий с проверкой условия удобно рисовать блок-схемой. Овал — начало и конец, прямоугольник — действие, ромб — вопрос с ответами «да» и «нет». Вот программа: ввести число n; если n чётное, разделить его на 2, иначе умножить на 3 и прибавить 1; вывести результат.</p>'
  + '<div class="figure">__SVG_LOGIC_FLOW__</div>'
  + '<p>Проверим на числах. n = 10: чётное, ответ «да», делим: 10 : 2 = 5. n = 7: не чётное, ответ «нет», считаем 7 · 3 + 1 = 22.</p>'
  + '<h3>Рыцари и лжецы</h3>'
  + '<p>На особом острове живут <b>рыцари</b>, которые всегда говорят правду, и <b>лжецы</b>, которые всегда лгут. Задача — по словам жителей понять, кто есть кто. Метод один: предположи, что человек — рыцарь, и проверь, нет ли противоречия; если есть, он лжец.</p>'
  + '<p>Например, человек говорит: «Я лжец». Если он рыцарь, то сказал неправду — противоречие. Если он лжец, то сказал правду — тоже противоречие. Значит, такую фразу на острове произнести не может никто.</p>'
  + '<div class="note"><span class="hand">Запомни</span>Что бы ни говорил рыцарь, это правда; лжец говорит только неправду. Слова лжеца «Мы оба рыцари» означают лишь то, что это неверно, то есть хотя бы один из двоих лжец.</div>',
  examples: [
    {t:'Запишите множество двузначных чисел, кратных 25, и найдите число его элементов.', s:'Двузначные числа, кратные 25, — это 25, 50 и 75 (100 уже трёхзначное). Множество {25, 50, 75}, в нём 3 элемента.'},
    {t:'Найдите пересечение и объединение множеств D(12) и D(18) — делителей чисел 12 и 18. Сколько элементов в объединении?', s:'D(12) = {1, 2, 3, 4, 6, 12}, D(18) = {1, 2, 3, 6, 9, 18}. Пересечение — общие делители: {1, 2, 3, 6}. Объединение: {1, 2, 3, 4, 6, 9, 12, 18}, в нём 8 элементов. Проверка формулой: 6 + 6 − 4 = 8.'},
    {t:'На вечеринке было 50 гостей. Чай пили 32, кофе — 27, а 12 гостей пили и то и другое. Сколько гостей не пили ни чай, ни кофе?', s:'Хотя бы один напиток пили 32 + 27 − 12 = 47 гостей (тех, кто пил оба напитка, вычли один раз). Не пили ничего: 50 − 47 = 3 гостя.'},
    {t:'Сколько двузначных чисел можно записать цифрами 1, 2, 3, если цифры (а) могут повторяться; (б) не повторяются?', s:'Дерево возможностей. (а) Первая цифра — 3 способа, вторая — тоже 3: 3 · 3 = 9 чисел (11, 12, 13, 21, 22, 23, 31, 32, 33). (б) Первая цифра — 3 способа, вторая — любая из двух оставшихся: 3 · 2 = 6 чисел (12, 13, 21, 23, 31, 32).'},
    {t:'Найдите ошибку. Ученик рассуждает: «Я проверил числа 3, 5, 7, 11 и 13 — все они простые и нечётные. Значит, утверждение «Все простые числа нечётны» доказано».', s:'Общее утверждение нельзя доказать несколькими примерами — даже большим их числом. А вот опровергнуть его можно одним контрпримером: число 2 простое, но чётное. Значит, утверждение ложно.'},
    {t:'Два жителя острова, A и B. A говорит: «Мы оба лжецы». Кто из них рыцарь, а кто лжец?', s:'Если бы A был рыцарём, он сказал бы правду, то есть был бы лжецом — противоречие. Значит, A — лжец, и его слова ложны: «оба лжецы» неверно. Один из них — рыцарь, а A лжец, значит, рыцарь — B. Ответ: A — лжец, B — рыцарь.'},
    {t:'По блок-схеме: ввести n; если n чётное, разделить на 2, иначе умножить на 3 и прибавить 1. Что получится при n = 22? А если применить схему к результату ещё раз?', s:'n = 22 чётное, ответ «да»: 22 : 2 = 11. Применяем схему к 11: оно нечётное, ответ «нет»: 11 · 3 + 1 = 34. Итог: 11, а затем 34.'}

    {q:'В классе 25 учеников. В кружок рисования ходят 14 человек, в кружок танцев — 9, а 3 человека ходят в оба кружка. Сколько учеников ходят хотя бы в один из этих кружков?', ans:'20', hint:'Тех, кто ходит в оба кружка, при сложении посчитали дважды.', sol:'14 + 9 − 3 = 20 учеников.'},

    {q:'Сколько истинных высказываний среди пяти: 1) 7 · 8 = 54; 2) 15 делится на 3; 3) 2^3 = 6; 4) число 17 простое; 5) 100 больше 99?', ans:'3', hint:'Проверь каждое высказывание отдельно.', sol:'1) 7 · 8 = 56, поэтому высказывание ложно. 2) 15 = 3 · 5, истинно. 3) 2^3 = 8, ложно. 4) 17 делится только на 1 и 17, истинно. 5) 100 > 99, истинно. Истинных высказываний 3.'},
    {q:'Сколько всего подмножеств у множества {a, b, c}, считая пустое множество и само множество?', ans:'8', hint:'Выпиши подмножества по порядку: сначала без элементов, потом с одним, потом с двумя, потом со всеми тремя.', sol:'Без элементов: ∅ — 1. С одним: {a}, {b}, {c} — 3. С двумя: {a, b}, {a, c}, {b, c} — 3. С тремя: {a, b, c} — 1. Всего 1 + 3 + 3 + 1 = 8 (это 2^3).'},
    {q:'Сколько трёхзначных чисел можно записать цифрами 1, 2 и 3, если каждую цифру использовать ровно один раз?', ans:'6', hint:'Первую цифру можно выбрать тремя способами. Сколько цифр останется для второго места?', sol:'На первом месте — любая из 3 цифр, на втором — любая из 2 оставшихся, на третьем — последняя оставшаяся: 3 · 2 · 1 = 6. Это числа 123, 132, 213, 231, 312, 321.'},
    {q:'В классе 40 учеников. Математику любят 25 человек, русский язык — 22, а оба предмета любят 12 человек. Сколько учеников не любят ни математику, ни русский язык?', ans:'5', hint:'Сначала найди, сколько учеников любят хотя бы один предмет, не считая никого дважды.', sol:'Хотя бы один предмет любят 25 + 22 − 12 = 35 человек. Не любят ни один: 40 − 35 = 5.'},
    {q:'Из города A в город B ведут 3 дороги, из B в C — 4 дороги, из C в D — 2 дороги. Сколькими способами можно проехать из A в D через B и C?', ans:'24', hint:'Три выбора подряд: перемножь числа способов на каждом участке.', sol:'По правилу произведения: 3 · 4 · 2 = 24 способа.'},
    {q:'Какое из высказываний является отрицанием высказывания «Все ученики класса любят шоколад»?', opts:['Ни один ученик класса не любит шоколад','Некоторые ученики класса не любят шоколад','Все ученики класса не любят шоколад','Некоторые ученики класса любят шоколад'], ans:1, hint:'Отрицание должно быть верным ровно тогда, когда исходное высказывание ложно. Сколько учеников должно не любить шоколад, чтобы «все любят» стало неправдой?', sol:'Высказывание «Все любят шоколад» становится ложным, как только найдётся хотя бы один ученик, который шоколад не любит. Это и означает «Некоторые ученики не любят шоколад». Варианты «Ни один не любит» и «Все не любят» слишком сильные, а «Некоторые любят» может быть верно вместе с исходным.'},
    {q:'Утверждение: «Все числа в списке 3, 6, 9, 12, 15 нечётные». Сколько чисел этого списка являются контрпримерами к этому утверждению?', ans:'2', hint:'Контрпример — это число, для которого утверждение неверно, то есть чётное число.', sol:'Чётные числа списка: 6 и 12. Каждое из них опровергает утверждение, поэтому контрпримеров 2.'},
    {q:'Трое жителей острова рыцарей и лжецов — A, B и C. A говорит: «Мы все трое — лжецы». B говорит: «Среди нас ровно один рыцарь». C молчит. Сколько среди них рыцарей?', ans:'1', hint:'Сначала выясни, может ли A быть рыцарем. Потом посмотри, что тогда должно быть с высказыванием A.', sol:'Если бы A был рыцарём, то его слова «мы все лжецы» были бы правдой и он был бы лжецом — противоречие. Значит, A — лжец, и хотя бы один из троих рыцарь. Если B — лжец, то рыцарь только C, и тогда «ровно один рыцарь» было бы правдой — но B лжец, противоречие. Значит, B — рыцарь, и ровно один рыцарь: это B. Рыцарей 1.'},
    {q:'В группе 28 туристов, и каждый знает хотя бы один из двух языков — английский или немецкий. Английский знают 20 человек, немецкий — 15. Сколько туристов знают оба языка?', ans:'7', hint:'Формула n(A ∪ B) = n(A) + n(B) − n(A ∩ B): здесь известно всё, кроме пересечения.', sol:'Хотя бы один язык знают все 28 человек. Из формулы: 28 = 20 + 15 − x, откуда x = 35 − 28 = 7. Оба языка знают 7 туристов.'},
    {q:'Сколько трёхзначных чётных чисел можно записать цифрами 1, 2, 3, 4, 5, если цифры в числе не повторяются?', ans:'24', hint:'Начни с последней цифры: она должна быть чётной. Затем выбирай первые две.', sol:'Последняя цифра чётная: 2 или 4 — 2 способа. Первая цифра — любая из 4 оставшихся, вторая — любая из 3 оставшихся. По правилу произведения: 2 · 4 · 3 = 24 числа.'},
    {q:'Сколько натуральных чисел от 1 до 100 делятся на 2 или на 5 (или на оба числа)?', ans:'60', hint:'Сложи, сколько чисел делится на 2 и сколько на 5, а потом вычти числа, которые считались дважды: они делятся на 10.', sol:'На 2 делятся 50 чисел, на 5 — 20 чисел, на 10 (то есть на оба) — 10 чисел. По формуле: 50 + 20 − 10 = 60.'},
    {q:'Шесть друзей встретились, и каждый пожал руку каждому из остальных ровно один раз. Сколько всего было рукопожатий?', ans:'15', hint:'Первый друг жмёт руки пяти остальным. Сколько новых рукопожатий добавит второй, если с первым он уже поздоровался?', sol:'Первый пожимает руку 5 друзьям, второй — ещё 4 новым, третий — 3, четвёртый — 2, пятый — 1, шестой — ни одного нового. Всего 5 + 4 + 3 + 2 + 1 = 15 рукопожатий.'},
    {q:'Трое жителей острова рыцарей и лжецов. Первый сказал: «Среди нас ровно один лжец». Второй: «Среди нас ровно два лжеца». Третий: «Среди нас ровно три лжеца». Сколько среди них лжецов?', ans:'2', hint:'Три утверждения не могут быть верными одновременно — они противоречат друг другу. Сколько из них может быть правдой?', sol:'Утверждения разные, значит, верным может быть не более одного. Тогда рыцарь один (тот, кто сказал правду), а лжецов двое. Проверим: правдой должно быть высказывание «ровно два лжеца» — оно у второго. Тогда второй — рыцарь, первый и третий — лжецы, лжецов действительно два. Ответ: 2.'},
    {q:'На карточке написано пять утверждений. 1: «На этой карточке ровно одно ложное утверждение». 2: «…ровно два ложных». 3: «…ровно три ложных». 4: «…ровно четыре ложных». 5: «…ровно пять ложных». Сколько ложных утверждений на карточке?', ans:'4', hint:'Два разных утверждения не могут быть верными одновременно. Значит, сколько на карточке верных утверждений? Сколько тогда ложных?', sol:'Утверждения друг другу противоречат, значит, верным может быть не более одного. Если верных нет, то ложных 5, и верным оказалось бы утверждение 5 — противоречие. Значит, верное ровно одно, ложных 4. Это согласуется: верно утверждение 4 «ровно четыре ложных». Ответ: 4.'},
    {q:'Среди 100 туристов 75 знают английский, 83 — немецкий, а 10 не знают ни одного из этих языков. Сколько туристов знают оба языка?', ans:'68', hint:'Сначала найди, сколько туристов знают хотя бы один из двух языков.', sol:'Хотя бы один язык знают 100 − 10 = 90 человек. Из формулы 90 = 75 + 83 − x получаем x = 158 − 90 = 68. Оба языка знают 68 туристов.'}

  bonus: {q:'В классе каждый ученик изучает хотя бы один из двух языков: английский или немецкий. Английский изучают 25 человек, немецкий — 20. Известно, что ровно 33 ученика изучают только один язык. Сколько всего учеников в классе?', ans:'39', hint:'Пусть оба языка изучают x человек. Сколько тогда изучают только английский и сколько только немецкий?', sol:'Пусть оба языка изучают x человек. Только английский изучают 25 − x, только немецкий — 20 − x. Всего «только один язык»: (25 − x) + (20 − x) = 45 − 2x = 33, откуда x = 6. Всего учеников: 25 + 20 − 6 = 39. Проверка: только английский 19, только немецкий 14, 19 + 14 = 33, и 19 + 14 + 6 = 39.'},
